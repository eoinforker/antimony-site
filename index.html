<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#F4F3EE">
<meta name="description" content="Antimony builds software for the people who make the work. Our first product is Orbe.">
<meta property="og:title" content="Antimony"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Antimony</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One screen. The bands lift, the crystal builds in pixels on black; then the ground turns to paper,
   every pixel flies down into the small mark at the foot, and two paragraphs are all that is left. */
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifItalicVF.woff2") format("woff2"); font-weight: 200 700; font-style: italic; font-display: block; }
:root { --ink: #060808; --paper: #F4F3EE; --text: #26292A; --soft: #6E716D; --sky: #94E6FF; --cobalt: #2448FF;
  --serif: "Timeless Serif", "Iowan Old Style", Georgia, serif; color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 400 19px/1.5 var(--serif); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color .7s cubic-bezier(.4,0,.2,1); }
body.paper { background: var(--paper); }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
::selection { background: var(--sky); color: var(--ink); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.load { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: repeat(6, 1fr); pointer-events: none; }
.load i { background: linear-gradient(180deg, var(--ink), var(--cobalt) 40%, var(--sky) 62%, var(--paper) 80%, var(--ink)); background-size: 100% 300%; animation: band 1.4s cubic-bezier(.6,0,.2,1) forwards; }
.load i:nth-child(2) { animation-delay: .05s } .load i:nth-child(3) { animation-delay: .1s } .load i:nth-child(4) { animation-delay: .15s } .load i:nth-child(5) { animation-delay: .2s } .load i:nth-child(6) { animation-delay: .25s }
@keyframes band { 0% { background-position: 0 0 } 70% { background-position: 0 100%; transform: none } 100% { background-position: 0 100%; transform: translateY(-101%) } }
main { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; padding: 16vh max(24px, env(safe-area-inset-right, 0px)) 0 max(24px, env(safe-area-inset-left, 0px)); }
main p { opacity: 0; transform: translateY(6px); transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2,.7,.2,1); text-wrap: pretty; }
main p + p { margin-top: 1.4em; }
body.said main p { opacity: 1; transform: none; }
body.said main p:nth-child(2) { transition-delay: .35s; }
main em { font-style: italic; }
main a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: rgba(38,41,42,.35); transition: text-decoration-color .2s; }
main a:hover { text-decoration-color: var(--text); }
.mark { position: fixed; z-index: 3; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; transform: translateX(-50%); border-radius: 4px; cursor: pointer; background: none; border: 0; }
@media (max-width: 600px) { body { font-size: 17.5px; } main { padding-top: 13vh; } }
@media (prefers-reduced-motion: reduce) { .load { display: none; } body, main p { transition: none; } }
</style>
<div class="load" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <p><em>Antimony</em> builds software for the people who make the work. Our first product is <a href="https://eoinforker.github.io/orbe-site/">Orbe</a>, the creator's side of every sponsorship deal.</p>
  <p>We sit on their side of the table, and we mean to stay there for a long time.</p>
</main>
<button class="mark" id="mark" aria-label="Antimony. Play the opening again"></button>
<script>
(() => {
"use strict";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const c = document.getElementById("c"), x = c.getContext("2d");
// the mark on its 100-unit grid: four facets and the A with its reflected crossbar
const FACETS = [ { p: [[50,5],[22,29],[22,71],[50,15]], k: 2 }, { p: [[78,71],[78,29],[50,5],[50,15]], k: 1 }, { p: [[50,15],[22,71],[50,58],[78,71]], k: 3 }, { p: [[22,71],[50,95],[78,71],[50,58]], k: 4 } ];
const LINES = [[[22,71],[50,15]], [[50,15],[78,71]], [[22,71],[50,58]], [[50,58],[78,71]], [[50,2],[50,15]]];
// each class has a colour on black and a colour on paper
const DARK  = ["#F2F1EC", "#94E6FF", "#16201E", "#2C3A37", "#1E2A27"];
const LIGHT = ["#0B0D0C", "#2448FF", "#C6CAC4", "#DCDED8", "#B9BEB8"];
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };
const inP = (u, v, p) => { let k = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [a, b] = p[i], [d, e] = p[j]; if ((b > v) !== (e > v) && u < (d - a) * (v - b) / (e - b) + a) k = !k; } return k; };
const sd = (u, v, [[a, b], [d, e]]) => { const dx = d - a, dy = e - b, t = Math.max(0, Math.min(1, ((u - a) * dx + (v - b) * dy) / (dx * dx + dy * dy))); return Math.hypot(u - a - t * dx, v - b - t * dy); };
function sample(n, lineW) {
  const out = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u = (i + .5) / n * 100, v = (j + .5) / n * 100; let k = -1;
    if (LINES.some(s => sd(u, v, s) < lineW)) k = 0; else for (const f of FACETS) if (inP(u, v, f.p)) { k = f.k; break; }
    if (k >= 0) out.push({ i, j, u, v, k });
  }
  return out;
}
let W, H, big, small, P = [], T0, mx = -1e9, my = -1e9;
const BUILD = 1.3, HOLD = 3.2, FLY = 1.6;   // seconds: the build starts, the flight starts, the flight lasts
function layout() {
  const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
  const bs = Math.min(H * 0.7, W * 0.86), bn = W < 600 ? 44 : 60;
  big = { s: bs, n: bn, cs: bs / bn, ox: W / 2 - bs / 2, oy: H * 0.47 - bs / 2 };
  const ss = 52, sn = 18, rect = document.getElementById("mark").getBoundingClientRect();
  small = { s: ss, n: sn, cs: ss / sn, ox: rect.left + rect.width / 2 - ss / 2, oy: rect.top + rect.height / 2 - ss / 2 };
  const B = sample(bn, 1.25), S = sample(sn, 3.2);
  // every pixel of the mark at the foot is one pixel of the big crystal, of the same kind; the rest fall away
  const pool = [[], [], [], [], []]; B.forEach(b => pool[b.k].push(b)); pool.forEach(p => p.sort(() => Math.random() - .5));
  P = B.map(b => ({ b, s: null, d: Math.random() * 0.9 + b.v / 100 * 0.7, n: Math.random() * 20, w: Math.random() * 0.35 }));
  const byB = new Map(P.map(p => [p.b, p]));
  for (const s of S) { const src = pool[s.k].pop() || pool.find(p => p.length)?.pop(); if (src) byB.get(src).s = s; }
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame() {
  const t = still ? 99 : (performance.now() - T0) / 1000;
  const f = Math.max(0, Math.min(1, (t - BUILD - HOLD) / FLY));
  x.clearRect(0, 0, W, H);
  for (const p of P) {
    const a = Math.max(0, Math.min(1, (t - BUILD - p.d) / 0.25)); if (a <= 0) continue;
    const e = ease(Math.max(0, Math.min(1, (f - p.w * 0.6) / (1 - p.w * 0.6 + 1e-6))));
    const bx = big.ox + p.b.i * big.cs, by = big.oy + p.b.j * big.cs;
    let X, Y, S, col, alpha = 1;
    if (p.s) {
      const sx = small.ox + p.s.i * small.cs, sy = small.oy + p.s.j * small.cs;
      X = bx + (sx - bx) * e; Y = by + (sy - by) * e - Math.sin(e * Math.PI) * 30 * (1 - p.w); S = (big.cs - 1) + ((small.cs - .35) - (big.cs - 1)) * e;
      col = a < 1 ? "#F2F1EC" : mix(DARK[p.b.k], LIGHT[p.b.k], Math.max(0, Math.min(1, (f - 0.78) / 0.22)));
    } else {
      X = bx + (bx - W / 2) * e * 0.25; Y = by + e * 40; S = (big.cs - 1) * (1 - e); alpha = 1 - e;
      col = a < 1 ? "#F2F1EC" : DARK[p.b.k];
    }
    if (f <= 0 && a >= 1) {   // while the crystal stands, it answers the pointer and flickers now and then
      const near = Math.hypot(bx - mx, by - my) < big.cs * 6, flick = t > BUILD + 2 && Math.sin(t * 3 + p.n * 7) > .996;
      if (near || flick) col = p.b.k === 1 ? "#F2F1EC" : "#94E6FF";
      if (near) { X += (Math.random() - .5) * 2; }
    }
    if (f >= 1 && p.s) { const near = Math.hypot(X - mx, Y - my) < 30; if (near && Math.random() < .25) col = p.b.k === 1 ? "#0B0D0C" : "#2448FF"; }
    S *= a < 1 ? a : 1; if (S <= 0.05 || alpha <= 0.01) continue;
    x.globalAlpha = alpha; x.fillStyle = col; x.fillRect(X + (big.cs - S) / 2 * (1 - e), Y + (big.cs - S) / 2 * (1 - e), S, S);
  }
  x.globalAlpha = 1;
  document.body.classList.toggle("paper", t > BUILD + HOLD + FLY * 0.8);
  document.body.classList.toggle("said", t > BUILD + HOLD + FLY + 0.5);
  requestAnimationFrame(frame);
}
function play() { T0 = performance.now(); layout(); document.body.classList.remove("paper", "said"); }
addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; });
addEventListener("pointerleave", () => mx = my = -1e9);
addEventListener("resize", () => { const t0 = T0; layout(); T0 = t0; });
document.getElementById("mark").addEventListener("click", play);
(document.fonts ? document.fonts.load('400 19px "Timeless Serif"') : Promise.resolve()).catch(() => {}).finally(() => { play(); requestAnimationFrame(frame); });
})();
</script>

</html>
