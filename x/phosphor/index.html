<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Antimony Phosphor</title>
<style>
/* After the Cyberspace terminal: text is drawn to a low-resolution raster, then a CRT is modelled in WebGL2:
   the beam's spot, scanlines that widen with brightness, phosphor that decays frame to frame, bloom, barrel curve,
   an aperture grille and a rolling bar. Keyboard and tap drive it. */
@font-face { font-family: "Commit Mono"; src: url("../../assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 400 600; font-display: block; }
:root { --ink: #020303; --text: #7D8C89; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--ink); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
.keys { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.keys button { all: unset; cursor: pointer; font: 500 11px "Commit Mono", ui-monospace, monospace; letter-spacing: .12em; color: var(--text); border: 1px solid #172220; padding: 7px 10px; border-radius: 4px; }
.keys button:hover, .keys button:focus-visible { color: #DFF9FF; border-color: #2B5A61; }
.keys a { font: 500 11px "Commit Mono", monospace; letter-spacing: .12em; color: var(--text); padding: 7px 10px; text-decoration: none; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; color: #94E6FF; font-family: monospace; }
</style>
<canvas id="crt" aria-label="An Antimony terminal on a modelled CRT screen. Press a number or tap a key below."></canvas>
<div class="keys" id="keys">
  <button data-k="1">1 ORBE</button><button data-k="2">2 COMPANY</button><button data-k="3">3 ELEMENT 51</button><button data-k="4">4 LETTERS</button><button data-k="0">0 HOME</button>
  <a href="https://eoinforker.github.io/orbe-site/">VISIT ORBE ↗</a>
</div>
<script>
(() => {
"use strict";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("crt"), gl = canvas.getContext("webgl2", { antialias: false });
if (!gl) { canvas.remove(); document.body.insertAdjacentHTML("beforeend", '<div class="fallback">ANTIMONY · MAKERS OF ORBE</div>'); return; }
// ── the raster: a character grid drawn into a small canvas ──
const NARROW = innerWidth < innerHeight; const COLS = NARROW ? 38 : 64, ROWS = NARROW ? 36 : 26, CW = 10, CH = 18;
const ras = document.createElement("canvas"); ras.width = COLS * CW; ras.height = ROWS * CH; const r = ras.getContext("2d");
let lines = [], typed = 0, typeAt = 0, cursorOn = true;
// pages as rows: a string is prose (wrapped to the raster), [a, b] is a label and a value joined by leaders
const PAGES = {
  0: ["#ANTIMONY SYSTEMS · LONDON · MMXXVI", "", ["power", "ok"], ["element 51", "found"], ["bonded", "never alone"], ["orbe", "online"], "",
      "#SOFTWARE FOR THE PEOPLE WHO MAKE THE WORK.", "", "[1] ORBE", "[2] COMPANY", "[3] ELEMENT 51", "[4] LETTERS", "", "> _"],
  1: ["#[1] ORBE", "", "The creator's side of every sponsorship deal.", "", "It negotiates inside the creator's own rules, waits for one tap on anything binding, and holds the brand's money until the work is delivered.", "",
      "#SAMPLE FROM THE ORBE DEMO, MADE UP", ["Kettle & Crumb's offer", "£600"], ["Ada's floor", "£900"], ["Orbe's counter", "£900"], ["Status", "waiting for Ada"], "", "Visit Orbe: the link below.", "", "> _"],
  2: ["#[2] COMPANY", "", "Antimony is a London company. We sit on the side of the person who made the work, never across the table from them.", "", "We earn when they earn. We build for decades, not rounds: plain records, clear rules.", "", "> _"],
  3: ["#[3] ELEMENT 51", "", ["Symbol", "Sb"], ["Atomic mass", "121.760 u"], "", "Antimony is almost never found alone in nature; its old name was read as anti-monos, not alone. Alchemists used it to purify gold.", "", "Our mark is a crystal with an A inside. The A's crossbar is its own reflection.", "", "> _"],
  4: ["#[4] LETTERS", "", "Occasional, numbered letters from the company.", "", ["001 Never alone", "in preparation"], "", "> _"],
};
const WIDTH = COLS - 4;
function lay(page) {
  const out = [];
  for (const row of page) {
    if (Array.isArray(row)) { const [a, b] = row; out.push(a + " " + ".".repeat(Math.max(2, WIDTH - a.length - b.length - 2)) + " " + b); continue; }
    const head = row.startsWith("#"), txt = head ? row.slice(1) : row;
    if (txt.length <= WIDTH) { out.push((head ? "#" : "") + txt); continue; }
    let line = ""; for (const w of txt.split(" ")) { if ((line + " " + w).trim().length > WIDTH) { out.push((head ? "#" : "") + line.trim()); line = w; } else line += " " + w; } if (line.trim()) out.push((head ? "#" : "") + line.trim());
  }
  return out;
}
function show(k) { lines = lay(PAGES[k] || PAGES[0]); typed = still ? 1e9 : 0; typeAt = performance.now(); }
function drawRaster(now) {
  if (!still) typed = Math.floor((now - typeAt) / 1000 * 900);   // characters a second, as a fast terminal prints
  r.fillStyle = "#000"; r.fillRect(0, 0, ras.width, ras.height);
  r.font = '500 15px "Commit Mono", ui-monospace, monospace'; r.textBaseline = "top";
  let n = typed;
  lines.forEach((l, i) => {
    const head = l.startsWith("#"), raw = head ? l.slice(1) : l;
    const t = raw.replace("_", Math.floor(now / 530) % 2 ? "█" : " ");
    const shown = n >= t.length ? t : t.slice(0, Math.max(0, n)); n -= t.length + 4;
    r.fillStyle = head ? "#fff" : "#b9c4c2"; r.fillText(shown, CW * 2, CH * (i + 1.5));
  });
}
// ── the tube ──
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
const prog = f => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f)); gl.linkProgram(p); return p; };
const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const HEAD = `#version 300 es
precision highp float; precision highp int; out vec4 o;`;
// pass 1: the beam. Scanlines whose width grows with brightness, a horizontal spot, and phosphor that decays from the last frame.
const BEAM = HEAD + `
uniform sampler2D uSrc; uniform sampler2D uPrev; uniform vec2 uSrcSize; uniform vec2 uOut; uniform float uDecay;
void main(){
  vec2 uv = gl_FragCoord.xy / uOut; vec2 sp = vec2(uv.x, 1.0 - uv.y) * uSrcSize; float rowF = sp.y * 0.5 - 0.5, base = floor(rowF), tot = 0.0;
  for (int k = -1; k <= 1; k++) { float row = base + float(k); float lum = 0.0;
    for (int i = -1; i <= 1; i++) { float w = exp(-0.5 * float(i * i) / 0.45); lum += w * texture(uSrc, vec2((sp.x + float(i) * 0.6) / uSrcSize.x, (row * 2.0 + 1.0) / uSrcSize.y)).r; }
    lum /= 1.66; float sig = mix(0.22, 0.5, clamp(lum, 0.0, 1.0)); float dy = rowF - row; tot += lum * exp(-0.5 * dy * dy / (sig * sig)); }
  float prev = texture(uPrev, uv).r; o = vec4(max(tot, prev * uDecay), 0.0, 0.0, 1.0);
}`;
// pass 2: bloom, thresholded and blurred in one direction at a time
const BLUR = HEAD + `
uniform sampler2D uTex; uniform vec2 uOut; uniform vec2 uDir; uniform float uTh;
void main(){ vec2 uv = gl_FragCoord.xy / uOut, st = uDir / uOut; float w[5] = float[](0.227, 0.194, 0.121, 0.054, 0.016), a = 0.0;
  for (int i = -4; i <= 4; i++) a += max(texture(uTex, uv + st * float(i) * 2.0).r - uTh, 0.0) * w[i < 0 ? -i : i]; o = vec4(a, 0.0, 0.0, 1.0); }`;
// pass 3: the glass. Barrel curve, misconvergence, aperture grille, a rolling bar, flicker, noise, vignette, the phosphor's colour.
const GLASS = HEAD + `
uniform sampler2D uScr; uniform sampler2D uBloom; uniform vec2 uRes; uniform float uT; uniform vec3 uPh; uniform float uSrcAsp;
uint bits(uvec3 v){ v = v * 1664525u + 1013904223u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; v ^= v >> 16u; v.x += v.y*v.z; return v.x; }
float hsh(vec3 p){ return float(bits(uvec3(ivec3(p))) & 0xffffffu) / 16777215.0; }
vec2 warp(vec2 q, float k){ return 0.5 + 0.5 * q * (1.0 + k * dot(q, q)) / (1.0 + 2.0 * k); }
float rbox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
void main(){
  float s = min(uRes.x / (4.0 / 3.0), uRes.y); vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / s * 2.0; vec2 hs = vec2(0.94 * 4.0 / 3.0, 0.94);
  if (uRes.x < uRes.y) { float asp = uSrcAsp; s = uRes.x; p = (gl_FragCoord.xy - 0.5 * uRes) / s * 2.0; hs = vec2(0.94, min(0.94 / asp, 0.94 * uRes.y / uRes.x - 0.12)); }
  vec2 q = p / hs, uv = warp(q, 0.09);
  vec3 col = uPh * 0.035 * exp(-2.0 * length(p));
  float edge = smoothstep(0.004, -0.004, rbox(uv - 0.5, vec2(0.51), 0.035));
  if (edge > 0.0) {
    float nt = floor(uT * 60.0); vec2 g = step(vec2(0.0), uv) * step(uv, vec2(1.0)); float on = g.x * g.y;
    float off = 0.0007;
    vec3 lum = vec3(texture(uScr, uv + vec2(off, 0.0)).r, texture(uScr, uv).r, texture(uScr, uv - vec2(off, 0.0)).r) * on;
    vec3 gx = uPh * lum * 1.7 + mix(uPh, vec3(1.0), 0.35) * texture(uBloom, uv).r * on * 1.4;
    gx *= 1.0 - 0.22 * (0.5 + 0.5 * cos(gl_FragCoord.x * 6.2831853 / 3.0));
    float band = fract(uv.y - uT * 0.11); gx *= 1.0 + 0.06 * exp(-pow((band - 0.5) / 0.08, 2.0));
    gx *= 0.985 + 0.015 * sin(uT * 120.0);
    gx += uPh * (hsh(vec3(gl_FragCoord.xy, nt)) - 0.5) * 0.06 * on;
    vec2 v = uv - 0.5; gx *= 1.0 - smoothstep(0.18, 0.55, dot(v, v)) * 0.6;
    gx += vec3(0.012) * (1.0 - smoothstep(0.0, 0.7, length(q - vec2(-0.45, 0.45))));   // glass reflection
    col = mix(col, gx + uPh * 0.01, edge);
  }
  o = vec4(col, 1.0);
}`;
const pBeam = prog(BEAM), pBlur = prog(BLUR), pGlass = prog(GLASS);
const vao = gl.createVertexArray();
function tex(w, h, fmt = gl.RGBA8) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
const fb = t => { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; };
const src = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, src);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const SW = COLS * CW, SH = ROWS * CH * 2;   // the screen raster: twice the rows, so each text row spans two scanlines
let scr = [tex(SW, SH), tex(SW, SH)], scrF = scr.map(fb), bl = [tex(SW / 2, SH / 2), tex(SW / 2, SH / 2)], blF = bl.map(fb), cur = 0;
const u = (p, n) => gl.getUniformLocation(p, n);
let W, H;
function size() { const d = Math.min(2, devicePixelRatio || 1); W = canvas.width = Math.round(innerWidth * d); H = canvas.height = Math.round(innerHeight * d); }
const t0 = performance.now();
function frame(now) {
  drawRaster(now);
  gl.bindTexture(gl.TEXTURE_2D, src); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ras);
  gl.bindVertexArray(vao);
  const nxt = 1 - cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, scrF[nxt]); gl.viewport(0, 0, SW, SH); gl.useProgram(pBeam);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform1i(u(pBeam, "uSrc"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, scr[cur]); gl.uniform1i(u(pBeam, "uPrev"), 1);
  gl.uniform2f(u(pBeam, "uSrcSize"), SW, SH); gl.uniform2f(u(pBeam, "uOut"), SW, SH); gl.uniform1f(u(pBeam, "uDecay"), still ? 0 : 0.72);
  gl.drawArrays(gl.TRIANGLES, 0, 3); cur = nxt;
  gl.useProgram(pBlur); gl.uniform1i(u(pBlur, "uTex"), 0); gl.uniform2f(u(pBlur, "uOut"), SW / 2, SH / 2);
  gl.bindFramebuffer(gl.FRAMEBUFFER, blF[0]); gl.viewport(0, 0, SW / 2, SH / 2); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scr[cur]); gl.uniform2f(u(pBlur, "uDir"), 1, 0); gl.uniform1f(u(pBlur, "uTh"), 0.45); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, blF[1]); gl.bindTexture(gl.TEXTURE_2D, bl[0]); gl.uniform2f(u(pBlur, "uDir"), 0, 1); gl.uniform1f(u(pBlur, "uTh"), 0.0); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pGlass);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scr[cur]); gl.uniform1i(u(pGlass, "uScr"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bl[1]); gl.uniform1i(u(pGlass, "uBloom"), 1);
  gl.uniform2f(u(pGlass, "uRes"), W, H); gl.uniform1f(u(pGlass, "uT"), still ? 0 : (now - t0) / 1000); gl.uniform3f(u(pGlass, "uPh"), 0.58, 0.9, 1.0); gl.uniform1f(u(pGlass, "uSrcAsp"), (COLS * CW) / (ROWS * CH));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
addEventListener("keydown", e => { if (/^[0-4]$/.test(e.key)) show(+e.key); else if (e.key === "Escape") show(0); });
document.querySelectorAll("#keys [data-k]").forEach(b => b.addEventListener("click", () => show(+b.dataset.k)));
addEventListener("resize", size); size(); show(0);
(document.fonts ? document.fonts.load('500 15px "Commit Mono"') : Promise.resolve()).catch(() => {}).finally(() => requestAnimationFrame(frame));
})();
</script>

</html>
