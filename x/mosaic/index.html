<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600&display=swap">
<style>
/* A living wall of words, laid out from the viewer's own screen. Its brightness draws the crystal and its A.
   The lockup panel sits left on wide screens and rises from the bottom on phones. */
:root { --ground: #070C0B; --paper: #F3F0E8; --text: rgba(243,240,232,.72); --faint: rgba(243,240,232,.34); --sky: #94E6FF; --chip: rgba(243,240,232,.16);
  --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; --mono: "Commit Mono", ui-monospace, Menlo, monospace; color-scheme: dark; }
@font-face { font-family: "Commit Mono"; src: url("../fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 400 600; font-display: block; }
html, body { height: 100%; background: var(--ground); overflow: hidden; }
body { color: var(--text); font: 600 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
button { all: unset; cursor: pointer; }
:focus-visible { outline: 1px solid var(--paper); outline-offset: 3px; }
header { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; pointer-events: none;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) 0 max(28px, env(safe-area-inset-left, 0px)); }
header > * { pointer-events: auto; display: flex; gap: 14px; align-items: baseline; }
header b { color: var(--paper); font-weight: 600; letter-spacing: .3em; }
header button:hover, header a:hover { color: var(--paper); }
#panel { position: fixed; z-index: 2; left: 0; top: 0; bottom: 0; width: min(46vw, 640px); display: flex; flex-direction: column; justify-content: center; gap: 26px;
  padding: 0 32px 0 max(28px, env(safe-area-inset-left, 0px)); background: linear-gradient(90deg, rgba(7,12,11,.96) 62%, rgba(7,12,11,0));
  transform: translateX(-104%); transition: transform 420ms cubic-bezier(.33,1,.68,1); }
#panel.on { transform: none; }
.meta { color: var(--text); white-space: pre; line-height: 1.5; font-weight: 500; letter-spacing: .08em; }
.meta i { font-style: normal; color: var(--sky); }
h1 { font: 600 clamp(36px, 4.6vw, 74px)/.95 var(--sans); letter-spacing: -.055em; text-transform: none; color: var(--paper); max-width: 10ch; text-wrap: balance; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px; background: var(--chip); color: var(--paper); font-weight: 600; letter-spacing: .04em; }
.chip.solid { background: var(--paper); color: var(--ground); }
.chip.solid::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 1px var(--ground); }
.chip[aria-disabled="true"] { color: var(--faint); cursor: default; }
a.chip { text-decoration: none; }
a.chip:hover { background: #fff; color: var(--ground); }
footer { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(28px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px)); }
#hint { min-height: 1.3em; text-align: center; transition: opacity .3s; }
#hint b { color: var(--paper); font-weight: 600; }
#hint i { font-style: normal; color: var(--sky); }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--paper); }
@media (max-width: 760px) {
  #panel { top: auto; width: 100%; height: auto; gap: 16px; padding: 26px max(20px, env(safe-area-inset-right, 0px)) calc(70px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    background: linear-gradient(0deg, rgba(7,12,11,.97) 70%, rgba(7,12,11,0)); transform: translateY(104%); }
  h1 { font-size: clamp(32px, 9vw, 44px); max-width: 12ch; }
  header { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  #links, header .sub { display: none; }
  header > * { white-space: nowrap; }
}
</style>
<canvas id="stage" aria-label="A wall of words about Antimony and Orbe; their brightness draws a crystal with the letter A inside"></canvas>
<header>
  <div><b>ANTIMONY</b><span class="sub">Makers of Orbe</span></div>
  <div><span id="links"><a href="https://eoinforker.github.io/orbe-site/" style="color:inherit;text-decoration:none">Orbe</a></span><button id="sound" aria-pressed="false">Sound off</button><button id="replay">Replay</button></div>
</header>
<section id="panel" aria-label="Antimony">
  <div class="meta">ANTIMONY
001 · <i>NEVER ALONE</i>
LONDON · MMXXVI</div>
  <h1>We make things for people who make things.</h1>
  <div class="chips"><a class="chip solid" href="https://eoinforker.github.io/orbe-site/">Open Orbe</a><span class="chip" aria-disabled="true">Letters · Soon</span></div>
</section>
<footer><div id="hint"></div></footer>

<script>
(() => {
"use strict";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── The vocabulary, on Antimony's axis from the person who makes the work to the agent that works for them ──
// skin ids: 0 ink (craft), 1 flap (names), 2 cursor (tools), 3 latent (agents), 4 screen (money), 5 corrupt (friction)
const REALMS = [
  { skin: 0, realm: "Hand", means: "Craft", rule: "How a person makes or judges the work",
    words: ["MAKE", "MADE", "CRAFT", "TASTE", "VOICE", "WORK", "HANDS", "STUDIO", "SONG", "VIDEO", "EDIT", "DRAFT", "TAKE", "CUT", "SCORE", "SKETCH", "SHOOT", "WRITE", "CREATE", "CREATOR", "MAKERS", "ART"] },
  { skin: 1, realm: "Names", means: "Names", rule: "Companies, products and the people on the board",
    words: ["ORBE", "ANTIMONY", "SB", "51", "LONDON", "OXFORD", "DUBLIN", "MONTREAL", "ADA", "KETTLE", "CRUMB", "MANAGER", "ROSTER", "LABEL", "AGENCY"] },
  { skin: 2, realm: "Tools", means: "Tools", rule: "Rules you set and records you keep",
    words: ["RULES", "TAP", "FLOOR", "RECORD", "PROOF", "TERMS", "USAGE", "BRIEF", "INVOICE", "LEDGER", "NOTES", "INBOX", "REPLY", "SIGN"] },
  { skin: 3, realm: "Machine", means: "Agents", rule: "It thinks, or works on your behalf",
    words: ["AGENT", "AGENTS", "MODEL", "COUNTER", "PRICE", "SIGNAL", "ANSWER", "MINUTE", "LEARN", "ASK", "REASON", "MATCH"] },
  { skin: 4, realm: "Money", means: "Money", rule: "Deals, fees and getting paid",
    words: ["DEAL", "DEALS", "£900", "£600", "FEE", "RATE", "PAID", "HELD", "PAYOUT", "SPONSOR", "BRANDS", "OFFER", "VALUE", "WORTH"] },
  { skin: 5, realm: "Friction", means: "Friction", rule: "What goes wrong when you negotiate alone",
    words: ["ALONE", "LOWBALL", "LATE", "CHASE", "UNPAID", "GHOSTED", "EXCLUSIVE", "FINE PRINT", "WAIT"] },
];
const HERO = [ ["ANTIMONY", 1, 0.5, 0.06], ["NEVER", 0, 0.5, 0.47], ["ALONE", 5, 0.5, 0.53], ["ORBE", 1, 0.5, 0.86] ];   // word, skin, x and y in the crystal box
const CHARSET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789£.·/-&' ";
const WORDS = [], WSKIN = [], WIX = new Map();
function wordId(w, skin) { if (!WIX.has(w)) { WIX.set(w, WORDS.length); WORDS.push(w); WSKIN.push(skin); } return WIX.get(w); }
REALMS.forEach(r => r.words.forEach(w => wordId(w, r.skin)));
HERO.forEach(([w, s]) => wordId(w, s));

// ── WebGL2 ──
const canvas = document.getElementById("stage");
const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false });
if (!gl) { canvas.remove(); document.body.insertAdjacentHTML("beforeend", '<div class="fallback">This piece needs WebGL2. <a href="https://eoinforker.github.io/orbe-site/" style="color:#94E6FF">Open Orbe</a></div>'); document.getElementById("panel").classList.add("on"); return; }

function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }

const TILE_VS = `#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec4 aRect;      // x, y, w, h in world px
layout(location=2) in vec4 aMeta;      // level, skin, seed, word
layout(location=3) in vec4 aState;     // reveal, flare, scramble, glitch
uniform vec2 uCam; uniform float uZoom; uniform vec2 uRes;
out vec2 vP; flat out vec4 vRect; flat out vec4 vMeta; flat out vec4 vState;
void main(){
  vec2 world = aRect.xy + aCorner * aRect.zw;
  vec2 px = (world - uCam) * uZoom + 0.5 * uRes;
  gl_Position = vec4(px / uRes * 2.0 - 1.0, 0.0, 1.0); gl_Position.y = -gl_Position.y;
  vP = aCorner * aRect.zw; vRect = aRect; vMeta = aMeta; vState = aState;
}`;
const TILE_FS = `#version 300 es
precision highp float; precision highp int;
in vec2 vP; flat in vec4 vRect; flat in vec4 vMeta; flat in vec4 vState;
uniform sampler2D uAtlas; uniform highp usampler2D uWords; uniform float uTime; uniform float uZoom; uniform float uAdv; uniform float uPad; uniform int uGlyphs;
uniform vec3 uFill[5]; uniform vec3 uInk[5];
out vec4 o;
uint bits(uvec3 v){ v = v * 1664525u + 1013904223u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; v ^= v >> 16u; v.x += v.y*v.z; return v.x; }
float h(vec3 p){ return float(bits(uvec3(ivec3(p))) & 0xffffffu) / 16777215.0; }
void main(){
  float reveal = vState.x; if (reveal <= 0.001) discard;
  int lvl = int(vMeta.x + 0.5), skin = int(vMeta.y + 0.5), word = int(vMeta.w + 0.5); float seed = vMeta.z;
  float flare = vState.y, scram = vState.z, glitch = vState.w;
  vec2 sz = vRect.zw; vec2 p = vP;
  // the tile enters by its skin: ink wipes from the left, flap drops from the top, the rest fade
  float edge = skin == 0 ? p.x / sz.x : skin == 1 ? p.y / sz.y : 0.5;
  if (skin <= 1 && edge > reveal) discard;
  vec3 fill = uFill[lvl], ink = uInk[lvl];
  fill = mix(fill, vec3(0.953, 0.941, 0.91), flare * 0.9); ink = mix(ink, vec3(0.043, 0.078, 0.071), flare);
  float t = uTime;
  // glyphs
  float row = floor(t * 14.0);
  vec2 q = p; if (skin == 5) q.x += glitch * (h(vec3(floor(p.y / 3.0), seed, row)) - 0.5) * sz.y * 1.6;
  float ci = floor((q.x - uPad) / uAdv);
  float a = 0.0;
  uint len = texelFetch(uWords, ivec2(15, word), 0).r;
  if (ci >= 0.0 && ci < float(len)) {
    uint g = texelFetch(uWords, ivec2(int(ci), word), 0).r;
    if (scram > 0.0 && h(vec3(ci, seed * 97.0, row)) < scram) g = uint(h(vec3(ci, seed, row + 7.0)) * float(uGlyphs - 1));
    vec2 gq = vec2((q.x - uPad - ci * uAdv) / uAdv, (p.y - sz.y * 0.5) / (sz.y * 0.74) + 0.5);
    if (all(greaterThanEqual(gq, vec2(0.0))) && all(lessThan(gq, vec2(1.0)))) {
      vec2 auv = vec2((float(g) + gq.x) / float(uGlyphs), gq.y);
      a = texture(uAtlas, auv).r;
    }
  }
  // the cursor skin keeps a block blinking after its word
  if (skin == 2 && ci == float(len) && fract(t * 1.1 + seed) < 0.55 && abs(p.y - sz.y * 0.5) < sz.y * 0.3) a = 1.0;
  // latent dissolves into a dither while it thinks
  if (skin == 3) { float d = h(vec3(gl_FragCoord.xy, row)); a *= step(scram * 0.9, d); fill += (d - 0.5) * 0.05 * scram; }
  vec3 c = mix(fill, ink, a);
  // flap has its split line; screen has its scanlines
  if (skin == 1) c *= 1.0 - 0.35 * smoothstep(1.2, 0.0, abs(p.y - sz.y * 0.5) * uZoom);
  if (skin == 4) c *= 0.88 + 0.12 * step(0.5, fract(gl_FragCoord.y * 0.5));
  float alpha = skin <= 1 ? 1.0 : reveal;
  o = vec4(c * alpha, alpha);
}`;
const FS_VS = `#version 300 es
out vec2 vUv; void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const POST_FS = `#version 300 es
precision highp float; precision highp int;
in vec2 vUv; uniform sampler2D uScene; uniform float uTime; uniform vec2 uRes; uniform vec3 uGround; out vec4 o;
uint bits(uvec3 v){ v = v * 1664525u + 1013904223u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; v ^= v >> 16u; v.x += v.y*v.z; return v.x; }
float h(vec3 p){ return float(bits(uvec3(ivec3(p))) & 0xffffffu) / 16777215.0; }
void main(){
  vec2 q = vUv - 0.5; float d = dot(q, q);
  vec2 off = q * d * 0.012;
  vec4 s = texture(uScene, vUv);
  vec3 c = vec3(texture(uScene, vUv + off).r, s.g, texture(uScene, vUv - off).b) + uGround * (1.0 - s.a);
  // halation: the bright tiles bloom into the ground, as light does in film
  vec3 glow = textureLod(uScene, vUv, 4.0).rgb * 0.55 + textureLod(uScene, vUv, 6.0).rgb * 0.45;
  c += glow * vec3(0.55, 0.85, 1.0) * 0.32;
  c *= 1.0 - smoothstep(0.1, 0.62, d) * 0.5;
  c += (h(vec3(gl_FragCoord.xy, floor(uTime * 24.0))) - 0.5) * 0.05;
  o = vec4(c, 1.0);
}`;
const tileP = program(TILE_VS, TILE_FS), postP = program(FS_VS, POST_FS);
const U = (p, n) => gl.getUniformLocation(p, n);

// glyph atlas, drawn from Commit Mono
const G = CHARSET.length, CELL_W = 48, CELL_H = 72;
const atlasTex = gl.createTexture();
function buildAtlas() {
  const c = document.createElement("canvas"); c.width = G * CELL_W; c.height = CELL_H; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = '500 60px "Commit Mono", ui-monospace, monospace';
  for (let i = 0; i < G; i++) g.fillText(CHARSET[i], i * CELL_W + CELL_W / 2, CELL_H * 0.54);
  gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
// words as glyph indices, one row per word, the length in column 15
const wordTex = gl.createTexture();
(function buildWords() {
  const data = new Uint8Array(16 * WORDS.length);
  WORDS.forEach((w, r) => { for (let i = 0; i < Math.min(14, w.length); i++) data[r * 16 + i] = Math.max(0, CHARSET.indexOf(w[i])); data[r * 16 + 15] = Math.min(14, w.length); });
  gl.bindTexture(gl.TEXTURE_2D, wordTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8UI, 16, WORDS.length, 0, gl.RED_INTEGER, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
})();

// geometry: one quad, instanced per tile
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const staticBuf = gl.createBuffer(), stateBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, staticBuf);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(2, 1);
gl.bindBuffer(gl.ARRAY_BUFFER, stateBuf);
gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(3, 1);
const emptyVao = gl.createVertexArray();

// the palette: five levels of light, from the ground to the lit facet and the paper of the A
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const LEVELS = [["#0C1514", "#263A38"], ["#1F3537", "#86A39E"], ["#4C6F70", "#EEF3F1"], ["#94E6FF", "#062221"], ["#F3F0E8", "#0B1412"]];
const FILL = new Float32Array(LEVELS.flatMap(l => hex(l[0]))), INK = new Float32Array(LEVELS.flatMap(l => hex(l[1])));

// ── layout: built from this screen, so a phone gets its own composition rather than a shrunk one ──
let W, H, dpr, rh, adv, pad, tiles = [], hero = [], N = 0, stateArr, sceneFbo, sceneTex, box;
let rng = 1;
const rand = () => ((rng = (rng * 1664525 + 1013904223) >>> 0) / 4294967296);
const FACETS = [ { p: [[50,5],[22,29],[22,71],[50,15]], lv: 1 }, { p: [[78,71],[78,29],[50,5],[50,15]], lv: 3 }, { p: [[50,15],[22,71],[50,58],[78,71]], lv: 2 }, { p: [[22,71],[50,95],[78,71],[50,58]], lv: 1 } ];
const ALINES = [[[22,71],[50,15]], [[50,15],[78,71]], [[22,71],[50,58]], [[50,58],[78,71]], [[50,3],[50,15]]];
function inPoly(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function segDist(x, y, [[ax, ay], [bx, by]]) { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - ax - t * dx, y - ay - t * dy); }
function level(x, y, w) {
  // sample the tile's left, middle and right, so the A's strokes catch every tile they cross
  const pts = [x - w * 0.42, x, x + w * 0.42].map(px => [(px - box.x) / box.s, (y - box.y) / box.s]);
  const lineW = Math.max(1.3, rh * 0.5 / box.s);
  for (const [u, v] of pts) for (const s of ALINES) if (segDist(u, v, s) < lineW) return 4;
  const [u, v] = pts[1];
  for (const f of FACETS) if (inPoly(u, v, f.p)) return rand() < 0.06 ? Math.max(1, f.lv - 1) : f.lv;
  return rand() < 0.03 ? 1 : 0;
}
function pickWord() { const r = REALMS[Math.floor(rand() * REALMS.length)]; const w = r.words[Math.floor(rand() * r.words.length)]; return [wordId(w, r.skin), r.skin]; }
function layout() {
  dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const narrow = W < 760;
  rh = Math.max(13, Math.min(24, Math.min(W, H) / (narrow ? 34 : 46)));
  adv = rh * 0.42; pad = rh * 0.3;
  // the crystal: right of the panel on wide screens, in the upper part on phones
  const ch = narrow ? Math.min(H * 0.6, W * 1.25) : H * 0.9, cs = ch / 100;
  box = { s: cs, x: (narrow ? W / 2 : W * 0.66) - 50 * cs, y: narrow ? H * 0.06 : H * 0.05 };
  rng = 51; tiles = []; hero = [];
  const heroAt = HERO.map(([w, s, hx, hy]) => ({ w, s, x: box.x + hx * 100 * cs, y: box.y + hy * 100 * cs, placed: false }));
  const gap = Math.max(1.5, rh * 0.08);
  for (let y = -rh; y < H + rh; y += rh + gap) {
    let x = -rand() * rh * 3;
    while (x < W + rh) {
      let id, skin, isHero = false;
      const hw = heroAt.find(h => !h.placed && Math.abs(h.y - (y + rh / 2)) < (rh + gap) / 2 && x + rh * 2 > h.x - (h.w.length * adv + 2 * pad) / 2);
      if (hw) { id = wordId(hw.w, hw.s); skin = hw.s; hw.placed = true; isHero = true; } else [id, skin] = pickWord();
      const w = WORDS[id].length * adv + 2 * pad + (skin === 2 ? adv * 1.2 : 0);
      const lv = isHero ? 4 : level(x + w / 2, y + rh / 2, w);
      const t = { x, y, w, h: rh, lv, skin, seed: Math.floor(rand() * 9999), word: id, cx: x + w / 2, cy: y + rh / 2,
        reveal: 0, flare: 0, scram: 0, glitch: 0, next: rand() * 6, ev: 0, evEnd: 0, evKind: 0, wave: -1 };
      if (isHero) hero.push(t);
      tiles.push(t); x += w + gap;
    }
  }
  N = tiles.length;
  const st = new Float32Array(N * 8);
  tiles.forEach((t, i) => { st.set([t.x, t.y, t.w, t.h, t.lv, t.skin, t.seed, t.word], i * 8); });
  gl.bindBuffer(gl.ARRAY_BUFFER, staticBuf); gl.bufferData(gl.ARRAY_BUFFER, st, gl.STATIC_DRAW);
  stateArr = new Float32Array(N * 4);
  gl.bindBuffer(gl.ARRAY_BUFFER, stateBuf); gl.bufferData(gl.ARRAY_BUFFER, stateArr, gl.DYNAMIC_DRAW);
  // the scene target, with mipmaps for the halation
  if (sceneTex) { gl.deleteTexture(sceneTex); gl.deleteFramebuffer(sceneFbo); }
  sceneTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  const levels = Math.floor(Math.log2(Math.max(canvas.width, canvas.height))) + 1;
  gl.texStorage2D(gl.TEXTURE_2D, levels, gl.RGBA8, canvas.width, canvas.height);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  sceneFbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ── the life of the wall: an intro, then events, contagion and waves ──
// rates per skin, in events per minute: [scramble, glitch]
const RATES = [[1.2, 0], [2.4, 0], [1.4, 0], [3.2, 0.6], [1.6, 0.2], [0.8, 2.4]];
let T0 = performance.now() / 1000, phase = "seed", hoverX = -1e9, hoverY = -1e9, waveWord = -1, waveAt = 0, waveX = 0, waveY = 0;
const panel = document.getElementById("panel"), hint = document.getElementById("hint");
function setHint(html) { hint.style.opacity = 0; setTimeout(() => { hint.innerHTML = html; hint.style.opacity = 1; }, 180); }
function start() { T0 = performance.now() / 1000; phase = "seed"; panel.classList.remove("on"); tiles.forEach(t => { t.reveal = 0; t.flare = 0; }); setHint(""); }
function realmOf(id) { const r = REALMS.find(r => r.words.includes(WORDS[id])) || REALMS[WSKIN[id]]; return r; }
function wave(id, x, y, now) {
  waveWord = id; waveAt = now; waveX = x; waveY = y;
  const r = realmOf(id), n = tiles.filter(t => t.word === id).length;
  setHint(`<b>${WORDS[id]}</b> · <i>${r.realm}</i> · ${r.rule} · ${n} on the wall`);
  sound.word(r.skin);
}
function camAt(t) {
  // seed: close on the first hero word; then one eased move out to the whole wall, zooming about that word
  const h0 = hero[0] || tiles[0], z0 = Math.min(7, W / ((h0.w) * 2.2));
  const k = still ? 1 : Math.min(1, Math.max(0, (t - 1.6) / 3.4)), e = k < 0.5 ? 8 * k ** 4 : 1 - Math.pow(-2 * k + 2, 4) / 2;
  const zoom = Math.exp(Math.log(z0) * (1 - e));
  const drift = still ? 0 : Math.sin(t * 0.05) * rh * 0.6;
  const cx = h0.cx + (W / 2 - h0.cx) * e + drift, cy = h0.cy + (H / 2 - h0.cy) * e;
  return { zoom, cx, cy, e };
}
let lastFrame = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - lastFrame); lastFrame = now;
  const t = now - T0, cam = camAt(t), h0 = hero[0] || tiles[0];
  if (phase === "seed" && t > 1.4) phase = "grow";
  if (phase === "grow" && t > 4.9) { phase = "art"; panel.classList.add("on"); setHint("Hover to look · click a word to follow it"); }
  const maxD = Math.hypot(W, H);
  for (let i = 0; i < N; i++) {
    const tl = tiles[i];
    // entry: the first word alone, then a front of tiles from it outward
    const d = Math.hypot(tl.cx - h0.cx, tl.cy - h0.cy) / maxD;
    const target = still ? 1 : (tl === h0 ? 1 : phase === "seed" ? 0 : Math.max(0, Math.min(1, ((t - 1.4) / 3.2 - d) * 6 + Math.sin(tl.seed) * 0.15)));
    tl.reveal += (target - tl.reveal) * (still ? 1 : 0.25);
    // random events by skin, after the intro
    if (!still && phase === "art" && t > tl.next) {
      const [rs, rg] = RATES[tl.skin], tot = rs + rg;
      tl.evKind = Math.random() * tot < rg ? 1 : 0; tl.ev = t; tl.evEnd = t + 0.25 + Math.random() * 0.6;
      tl.next = t + 60 / Math.max(0.2, tot) * (0.4 + Math.random() * 1.6);
      if (tl.evKind === 1) for (let j = Math.max(0, i - 40); j < Math.min(N, i + 40); j++) {   // glitches catch from neighbours
        const o = tiles[j]; if (o !== tl && Math.hypot(o.cx - tl.cx, o.cy - tl.cy) < rh * 3 && Math.random() < 0.55) { o.evKind = 1; o.ev = t + 0.08; o.evEnd = t + 0.3 + Math.random() * 0.3; }
      }
      if (tl.evKind === 0 && Math.random() < 0.08) sound.grain(tl.skin, tl.cx / W);
    }
    const live = t >= tl.ev && t < tl.evEnd;
    let scram = live && tl.evKind === 0 ? 1 - (t - tl.ev) / (tl.evEnd - tl.ev) : 0;
    let glitch = live && tl.evKind === 1 ? 1 : 0;
    if (phase !== "art" && tl.reveal > 0 && tl.reveal < 0.95) scram = 1 - tl.reveal;   // words resolve as they enter
    // attention: the pointer settles the tiles it passes, and a clicked word lights wherever it appears
    const hd = Math.hypot((tl.cx - hoverX), (tl.cy - hoverY));
    let fl = hd < rh * 4 ? 0.35 * (1 - hd / (rh * 4)) : 0;
    if (hd < rh * 4) scram *= hd / (rh * 4);
    if (tl.word === waveWord) { const arrive = waveAt + Math.hypot(tl.cx - waveX, tl.cy - waveY) / 900; if (now > arrive) fl = Math.max(fl, Math.max(0.25, 1 - (now - arrive) * 0.35)); }
    tl.flare += (fl - tl.flare) * 0.2;
    stateArr[i * 4] = tl.reveal; stateArr[i * 4 + 1] = tl.flare; stateArr[i * 4 + 2] = scram; stateArr[i * 4 + 3] = glitch;
  }
  // draw the wall into the scene target
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(tileP); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, stateBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, stateArr);
  gl.uniform2f(U(tileP, "uCam"), cam.cx, cam.cy); gl.uniform1f(U(tileP, "uZoom"), cam.zoom); gl.uniform2f(U(tileP, "uRes"), W, H);
  gl.uniform1f(U(tileP, "uTime"), t); gl.uniform1f(U(tileP, "uAdv"), adv); gl.uniform1f(U(tileP, "uPad"), pad); gl.uniform1i(U(tileP, "uGlyphs"), G);
  gl.uniform3fv(U(tileP, "uFill"), FILL); gl.uniform3fv(U(tileP, "uInk"), INK);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(U(tileP, "uAtlas"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, wordTex); gl.uniform1i(U(tileP, "uWords"), 1);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
  gl.disable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.generateMipmap(gl.TEXTURE_2D);
  // film: halation, a little fringe, vignette, grain
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(postP); gl.bindVertexArray(emptyVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(U(postP, "uScene"), 0);
  gl.uniform1f(U(postP, "uTime"), t); gl.uniform2f(U(postP, "uRes"), canvas.width, canvas.height); gl.uniform3fv(U(postP, "uGround"), hex("#070C0B"));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

// ── sound: grains in each skin's voice, synthesised, off until asked for ──
const sound = (() => {
  let ac = null, out = null, on = false;
  const VOICE = [ { f: 2400, q: 3, d: 0.05 }, { f: 900, q: 8, d: 0.03 }, { f: 3600, q: 12, d: 0.012 }, { f: 5200, q: 20, d: 0.02 }, { f: 1400, q: 6, d: 0.025 }, { f: 300, q: 2, d: 0.08 } ];
  const NOTES = [220, 246.94, 293.66, 329.63, 369.99];   // five notes of D, the room's key
  function init() {
    ac = new AudioContext(); out = ac.createGain(); out.gain.value = 0.5;
    const room = ac.createConvolver(), len = ac.sampleRate * 2.4, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    room.buffer = ir; const wet = ac.createGain(); wet.gain.value = 0.35; out.connect(ac.destination); out.connect(room); room.connect(wet); wet.connect(ac.destination);
  }
  function grain(skin, pan = 0.5, vol = 0.08) {
    if (!on) return; const v = VOICE[skin], t = ac.currentTime, n = Math.ceil(ac.sampleRate * v.d);
    const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = v.f * (0.8 + Math.random() * 0.4); f.Q.value = v.q;
    const g = ac.createGain(); g.gain.value = vol; const p = ac.createStereoPanner(); p.pan.value = pan * 2 - 1;
    s.connect(f); f.connect(g); g.connect(p); p.connect(out); s.start(t);
  }
  function word(skin) {
    if (!on) return; grain(skin, 0.5, 0.2);
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = "sine"; o.frequency.value = NOTES[skin % NOTES.length] * (skin >= 3 ? 2 : 1);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6); o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.7);
  }
  return { grain, word, toggle() { if (!ac) init(); on = !on; if (on) ac.resume(); return on; } };
})();

// ── input ──
function worldAt(x, y) { const c = camAt(performance.now() / 1000 - T0); return [(x - W / 2) / c.zoom + c.cx, (y - H / 2) / c.zoom + c.cy]; }
canvas.addEventListener("pointermove", e => { [hoverX, hoverY] = worldAt(e.clientX, e.clientY); });
canvas.addEventListener("pointerleave", () => { hoverX = hoverY = -1e9; });
canvas.addEventListener("click", e => {
  if (phase !== "art") { T0 -= 10; return; }   // a click during the intro skips it
  const [x, y] = worldAt(e.clientX, e.clientY);
  const tl = tiles.find(t => x >= t.x && x <= t.x + t.w && y >= t.y && y <= t.y + t.h);
  if (tl) wave(tl.word, tl.cx, tl.cy, performance.now() / 1000);
});
document.getElementById("replay").addEventListener("click", start);
const sb = document.getElementById("sound"); sb.addEventListener("click", () => { const on = sound.toggle(); sb.textContent = on ? "Sound on" : "Sound off"; sb.setAttribute("aria-pressed", on); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const ph = phase; layout(); if (ph === "art") { T0 = performance.now() / 1000 - 6; phase = "art"; } }, 120); });

(document.fonts ? document.fonts.load('500 60px "Commit Mono"') : Promise.resolve()).catch(() => {}).finally(() => { buildAtlas(); layout(); start(); requestAnimationFrame(frame); });
})();
</script>
