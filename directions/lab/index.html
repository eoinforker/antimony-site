@font-face { font-family: "Timeless"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
@font-face { font-family: "Commit"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
:root {
  --ink: #0B0C0C; --paper: #EEEAE0; --sky: #94E6FF; --prussian: #1F3F7A; --cobalt: #2448FF;
  --gut: 32px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; }
body { font-family: "Timeless", Georgia, serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }
body.hot canvas#gl { cursor: pointer; }

/* The institutional voice: rare, terse, top centre. */
#voice {
  position: fixed; top: 26px; left: var(--gut); right: var(--gut);
  margin: 0;
  font: 400 11px/1.6 "Commit", ui-monospace, monospace; letter-spacing: .2em;
  color: var(--paper); text-align: center; white-space: pre-wrap; pointer-events: none;
  opacity: 0; transition: opacity .9s cubic-bezier(.2,.7,.1,1);
}
#voice.on { opacity: 1; }
.freeze #voice, .freeze #mark { transition: none !important; }
#voice .lab { color: var(--sky); }
#voice .hi { background: var(--sky); color: var(--ink); }
#voice .ghost { visibility: hidden; }
#voice.quiet { letter-spacing: .08em; color: rgba(238,234,224,.78); }

/* The signature, lower left. */
#mark { position: fixed; left: var(--gut); bottom: 30px; margin: 0; pointer-events: none; opacity: 0; }
#mark svg { display: block; width: 128px; height: auto; color: var(--paper); --lit: var(--sky); }
#mark p { margin: 12px 0 0; font-size: 13px; line-height: 1.35; letter-spacing: .01em; color: rgba(238,234,224,.62); font-weight: 380; }

/* Sound: a small drawn toggle, lower right. */
#sound {
  position: fixed; right: calc(var(--gut) - 10px); bottom: 22px; width: 40px; height: 40px; padding: 0;
  border: 0; background: none; color: rgba(238,234,224,.62); cursor: pointer; opacity: 0;
  transition: color .4s;
}
#sound:hover, #sound:focus-visible { color: var(--paper); }
#sound:focus-visible { outline: 1px solid rgba(148,230,255,.6); outline-offset: 2px; border-radius: 50%; }
#sound svg { width: 20px; height: 20px; display: block; margin: auto; overflow: visible; }
#sound .wave { transition: opacity .5s, transform .5s cubic-bezier(.2,.7,.1,1); transform-origin: 7px 10px; }
#sound .off { transition: opacity .5s; }
#sound[aria-pressed="false"] .wave { opacity: 0; transform: scale(.6); }
#sound[aria-pressed="true"] .off { opacity: 0; }

/* Specimen labels, projected onto the glass from the scene. */
#specimens { position: fixed; inset: 0; pointer-events: none; }
#specimens a {
  position: absolute; left: 0; top: 0; transform: translate(-50%, 0); white-space: nowrap;
  font-size: 16px; letter-spacing: .01em; color: var(--paper); text-decoration: none; opacity: 0;
  padding: 6px 8px 8px; pointer-events: none; will-change: transform;
}
#specimens a span { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .5s cubic-bezier(.2,.7,.1,1); padding-bottom: 2px; }
#specimens a.live { pointer-events: auto; }
#specimens a.hot span, #specimens a:hover span, #specimens a:focus-visible span { background-size: 100% 1px; }
#specimens a:focus-visible { outline: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr:focus-visible { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: auto; height: auto; clip: auto; overflow: visible;
  font: 400 11px "Commit", monospace; letter-spacing: .16em; color: var(--ink); background: var(--sky); border: 0; padding: 8px 12px; }
noscript p { position: fixed; left: var(--gut); top: 40%; max-width: 30ch; }

@media (max-width: 640px) {
  :root { --gut: 16px; }
  #voice { top: 18px; font-size: 10px; letter-spacing: .16em; }
  #mark { bottom: 20px; }
  #mark svg { width: 104px; }
  #mark p { font-size: 12px; margin-top: 9px; max-width: 22ch; }
  #sound { bottom: 14px; }
  #specimens a { font-size: 14px; }
}

  banks: [2050, 2450, 2850, 3250],
  build0: 2300, build1: 5300,

renderer.toneMapping = THREE.ACESFilmicToneMapping;

/* ------------------------------------------------------------------ */

const SKY = new THREE.Color(0x94E6FF);

/* ------------------------------------------------------------------ */
/* Procedural stone textures, baked once (grain, inset groove, AO)     */
/* ------------------------------------------------------------------ */
function valueNoise(seed) {
  const N = 256, r = rng(seed), p = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) p[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = p[((yi & 255) * N) + (xi & 255)], b = p[((yi & 255) * N) + ((xi + 1) & 255)];
    const c = p[(((yi + 1) & 255) * N) + (xi & 255)], d = p[(((yi + 1) & 255) * N) + ((xi + 1) & 255)];

    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;

function bakeStone(size, seed, { groove = true, ao = 1, roughBase = .6, roughVar = .25, calm = false } = {}) {
  const n1 = valueNoise(seed), n2 = valueNoise(seed + 7), rr = rng(seed + 3);
  const cm = document.createElement('canvas'); cm.width = cm.height = size;
  const cr = document.createElement('canvas'); cr.width = cr.height = size;
  const xm = cm.getContext('2d'), xr = cr.getContext('2d');
  const im = xm.createImageData(size, size), ir = xr.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

    const speck = rr() < .012 ? .18 : 0;

    const rough = clamp(roughBase + (f - .5) * roughVar * 2 - vein * .6 + (1 - smooth(0, .03, e)) * .25, .05, 1);

  }
  xm.putImageData(im, 0, 0); xr.putImageData(ir, 0, 0);
  const map = new THREE.CanvasTexture(cm); map.colorSpace = THREE.SRGBColorSpace;
  const rough = new THREE.CanvasTexture(cr);
  for (const t of [map, rough]) { t.anisotropy = 4; t.wrapS = t.wrapT = THREE.RepeatWrapping; }

{

/* ------------------------------------------------------------------ */
const ROOM = { x0: -10, x1: 10, y1: 13, z0: -14, z1: 16 };
const ROWS = [0, 1.5, 3.0, 4.0, 5.6, 7.2, 8.8, 10.4, 11.7, 13];

const STONE_MATS = [wallMat, floorMat];

const panels = [];
const panelGroups = new Map();   /* key: size + material, value: list of panels */
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function addPanel(face, cu, cv, w, h, basis, mat, tags = {}) {
  /* face: point on the wall surface at the panel centre; basis: u, v, n (n into the room) */
  const [u, v, n] = basis;
  const p = { face, u, v, n, w: w - GAP, h: h - GAP, mat, cu, cv,

  { at: I.crystal, fn: () => { Sound.hiss(0, 1.3, 0, .03); } }

  const it = introT();

    const k = (it - I.banks[i]) / 1;

    if (k >= 0) { const u = k / 260; lv = u < .18 ? .55 : u < .32 ? .12 : u < .45 ? .8 : u < .58 ? .4 : Math.min(1, .7 + (u - .58) * .7); }

    b.level = lv; L += lv / banks.length;
  });
  const dim = trackValue(tracks.dim);
  const roomK = 1 - dim * .42;
  banks.forEach((b, i) => {
    const lv = b.level * (i === 3 ? 1 : roomK);
    for (const m of b.mats) m.color.copy(SKY).multiplyScalar(m.userData.k * lv);
    for (const [l, k] of b.lights) l.intensity = k * lv;
  });
  const city = clamp((it - I.banks[3]) / 1600);
  for (const m of cityMats) { m.uniforms.uLevel.value = REDUCED ? 1 : easeOut(city); m.uniforms.uTime.value = T; }
  if (rain) { rain.material.uniforms.uLevel.value = REDUCED ? 1 : city; rain.material.uniforms.uTime.value = T; }
  slotGlass.uniforms.uLevel.value = REDUCED ? 1 : city; slotGlass.uniforms.uTime.value = T;
  const back = clamp((it - I.banks[0]) / 1200);
  const closed = .3 + .7 * smooth(I.build1 - 700, I.build1 + 500, it);
  backMat.color.copy(COBALT).multiplyScalar(.24 * easeOut(back) * closed);
  floorBack.material.color.copy(COBALT).multiplyScalar(.1 * easeOut(back));
  ceilBack.material.color.copy(COBALT).multiplyScalar(.07 * easeOut(back));
  curtainMat.uniforms.uLevel.value = L * roomK;
  for (const m of STONE_MATS) m.envMapIntensity = (m === floorMat ? .8 : m === stoneMat ? .9 : .55) * L;

  /* the crystal ignites last */
  const ig = REDUCED ? 1 : easeExp((it - I.crystal) / I.crystalDur);
  const hoverC = hover && hover.kind === 'crystal' ? 1 : 0;
  crystalHover += (hoverC - crystalHover) * (1 - Math.exp(-dt / 220));
  const pulse = Math.exp(-Math.max(0, T - crystalPulse) / 700) * (T >= crystalPulse ? 1 : 0);
  const glow = ig * (1 + .16 * crystalHover + .5 * pulse + .25 * dim) + (REDUCED ? 0 : .03 * Math.sin(T * .0011) * ig);
  gemMat.uniforms.uGlow.value = .92 * glow;
  gemMat.uniforms.uTime.value = REDUCED ? 8 : T * .001;
  crystalLight.intensity = (PHONE ? 30 : 24) * glow;
  haloMat.color.copy(SKY).multiplyScalar(.12 * glow);
  seamGlowMat.color.copy(SKY).multiplyScalar(2.2 * glow);
  if (dust) { dust.material.uniforms.uTime.value = T; dust.material.uniforms.uLevel.value = ig; }
  if (Sound.hum) Sound.humTo(Sound.humBase * ig + .045 * crystalHover + .02 * dim);

  /* the test */
  const rise = 1.3 * trackValue(tracks.rise);
  column.scale.y = (1.5 + rise) / 1.5; column.position.y = .28 + (1.5 + rise) / 2;
  capBlock.position.y = 1.85 + rise; tile.position.y = TILE_BASE + 50 * S + rise;
  specimens.forEach((s, i) => {
    const pe = trackValue(tracks.peds[i]);
    s.g.position.y = -2.6 + 2.6 * pe;
    s.g.visible = pe > .001;
    s.shade.material.opacity = .6 * pe;
    const lit = trackValue(tracks.lit[i], easeOut);
    s.hover += ((hover && hover.kind === 'specimen' && hover.i === i ? 1 : 0) - s.hover) * (1 - Math.exp(-dt / 160));
    s.ringMat.color.copy(SKY).multiplyScalar((.4 + 2.8 * lit) * pe * (1 + s.hover * .6));
    s.iconMat.emissiveIntensity = (.12 + .5 * lit) * (1 + s.hover * .35);
    s.tubeM.uniforms.uLit.value = lit * (1 + s.hover * .8);
    s.icon.rotation.y = REDUCED ? 0 : Math.sin(T * .0005 + i * 2.1) * .32 * (1 - s.hover * .8);
    s.icon.position.y = PED_H + .04 + TUBE_H * .5 + (REDUCED ? 0 : Math.sin(T * .0009 + i) * .025);
    const br = trackValue(tracks.bridges[i], easeOut);
    bridges[i].m.visible = br > .001;
    bridges[i].mat.uniforms.uLevel.value = br; bridges[i].mat.uniforms.uTime.value = T;
    /* labels */
    const a = s.link; const op = lit;
    if (op > .01) {
      proj.set(s.cx, s.g.position.y - .02, s.cz + .62).project(camera);
      const x = (proj.x * .5 + .5) * W, y = (-proj.y * .5 + .5) * H;
      a.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, 0)`;
    }
    a.style.opacity = op.toFixed(3);
    a.classList.toggle('live', op > .5);
    a.classList.toggle('hot', s.hover > .5);
  });
  const bt = trackValue(tracks.btn);
  const press = Math.exp(-Math.max(0, T - button.userData.press) / 180) * (T >= button.userData.press ? 1 : 0);
  button.position.y = -1.6 + 1.6 * bt;
  button.visible = bt > .001;
  button.userData.cap.position.y = 1.18 - press * .05;
  const bHover = hover && hover.kind === 'button' ? 1 : 0;
  button.userData.capm.color.copy(SKY).multiplyScalar((1.2 + bHover * 1.4 + (REDUCED ? 0 : .3 * Math.sin(T * .004))) * bt);
  const bo = trackValue(tracks.booth);
  booth.userData.back.material.color.setRGB(.42, .62, 1).multiplyScalar((.26 + .3 * bo) * L);
  if (!REDUCED) { const f = booth.userData.fig; f.rotation.y = Math.sin(T * .00021) * .12 - .25 * bo; f.position.x = (OBS.x0 + OBS.x1) / 2 - .5 + Math.sin(T * .00009) * .35 - .4 * bo; }

  /* ambient life */
  if (!REDUCED && introDone && mode === 'rest' && T > AMB.next && !AMB.p) {
    const r = Math.random; const cands = panels.filter((p) => (p.kind === 'left' || p.kind === 'right' || p.kind === 'far') && p.row >= 1 && p.row <= 6 && !p.test);
    const p = cands[Math.floor(r() * cands.length)];
    p.amb = { t: T, dur: AMB.dur, out: 1 }; AMB.p = p;
    const pan = clamp(p.face.x / 10, -1, 1);
    Sound.servo(0, .9, 120, 210, pan, .03); Sound.servo(AMB.dur * .7 / 1000, .9, 210, 120, pan, .028);
  }
  if (AMB.p && T > AMB.p.amb.t + AMB.dur) { AMB.p.amb = null; AMB.p.dirty = true; AMB.p = null; AMB.next = T + 8000 + Math.random() * 6000; }

  /* hover */
  if (pointerMoved && introDone && !REDUCED) {
    pointerMoved = false;
    const h = pick();
    const prev = hover; hover = h;
    if (prev && prev.kind === 'panel' && (!h || h.p !== prev.p)) prev.p.liftTo = 0;
    if (h && h.kind === 'panel' && (!prev || prev.p !== h.p) && !down) { h.p.liftTo = .07; if (Math.random() < .5) Sound.tick(clamp(h.p.face.x / 10, -1, 1)); }
    const k = h ? h.kind : null;
    document.body.classList.toggle('hot', k === 'crystal' || k === 'specimen' || k === 'button');
    lastHoverKind = k;
  }
  for (const p of panels) {
    if (p.liftT && T - p.liftT > 700) { p.liftTo = 0; p.liftT = 0; }
    if (p.lift !== p.liftTo) { p.lift += (p.liftTo - p.lift) * (1 - Math.exp(-dt / 90)); if (Math.abs(p.lift - p.liftTo) < 1e-4) p.lift = p.liftTo; }
  }
  for (const p of panels) updatePanel(p);

  /* camera: eases between rest and test, looks where you look */
  const cf = trackValue(tracks.cam);
  const push = REDUCED ? 0 : (1 - easeInOut(clamp(it / I.end))) * 1.6;
  camPos.lerpVectors(camRest, camTest, cf); camPos.z += push;
  camLook.lerpVectors(lookRest, lookTest, cf);
  if (!REDUCED) {
    const k = 1 - Math.exp(-dt / 420);
    look.x += (look.tx * .5 + look.dx - look.x) * k; look.y += (look.ty * .3 + look.dy - look.y) * k;
    const yaw = -look.x * .55, pitch = -look.y * .45;
    const dir = camLook.clone().sub(camPos); const dist = dir.length(); dir.normalize();
    const e = new THREE.Euler(pitch, yaw, 0, 'YXZ');

    camPos.x += Math.sin(T * .00017) * .05; camPos.y += Math.sin(T * .00023) * .03;
  }
  camera.position.copy(camPos); camera.lookAt(camLook);

  /* the signature arrives last */
  const mk = REDUCED || !INTRO ? 1 : easeOut((it - I.mark) / I.markDur);
  markEl.style.opacity = mk.toFixed(3);
  markEl.style.transform = `translateY(${((1 - mk) * 6).toFixed(2)}px)`;
  soundBtn.style.opacity = mk.toFixed(3);

  /* rare lines */
  if (introDone && mode === 'rest' && !saidHint && T - Math.max(lastInput, introStart + I.end) > 6500 && FREEZE === null) {
    saidHint = true; say([{ t: 'Touch the crystal when you are ready.' }], T, { hold: 3800 });
  }
  if (introDone && mode === 'rest' && saidHint && !saidIdle && T - lastInput > 40000 && FREEZE === null) {
    saidIdle = true; say([{ t: 'Observation continues. Do carry on.' }], T, { hold: 3600 });
  }
  voiceFrame();

  grain.uniforms.uTime.value = T;
  grain.uniforms.uFade.value = 1;
  composer.render();
}
let crystalHover = 0;

/* ------------------------------------------------------------------ */
/* Loop: adaptive quality, 30fps on phones, pause when hidden           */
/* ------------------------------------------------------------------ */
let raf = 0, lastNow = performance.now(), acc = 0, slow = 0, frames = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(100, now - lastNow);
  if (PHONE && dt < 31) return;
  lastNow = now;
  if (!started) { started = true; t0 = now; }
  T = now - t0;
  if (REDUCED && T > dirtyUntil && mode !== 'test' && !pointerMoved) { voiceFrame(); return; }
  frame(dt);
  frames++;
  if (frames > 30 && !REDUCED) {
    if (dt > (PHONE ? 40 : 24)) slow++; else slow = Math.max(0, slow - .5);
    if (slow > 40 && quality > .5) { quality *= .85; slow = 0; resize(); }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; if (Sound.ctx) Sound.ctx.suspend(); }
  else if (!raf && FREEZE === null) { lastNow = performance.now(); raf = requestAnimationFrame(loop); if (Sound.on) Sound.ctx.resume(); }
});

resize();
if (Q.has('test')) { modeT = 0; mode = 'test'; for (const s of specimens) s.link.tabIndex = 0; say([{ t: 'Three specimens, all made here.' }], 3100, { hold: 2600 }); }
if (Q.has('hover')) { hover = { kind: Q.get('hover') === 'crystal' ? 'crystal' : 'specimen', i: +(Q.get('i') || 0) }; crystalHover = 1; }
if (FREEZE !== null) {
  /* a still for screenshots: ?t=<ms> renders that moment */
  window.__setT = (ms) => { T = ms; if (Q.has('hover')) { crystalHover = 1; for (const s of specimens) s.hover = s === specimens[hover.i] && hover.kind === 'specimen' ? 1 : 0; } for (const p of panels) p.dirty = true; firedUpTo = Infinity; frame(16); return true; };
  window.__scene = scene; window.__camera = camera; window.__THREE = THREE; window.__bloom = bloom; window.__grain = grain; window.__renderer = renderer; window.__composer = composer;
  window.__setT(FREEZE);
  requestAnimationFrame(() => { window.__setT(FREEZE); window.__ready = true; });
} else {
  try { renderer.compile(scene, camera); } catch (e) {}
  raf = requestAnimationFrame(loop);
  window.__ready = true;
}
