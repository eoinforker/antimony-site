.wm { display: block; height: 26px; width: auto; color: var(--paper); --lit: var(--sky); }

.box:focus-visible { outline: 1px solid var(--sky); outline-offset: 3px; }

  var end = "translate3d(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px,0) rotateZ(" + rz.toFixed(1) + "deg) rotateY(180deg) scale(" + sc.toFixed(3) + ")";
  nm.style.left = (bw / 2 + dx) + "px"; nm.style.top = (bh / 2 + dy + Math.max(bw, bh) * sc / 2 + 12) + "px";
  var Dm = reduced ? 1 : 1400;
  var an = spin.animate([
    { transform: "translate3d(0,0,0) rotateZ(0deg) rotateY(0deg) scale(1)" },
    { transform: "translate3d(" + (dx * .08).toFixed(1) + "px," + (dy * .08 - 4).toFixed(1) + "px,0) rotateZ(" + (rz * .2).toFixed(1) + "deg) rotateY(16deg) scale(" + (1 + (sc - 1) * .12).toFixed(3) + ")", offset: .12 },

    b.style.cssText = "left:" + (sp[0] - sz / 2) + "px;top:" + (sp[1] - sz / 2) + "px;width:" + sz + "px;height:" + sz + "px";

function heal() {

var KEYPTS = null;

document.addEventListener("click", function (e) { if (performance.now() - chipT < 700 && e.target.closest && e.target.closest(".shard")) { e.preventDefault(); e.stopPropagation(); } }, true);
