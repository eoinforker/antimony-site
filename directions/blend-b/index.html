<title>Antimony, Blend B</title>

<link rel="preload" href="assets/fonts/CommitMono-Latin-VF.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Decide before first paint: a first visit opens on black; a second visit, or reduced motion, opens at rest. */
(function () {
  var h = document.documentElement, q = location.search, seen = false;
  try { seen = sessionStorage.getItem("antimony.blendb") === "1"; } catch (e) {}
  if (/[?&](t=\d|again)/.test(q)) seen = false;
  if (/[?&]rest/.test(q)) seen = true;
  var wm = /[?&]wm=(serif|track)/.exec(q); h.setAttribute("data-wm", wm ? wm[1] : "track");

})();
</script>
<style>
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
:root {
  --night: #060A16; --paper: #EEEAE0; --ink: #0B0C0C; --sky: #94E6FF; --prussian: #1F3F7A;
  --dim: rgba(11, 12, 12, .5);
  --S: 200px; --mx: 0px; --my: 0px; --wy: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); color-scheme: light; overflow-x: clip; }
body { min-height: 100vh; min-height: 100svh; background: var(--paper); color: var(--ink); font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
html.opening, html.opening body { background: #000; }
::selection { background: var(--sky); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* a fine stippled grain, baked once: one for the night, one for the paper */
.grain { position: fixed; inset: 0; z-index: 5; pointer-events: none; background-size: 160px 160px; }
.grain.night { opacity: 0; }
.grain.paper { opacity: .9; }
html.opening .grain.night { opacity: .5; }
html.opening .grain.paper { opacity: 0; }

/* the typed line */
.typed { position: fixed; top: 30px; left: 16px; right: 16px; z-index: 6; text-align: center; white-space: pre; font: 400 11px/1.6 "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: .24em; text-indent: .24em; color: var(--paper); pointer-events: none; }
.typed .lab { color: var(--sky); }
.typed span { visibility: hidden; }
.typed span.on { visibility: visible; }
html:not(.opening) .typed { display: none; }

/* the paper, spreading out of the crystal at the end of the opening */
.dawn { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; }
html.opening .dawn { display: block; }

/* the drawing: construction hairlines and the line Break, in page pixels */
#geo { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 1; overflow: visible; pointer-events: none; }
#geo .h { stroke: var(--ink); stroke-width: 1; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
#geo .b { stroke: var(--paper); stroke-width: 1.15; fill: none; stroke-linecap: butt; stroke-linejoin: round; }

/* the mark */
.mark { position: absolute; left: var(--mx); top: var(--my); width: var(--S); height: var(--S); z-index: 2; }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
html.gl .mark .still { visibility: hidden; }
#gl { position: absolute; display: block; pointer-events: none; }

/* the wordmark: tracked lowercase serif in the manner of a title card, or the drawn wordmark */
.wm { position: absolute; left: 0; right: 0; top: var(--wy); z-index: 2; display: flex; justify-content: center; }
.wm .track { font-weight: 330; font-size: calc(var(--S) * .17); line-height: 1; letter-spacing: .74em; margin-right: -.74em; color: var(--ink); white-space: nowrap; font-feature-settings: "kern" 1; }
.wm .track .i { position: relative; display: inline-block; letter-spacing: 0; margin-right: .74em; }
.wm .track .i svg { position: absolute; left: 50%; width: .13em; height: .203em; top: -.05em; transform: translateX(-50%); overflow: visible; }
.wm .serif { display: none; width: calc(var(--S) * 1.18); height: auto; color: var(--ink); overflow: visible; }
.wm .lit, .wm .serif .tittle { fill: var(--prussian); }
html[data-wm="serif"] .wm .track { display: none; }
html[data-wm="serif"] .wm .serif { display: block; }

.foot { position: fixed; left: 16px; right: 16px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 2; text-align: center; font-size: 12px; line-height: 1.5; letter-spacing: .2em; text-indent: .2em; color: var(--dim); }

html.opening .wm, html.opening .foot { opacity: 0; }

@media (max-width: 600px) {
  .wm .track { letter-spacing: .62em; margin-right: -.62em; font-size: calc(var(--S) * .17); }
  .wm .track .i { margin-right: .62em; }
  .foot { font-size: 11px; letter-spacing: .14em; text-indent: .14em; }
  .typed { font-size: 10.5px; letter-spacing: .2em; text-indent: .2em; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
(function () {
"use strict";
var html = document.documentElement;
var $ = function (id) { return document.getElementById(id); };

var NS = "http://www.w3.org/2000/svg";
var NIGHT = [6, 10, 22], PAPER = [238, 234, 224], INK = [11, 12, 12];

/* ---------- grain, baked once ---------- */
(function () {
  function bake(paper) {
    var n = 160, c = document.createElement("canvas"); c.width = c.height = n;
    var x = c.getContext("2d"), d = x.createImageData(n, n), p = d.data;
    for (var i = 0; i < p.length; i += 4) {
      var r = Math.random();

    }
    x.putImageData(d, 0, 0); return "url(" + c.toDataURL() + ")";
  }
  document.querySelector(".grain.night").style.backgroundImage = bake(false);
  document.querySelector(".grain.paper").style.backgroundImage = bake(true);
})();
var grN = document.querySelector(".grain.night"), grP = document.querySelector(".grain.paper");

/* ---------- the typed line: every character laid out from the start, so nothing shifts as it types ---------- */
var LINE = [["ANTIMONY //:", "lab"], [" LONDON", ""]], chars = [];
LINE.forEach(function (part) {
  var wrap = document.createElement("span"); wrap.className = part[1] + " on";
  for (var i = 0; i < part[0].length; i++) { var s = document.createElement("span"); s.textContent = part[0][i]; wrap.appendChild(s); chars.push(s); }
  typed.appendChild(wrap);
});

/* ---------- the Break, in mark units ---------- */
var GEM = [[58.6,21.5],[70.58,46.7],[67.82,56.3],[41.4,81.5],[29.42,56.3],[32.18,46.7]];
var CAV = [[60.75,14.02],[78.19,42.8],[73.21,60.2],[39.25,88.97],[21.81,60.2],[26.79,42.8]];
var SEAMP = [[67.46,-12],[68.96,-12],[62.35,21.5],[45.15,81.5],[33.4,112],[31.9,112],[37.65,81.5],[54.85,21.5]];
var SEAM = [[[67.46,-12],[68.96,-12],[62.35,21.5],[54.85,21.5]], [[54.85,21.5],[62.35,21.5],[45.15,81.5],[37.65,81.5]], [[37.65,81.5],[45.15,81.5],[33.4,112],[31.9,112]]];

  var cx = 0, cy = 0; poly.forEach(function (p) { cx += p[0] / poly.length; cy += p[1] / poly.length; });
  for (var j = 0; j < poly.length; j++) {
    var a = poly[j], b = poly[(j + 1) % poly.length], ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey), nx = ey / l, ny = -ex / l;

/* ---------- timeline, in seconds: one thing at a time ---------- */
var T = {
  ty0: .7, tyc: .105,            /* the typed line, a character every 105ms */
  tyH: 3.1, tyF: 3.7,            /* hold, then fade */
  g0: 3.9, g1: 4.5,              /* black deepens into night */
  h0: 4.5, h1: 5.2,              /* the horizon */
  v0: 5.2, v1: 5.9,              /* the vertical */
  a0: 5.9, a1: 6.55,             /* the arc */
  s0: 6.55, s1: 7.25,            /* the spark comes down to the crossing */
  d0: 7.25, d1: 8.65,            /* the Break, drawn by the pen */
  p0: 8.65, p1: 9.3,             /* the halves part */
  f0: 9.3, f1: 9.95,             /* and fill */
  j0: 9.95, j1: 11.05,           /* and join, slowly */
  c0: 11.35, c1: 13.05,          /* paper opens from the crystal, and the construction goes with it */
  w0: 13.05, w1: 13.8            /* the wordmark sets */

/* ---------- layout ---------- */

function layout() {
  W = innerWidth; H = innerHeight;
  var phone = W < 600;
  S = Math.round(Math.max(132, Math.min(236, H * .235, W * .4)));

  buildGeo(phone);

/* ---------- the drawing, in page pixels ---------- */
function P(x, y) { return (MX + x * K).toFixed(2) + " " + (MY + y * K).toFixed(2); }
function poly(pts, close) { return "M" + pts.map(function (p) { return P(p[0], p[1]); }).join("L") + (close ? "Z" : ""); }
function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  while (geo.firstChild) geo.removeChild(geo.firstChild);

  var gap = S * .66, R = Math.min(S * 1.1, W / 2 - 30);
  var Lh = phone ? W / 2 - 16 : Math.min(W / 2 - 40, S * 3.4);
  var Lt = CY - (phone ? 70 : 64), Lb = H - CY - (phone ? 84 : 72);

  var hm = el("mask", { id: "hole", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H }, defs);
  el("rect", { width: W, height: H, fill: "#fff" }, hm);
  el("circle", { cx: CX, cy: CY, r: gap, fill: "#000" }, hm);
  var con = el("g", { mask: "url(#hole)" }, geo);
  var d = function (p, extra) { var a = { d: p, "class": "h", pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }; for (var k in extra) a[k] = extra[k]; return el("path", a, con); };

  G.hr = d("M" + (CX + gap) + " " + CY + "H" + (CX + Lh));
  G.v = d("M" + CX + " " + (CY - Lt) + "V" + (CY + Lb));
  G.rl = el("path", { d: "M" + (CX - gap) + " " + CY + "H" + (CX - Lh), "class": "h", opacity: 0 }, con);
  G.rr = el("path", { d: "M" + (CX + gap) + " " + CY + "H" + (CX + Lh), "class": "h", opacity: 0 }, con);
  G.arc = d("M" + (CX - R) + " " + CY + "A" + R + " " + R + " 0 1 1 " + CX + " " + (CY + R));
  G.vTop = CY - Lt;
  /* the spark: four points, long on the vertical, as on the cover */
  var sp = el("g", { opacity: 0 }, geo); G.spark = sp;

  G.strokes.forEach(function (s) { dash(s.e, io3(cl((dp - s.w[0]) / (s.w[1] - s.w[0])))); });
  /* parting, filling, joining */
  var split = o3(seg(t, T.p0, T.p1)) * (1 - io4(seg(t, T.j0, T.j1)));
  setHalves(split);
  var fill = io3(seg(t, T.f0, T.f1));
  G.lb.style.opacity = (1 - fill * .9 - .1 * seg(t, T.j1, T.c0)).toFixed(3);
  /* the flare as they lock: quick to rise, slow to go */
  var lt = t - T.j1, flare = lt < 0 ? 0 : (lt < .09 ? lt / .09 : Math.exp(-(lt - .09) / .28));
  /* the water rocks once as the halves lock */
  var tau = Math.max(0, lt), env = lt < 0 ? 0 : Math.exp(-ZE * OM * tau);
  Wt.th = -.14 * env * Math.sin(OM * tau); Wt.tv = -.14 * env * OM * (Math.cos(OM * tau) - ZE * Math.sin(OM * tau));
  Wt.gx = -Wt.th * 22; Wt.z = 0; Wt.rip = .35 * env;

  /* the wordmark and the line at the foot, in one quiet move */
  var w = o3(seg(t, T.w0, T.w1));
  wm.style.opacity = w.toFixed(3);
  wm.style.transform = "translateY(" + ((1 - w) * 6).toFixed(2) + "px)";
  foot.style.opacity = o3(seg(t, T.w0 + .25, T.w1 + .1)).toFixed(3);
}

/* ---------- rest ---------- */
function restGeo() {
  [G.hl, G.hr, G.v, G.arc].forEach(function (e) { dash(e, 1); });
  G.hl.style.opacity = G.hr.style.opacity = G.v.style.opacity = G.arc.style.opacity = 0;
  G.rl.style.opacity = G.rr.style.opacity = REST_H;
  G.spark.setAttribute("opacity", 0);
  G.lb.style.opacity = 0;
  [G.hl, G.hr, G.v, G.arc].forEach(function (e) { e.style.stroke = ""; });
  grN.style.opacity = grP.style.opacity = "";
}
var t0 = performance.now(), live = false, visible = true, last = 0, clockOff = 0, idle = 0;
function restFrame(now) {

  var n = Math.max(1, Math.ceil(dt / .008)); for (var i = 0; i < n; i++) step(dt / n);

}
function wake() { if (ok && !live && visible && !reduced && FREEZE < 0 && atRest()) { live = true; last = 0; requestAnimationFrame(restFrame); } }
document.addEventListener("visibilitychange", function () { visible = !document.hidden; wake(); });
function startRest(clock) {

  wake();
}
addEventListener("resize", function () { layout(); if (atRest()) { restGeo(); if (!live) draw({ clock: 30, fill: 1, split: 0, flare: 0 }); } });

layout();
if (ok) html.classList.add("gl");
else { canvas.style.display = "none"; }

(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]) : Promise.resolve()).then(begin, begin);

function begin() {
  if (!opening || !ok) {
    html.classList.remove("opening");
    try { sessionStorage.setItem("antimony.blendb", "1"); } catch (e) {}
    startRest(30);
    if (!reduced && FREEZE < 0) [mark, wm, foot, geo].forEach(function (e) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: "cubic-bezier(.25,.6,.3,1)" }); });
    return;
  }
  var start = performance.now(), done = false;
  window.__seek = function (t) { at(t); };
  function tick(now) {
    if (done) return;
    var t = FREEZE >= 0 ? FREEZE : (now - start) / 1000;
    if (t >= T.end) { finish(t); return; }
    at(t);
    if (FREEZE < 0) requestAnimationFrame(tick);
  }
  function finish(t) {
    if (done) return; done = true;
    var skipped = t < T.end, was = getComputedStyle(document.body).backgroundColor;
    html.classList.remove("opening");

    wm.style.opacity = foot.style.opacity = wm.style.transform = "";
    try { sessionStorage.setItem("antimony.blendb", "1"); } catch (e) {}
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { removeEventListener(ev, skip, true); });
    Wt.th = Wt.tv = Wt.z = Wt.rip = Wt.gx = 0;
    startRest(Math.max(t, T.j1));
    if (skipped) [html, document.body].forEach(function (e) { e.animate([{ backgroundColor: was }, { backgroundColor: "#EEEAE0" }], { duration: 900, easing: "cubic-bezier(.25,.6,.3,1)" }); });
    if (skipped) [mark, wm, foot, geo].forEach(function (e) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: "cubic-bezier(.25,.6,.3,1)" }); });
  }
  function skip() { if (!done && FREEZE < 0) finish((performance.now() - start) / 1000); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, skip, { passive: true, capture: true }); });
  if (FREEZE >= T.end) { finish(FREEZE); return; }
  if (CAP) { at(0); return; }   /* review only: frames are set by __seek */
  requestAnimationFrame(function (now) { start = now; tick(now); });
}
})();
