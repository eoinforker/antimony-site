:root {
  --ink: #0B0C0C; --paper: #EEEAE0; --sky: #94E6FF; --prussian: #1F3F7A;
  --s: clamp(140px, 21vmin, 220px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); color-scheme: light; }
html.opening, html.opening body { background: #000; overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow-x: clip; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the wall of characters, for the opening only */
#wall { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; display: block; }
html:not(.opening) #wall { display: none; }

/* the typed first line: every character set in place before it shows, so nothing shifts */
.type { position: fixed; z-index: 4; top: 30px; left: 0; right: 0; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: #EEEAE0; }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }

/* the one view */
.stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 40px 16px 8vh; }
.lock { display: flex; flex-direction: column; align-items: center; }
.mark { position: relative; width: var(--s); height: var(--s); flex: none; }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
html.gl .mark .still { visibility: hidden; }
#gl { position: absolute; z-index: 0; display: block; pointer-events: none; }

.wm { position: relative; z-index: 1; display: none; color: var(--ink); line-height: 0; }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
html[data-wm="caps"] .wm-caps { display: block; width: calc(var(--s) * 1.4); margin-top: calc(var(--s) * .37); }
html[data-wm="serif"] .wm-serif { display: block; width: calc(var(--s) * .96); margin-top: calc(var(--s) * .3); }
.wm-serif .tittle { fill: var(--prussian); }
html.opening .wm { clip-path: inset(-20% var(--w, 101%) -20% -2%); }

/* the foot: the old sign for antimony, and one line */
.foot { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: 0; padding-bottom: max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 13px; pointer-events: none; }
.sym { width: 9px; height: 16px; display: block; overflow: visible; color: var(--ink); opacity: .62; }
.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; color: rgba(11, 12, 12, .55); white-space: nowrap; }
html.opening .foot, html.opening .grain { opacity: 0; }

/* paper grain, fine and even */
.grain { position: fixed; inset: 0; z-index: 5; pointer-events: none; background-size: 128px 128px; }

@media (min-width: 601px) and (max-width: 1100px) and (min-aspect-ratio: 1/2) and (max-aspect-ratio: 1/1) { :root { --s: clamp(150px, 25vw, 200px); } }
@media (max-width: 600px) {
  :root { --s: min(42vw, 164px); }
  .type { top: 22px; font-size: 11px; letter-spacing: 2.5px; }
  .stage { padding-bottom: 11vh; }
  html[data-wm="caps"] .wm-caps { width: calc(var(--s) * 1.5); }
  .foot p { font-size: 9px; letter-spacing: .24em; margin-right: -.24em; }
}
@media (max-width: 350px) { .foot p { letter-spacing: .14em; margin-right: -.14em; } }

}
var VAULT = bez(.64, 0, .28, 1);     /* heavy to start, a long firm deceleration, no overshoot */
var FLOOD = bez(.42, 0, .22, 1);
var WIPE = bez(.5, 0, .25, 1);

/* ---------- the wall: the mark's own source, set as a city of text ---------- */
var CORPUS = ("antimony. the stone, the seam at sixteen degrees, the cavity, the crystal, the light. " +
  "tile <rect width=\"100\" height=\"100\" rx=\"22\"/>; seam M67.46 -12L68.96 -12L62.35 21.5L45.15 81.5L33.4 112Z; " +
  "cav M60.75 14.02L78.19 42.8L73.21 60.2L39.25 88.97L21.81 60.2L26.79 42.8Z; " +
  "software for the people who make the work. gem fill=\"#94E6FF\" M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z; " +
  "facet opacity=\".28\"; ang=16; cy=51.5; stone #141311; paper #EEEAE0; sky #94E6FF; ink #0B0C0C; london. " +
  "points move by (cy - y) * tan(16) in x; never rotate, never stretch; the crystal holds light. ").split("");
var DENSE = /[A-Za-z0-9#%&@$=]/;
var wctx = wall.getContext("2d"), field = null, parts = [], wdpr = 1, atlas = null, AT = {}, MC = { x: 0, y: 0 };
function buildWall() {
  wdpr = Math.min(devicePixelRatio || 1, 2);
  var VW = innerWidth, VH = innerHeight;
  wall.width = Math.round(VW * wdpr); wall.height = Math.round(VH * wdpr);
  var fs = VW < 600 ? 10 : VW > 1700 ? 12 : 11;
  var ax0 = document.createElement("canvas").getContext("2d");
  ax0.font = "500 " + fs + "px 'Commit Mono', ui-monospace, monospace";
  var cw = ax0.measureText("M").width, chh = Math.round(fs * 1.55);
  /* the Break is set on a square grid a little tighter than the text */
  var N = Math.max(22, Math.min(40, Math.round(K * 100 / (fs * .72))));
  var cu = 100 / N;
  /* a glyph atlas, in paper */
  var chars = {}; CORPUS.forEach(function (c) { if (c !== " ") chars[c] = 1; });
  var list = Object.keys(chars), gw = Math.ceil(fs * wdpr * 1.1), gh = Math.ceil(fs * wdpr * 1.6);
  atlas = document.createElement("canvas"); atlas.width = gw * list.length; atlas.height = gh;
  var ax = atlas.getContext("2d"); ax.fillStyle = "#EEEAE0"; ax.textAlign = "center"; ax.textBaseline = "middle";
  ax.font = "500 " + (fs * wdpr) + "px 'Commit Mono', ui-monospace, monospace";
  list.forEach(function (c, i) { ax.fillText(c, (i + .5) * gw, Math.round(gh * .5)); AT[c] = i; });
  AT._w = gw; AT._h = gh;
  /* the field: rows of the source; brighter and denser towards the mark */
  MC = { x: M.x + 50 * K, y: M.y + 51.5 * K };
  var rad = Math.hypot(Math.max(MC.x, VW - MC.x), Math.max(MC.y, VH - MC.y));
  var cols = Math.ceil(VW / cw) + 1, rows = Math.ceil(VH / chh) + 1, cells = [];
  for (var j = 0; j < rows; j++) {
    var off = Math.floor(Math.random() * CORPUS.length), run = 0, ra = 0, gapRun = 0;
    for (var i = 0; i < cols; i++) {
      var x = (i + .5) * cw, y = (j + .5) * chh, r = Math.hypot(x - MC.x, y - MC.y) / rad;
      if (gapRun > 0) { gapRun--; continue; }
      if (run <= 0) { run = 10 + Math.random() * 40; ra = [.22, .3, .38, .5][Math.floor(Math.random() * 4)]; if (Math.random() < r * .55) { gapRun = 4 + Math.random() * 26 * r; continue; } }
      run--;
      var c = CORPUS[(off + i) % CORPUS.length];
      if (c === " ") continue;
      var f = Math.pow(1 - Math.min(1, r), 1.4);
      cells.push({ x: x, y: y, c: c, a: ra * (.16 + .84 * f) });
    }
  }
  /* the Break, in characters: both halves held apart; seam, cavity and crystal empty; lit at the edges */
  var targets = [];
  [1, -1].forEach(function (s) {
    for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) {
      var x = (i + .5) * cu, y = (j + .5) * cu;
      if (!isStone(x, y, s)) continue;
      var edge = !isStone(x + cu, y, s) || !isStone(x - cu, y, s) || !isStone(x, y + cu, s) || !isStone(x, y - cu, s);
      targets.push({ x: M.x + (x + s * OPEN[0]) * K, y: M.y + (y + s * OPEN[1]) * K, a: edge ? 1 : .34 });
    }
  });
  var used = {};
  parts = targets.map(function (tg) {
    var k, tries = 0; do { k = Math.floor(Math.random() * cells.length); tries++; } while ((used[k] || !DENSE.test(cells[k].c)) && tries < 60);
    used[k] = 1; var src = cells[k];
    return { x0: src.x, y0: src.y, x1: tg.x, y1: tg.y, c: src.c, a0: src.a, a1: tg.a, d: Math.random() * .3 };
  });
  /* the field, baked once, without the characters that will travel */
  field = document.createElement("canvas"); field.width = wall.width; field.height = wall.height;
  var fx = field.getContext("2d");
  cells.forEach(function (c, k) { if (used[k]) return; fx.globalAlpha = c.a; blit(fx, c.c, c.x, c.y); });
  fx.globalAlpha = 1;
}
function blit(x, c, px, py) {
  var i = AT[c]; if (i == null) return;
  x.drawImage(atlas, i * AT._w, 0, AT._w, AT._h, Math.round(px * wdpr - AT._w / 2), Math.round(py * wdpr - AT._h / 2), AT._w, AT._h);
}
var wallClear = true;
function drawWall(t) {
  if (t < T.wall0 || t > T.mosEnd + .05) { if (!wallClear) { wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, wall.width, wall.height); wallClear = true; } return; }
  wallClear = false;
  wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, wall.width, wall.height);
  var wa = o3(seg(t, T.wall0, T.wall1));
  /* the whole wall flows in towards the mark as it fades */
  var gp = seg(t, T.g0, T.g0 + 1.25), fa = wa * (1 - io3(gp));
  if (fa > .003) {
    var s = 1 - .7 * io3(gp), cx = MC.x * wdpr, cy = MC.y * wdpr;
    wctx.globalAlpha = fa; wctx.setTransform(s, 0, 0, s, cx * (1 - s), cy * (1 - s)); wctx.drawImage(field, 0, 0);
    wctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  for (var n = 0; n < parts.length; n++) {
    var p = parts[n], k = io3(seg(t, T.g0 + p.d, T.g0 + p.d + 1.15));
    wctx.globalAlpha = wa * (p.a0 + (p.a1 - p.a0) * k);
    blit(wctx, p.c, p.x0 + (p.x1 - p.x0) * k, p.y0 + (p.y1 - p.y0) * k);
  }
  wctx.globalAlpha = 1;
}

/* ---------- rest ---------- */
var t0 = performance.now(), live = false, visible = true, last = 0, clockOff = 0;
function restDraw(clock) { draw({ clock: clock, t: BIG, rest: true, off: SHUT, fl: NOFL, ds: ALLP }); }
function restFrame(now) {
  if (!live) return;
  var dt = Math.min(.1, (now - (last || now)) / 1000); last = now;
  var n = Math.max(1, Math.ceil(dt / .008)); for (var i = 0; i < n; i++) step(dt / n);
  restDraw((now - t0) / 1000 + clockOff);
  if (visible) requestAnimationFrame(restFrame); else live = false;
}
function wake() { if (!live && visible && !reduced && FREEZE < 0 && !html.classList.contains("opening")) { live = true; last = 0; requestAnimationFrame(restFrame); } }
document.addEventListener("visibilitychange", function () { visible = !document.hidden; wake(); });
function startRest(clock) {
  measure(); frameMark();
  clockOff = clock - (performance.now() - t0) / 1000;
  if (reduced || FREEZE >= 0) { restDraw(clock); return; }
  wake();
}
var lastW = innerWidth;
addEventListener("resize", function () {
  if (html.classList.contains("opening")) return;
  measure(); frameMark(); if (!live) restDraw(30);
});

var fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load("500 12px 'Commit Mono'").then(function () { return document.fonts.ready; }), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve();
fontsReady.then(begin, begin);

function fadeIn(els) { els.forEach(function (el) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: "cubic-bezier(.25,.6,.3,1)" }); }); }

function begin() {
  if (!opening) {
    remember();
    startRest(30);
    if (!reduced) fadeIn([mark, WMC, foot]);
    return;
  }
  measure(); frameFull(); buildWall();
  var start = performance.now(), done = false, shown = 0;

  function at(t) {
    /* the typed line */
    var n = t < T.type0 ? 0 : Math.min(ALL.length, Math.floor((t - T.type0) / STEP) + 1);
    if (n !== shown) { for (var i = 0; i < spans.length; i++) spans[i].className = (i < LABEL.length ? "k" : "") + (i < n ? " on" : ""); shown = n; }
    typeEl.style.opacity = (1 - seg(t, T.fade0, T.fade1)).toFixed(3);
    /* the wall, and the gathering */
    drawWall(t);
    /* the mark */
    if (t >= T.c12 - .02) {
      var j = VAULT(seg(t, T.j0, T.j1)), off = [OPEN[0] * (1 - j), OPEN[1] * (1 - j)];
      var fh = o3(seg(t, T.f0, T.f0 + .7)) * 1.1 - .05;
      var fa = o3(seg(t, T.f0, T.f0 + .1)) * (1 - io3(seg(t, T.f0 + .5, T.d0 + .25)));
      var tau = Math.max(0, t - T.j1), env = Math.exp(-ZE * OM * tau), amp = t > T.j1 ? .08 : 0;
      W.th = amp * env * Math.sin(OM * tau); W.tv = amp * env * OM * (Math.cos(OM * tau) - ZE * Math.sin(OM * tau));
      W.gx = -W.th * 22; W.z = 0; W.rip = amp * 3 * env;
      var band = Math.max(90, maxD * .16), dk = FLOOD(seg(t, T.d0, T.d1));
      var ds = t < T.d0 ? NODS : [-band + (maxD + band * 2) * dk, band, t >= T.d1 ? 1 : 0];
      draw({ clock: t, t: t, rest: false, off: off, fl: [fh, fa, .45], ds: ds });
    } else clearGL();
    /* the wordmark: one clean wipe, left to right */
    WMC.style.setProperty("--w", (101 - 103 * WIPE(seg(t, T.wm0, T.wm1))).toFixed(2) + "%");
    grainEl.style.opacity = FLOOD(seg(t, T.d0, T.d1)).toFixed(3);
    foot.style.opacity = o3(seg(t, T.ft0, T.ft1)).toFixed(3);
  }
  function tick(now) {
    if (done) return;
    var t = FREEZE >= 0 ? FREEZE : (now - start) / 1000;
    if (t >= T.end) { finish(t); return; }
    at(t);
    if (FREEZE < 0) requestAnimationFrame(tick);
  }
  function finish(t) {
    if (done) return; done = true;
    var skipped = t < T.end;
    html.classList.remove("opening");
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, wall.width, wall.height); field = null; parts = [];
    foot.style.opacity = grainEl.style.opacity = ""; WMC.style.removeProperty("--w");
    remember();
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { removeEventListener(ev, skip, true); });
    if (skipped) { W.th = W.tv = W.z = W.rip = 0; fadeIn([mark, WMC, foot]); }
    startRest(Math.max(t, T.e0));
  }
  function skip() { if (!done && FREEZE < 0) finish((performance.now() - start) / 1000); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, skip, { passive: true, capture: true }); });
  addEventListener("resize", function () { if (!done && innerWidth !== lastW) skip(); });
  /* review only: under a frozen ?t=, frames can be stepped by hand */
  if (FREEZE >= 0) window.__seek = function (s) { if (s >= T.end) finish(s); else at(s); };
  if (FREEZE >= T.end) { finish(FREEZE); return; }
  requestAnimationFrame(function (now) { start = now; tick(now); });
}
})();
</script>
