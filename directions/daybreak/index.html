<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antimony, Daybreak</title>
<meta name="description" content="Antimony builds software for the people who make the work. London.">
<meta name="theme-color" content="#EEEAE0">
<link rel="preload" href="assets/TimelessSerifVF.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Timeless"; src: url("assets/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
@font-face { font-family: "Timeless"; src: url("assets/TimelessSerifItalicVF.woff2") format("woff2"); font-weight: 200 700; font-style: italic; font-display: swap; }
@font-face { font-family: "Commit"; src: url("assets/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }

:root {
  --ink: #0B0C0C; --stone: #141311; --paper: #EEEAE0; --sky: #94E6FF; --prussian: #1F3F7A;
  --s: clamp(132px, 29vmin, 300px);           /* the monolith */
  --hy: max(calc(var(--s) + 24vh), 54vh);      /* the horizon, from the top */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; }
html.op { background: #000; }
body { font-family: "Timeless", "Iowan Old Style", Georgia, serif; background: var(--paper); min-height: 100vh; min-height: 100svh; overflow-x: hidden; position: relative; }
/* paper grain over everything, baked once by the browser */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: .42; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .31  0 0 0 0 .36  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
a { color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the opening: a typed line, a veil of black, a painted dawn */
#dawn, #pale { position: absolute; left: 0; top: 0; z-index: 1; display: none; pointer-events: none; }
#veil { position: fixed; left: 0; right: 0; top: 0; height: 300vh; z-index: 6; display: none; pointer-events: none;
  background: linear-gradient(#000 0, #000 33.4%, rgba(0,0,0,.86) 41%, rgba(0,0,0,.45) 52%, rgba(0,0,0,0) 66%); }
#line { position: fixed; z-index: 7; top: 34px; left: 0; right: 0; text-align: center; pointer-events: none; display: none;
  font: 400 11px/1 "Commit", ui-monospace, monospace; letter-spacing: .26em; padding-left: .26em; color: rgba(238,234,224,.88); white-space: nowrap; }
#line b { font-weight: 400; color: var(--sky); }
#line i { font-style: normal; visibility: hidden; }
#line i.on { visibility: visible; }

/* the stage: one horizon, the monolith standing on it */
.stage { position: relative; height: var(--hy); z-index: 2; }
.hz { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: rgba(31,63,122,.36); }
.mk { position: absolute; left: 50%; bottom: 0; width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2); }
.mk svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mk .lit { opacity: 0; }
/* a slow light passing through the crystal, then a long rest */
.mk .shim { animation: shim 11s cubic-bezier(.45,0,.25,1) 2s infinite; opacity: 0; }
@keyframes shim { 0% { transform: skewX(-16deg) translateX(0); opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34% { transform: skewX(-16deg) translateX(92px); opacity: 0; } 100% { transform: skewX(-16deg) translateX(92px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mk .shim { animation: none; } }

/* the page */
main { position: relative; z-index: 2; width: min(452px, 100% - 44px); margin: 0 auto; padding: clamp(40px, 7.5vh, 76px) 0 56px; }
.copy { font-size: 17px; line-height: 1.55; font-weight: 380; letter-spacing: .002em; }
.copy p + p { margin-top: .95em; }
.copy a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(31,63,122,.45); transition: color .2s, text-decoration-color .2s; }
.copy a:hover, .copy a:focus-visible { color: var(--prussian); text-decoration-color: var(--prussian); }
.mentions { margin-top: 30px; display: flex; align-items: center; gap: 0 22px; font-size: 14px; color: #4b4c4b; list-style: none; white-space: nowrap; }
.mentions a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: color .25s; }
.mentions img { width: 17px; height: 17px; border-radius: 4px; filter: grayscale(1) contrast(.9) brightness(1.04); opacity: .7; transition: filter .25s, opacity .25s; }
.mentions a:hover, .mentions a:focus-visible { color: var(--ink); }
.mentions a:hover img, .mentions a:focus-visible img { filter: none; opacity: 1; }
.mentions .place { margin-left: auto; color: #77786f; }

@media (max-width: 720px) {
  :root { --s: clamp(128px, 36vw, 160px); --hy: max(calc(var(--s) + 28svh), 48svh); }
  main { width: calc(100% - 44px); padding-top: 34px; padding-bottom: 40px; }
  .copy { font-size: 16.5px; line-height: 1.52; }
  .mentions { margin-top: 26px; gap: 0 16px; font-size: 13.5px; }
  #line { top: 28px; font-size: 10.5px; letter-spacing: .2em; padding-left: .2em; }
}
</style>
</head>
<body>
<canvas id="pale" aria-hidden="true"></canvas><canvas id="dawn" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div id="line" aria-hidden="true"></div>

<h1 class="sr">Antimony</h1>
<div class="stage" aria-hidden="true">
  <div class="mk" id="mk">
    <svg viewBox="0 0 100 100">
      <defs>
        <mask id="cut" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140">
          <rect x="-20" y="-20" width="140" height="140" fill="#fff"/>
          <path fill="#000" d="M67.46 -12L68.96 -12L62.35 21.5L45.15 81.5L33.4 112L31.9 112L37.65 81.5L54.85 21.5Z"/>
          <path fill="#000" d="M60.75 14.02L78.19 42.8L73.21 60.2L39.25 88.97L21.81 60.2L26.79 42.8Z"/>
        </mask>
        <clipPath id="tc"><rect width="100" height="100" rx="22"/></clipPath>
        <linearGradient id="rg" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EEEAE0" stop-opacity="0"/><stop offset=".26" stop-color="#EEEAE0" stop-opacity=".5"/><stop offset=".55" stop-color="#F4F2EC" stop-opacity=".95"/><stop offset=".8" stop-color="#EEEAE0" stop-opacity=".5"/><stop offset="1" stop-color="#EEEAE0" stop-opacity="0"/></linearGradient>
        <linearGradient id="rs" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4F2EC" stop-opacity=".9"/><stop offset=".22" stop-color="#EEEAE0" stop-opacity=".55"/><stop offset=".55" stop-color="#cfe6f2" stop-opacity=".18"/><stop offset=".9" stop-color="#cfe6f2" stop-opacity="0"/></linearGradient>
        <linearGradient id="gg" x1="58.6" y1="21.5" x2="41.4" y2="81.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D2F5FF"/><stop offset=".38" stop-color="#94E6FF"/><stop offset="1" stop-color="#7DD3F2"/></linearGradient>
        <radialGradient id="gd" cx="47" cy="60" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5BB8E0" stop-opacity=".34"/><stop offset="1" stop-color="#5BB8E0" stop-opacity="0"/></radialGradient>
        <linearGradient id="gs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="gc"><path d="M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z"/></clipPath>
      </defs>
      <rect class="stone" width="100" height="100" rx="22" fill="#141311" mask="url(#cut)"/>
      <g class="lit" fill="none" stroke-linejoin="round">
        <path d="M5.5 11A22 22 0 0 1 22 .35H78A22 22 0 0 1 94.5 11" stroke="url(#rg)" stroke-width="1" vector-effect="non-scaling-stroke" mask="url(#cut)"/>
        <g clip-path="url(#tc)" mask="url(#cut)">
          <path d="M67.46 -12L68.96 -12L62.35 21.5L45.15 81.5L33.4 112L31.9 112L37.65 81.5L54.85 21.5Z" stroke="url(#rs)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
        </g>
      </g>
      <path fill="url(#gg)" d="M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z"/>
      <path fill="url(#gd)" d="M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z"/>
      <path class="facet" fill="#fff" fill-opacity=".28" d="M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5Z"/>
      <g clip-path="url(#gc)"><rect class="shim" x="14" y="10" width="9" height="84" fill="url(#gs)" transform="skewX(-16)"/></g>
    </svg>
  </div>
  <div class="hz" id="hz"></div>
</div>

<main id="page">
  <div class="copy">
    <p><em>Antimony</em> builds software for the people who make the work. Our first product is <a href="https://eoinforker.github.io/orbe-site/">Orbe</a>, the creator’s side of every sponsorship deal.</p>
    <p>We sit on their side of the table, and we mean to stay there for a long time.</p>
  </div>
  <ul class="mentions">
    <li><a href="https://eoinforker.github.io/orbe-site/"><img src="assets/orbe.svg" alt="">Orbe</a></li>
    <li><a href="https://immiscible.ai"><img src="assets/immiscible.svg" alt="">immiscible</a></li>
    <li><a href="https://idyll.day"><img src="assets/idyll.svg" alt="">Idyll</a></li>
    <li class="place">London</li>
  </ul>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seen = false; try { seen = sessionStorage.getItem("antimony-daybreak") === "1"; sessionStorage.setItem("antimony-daybreak", "1"); } catch (e) {}
  const freeze = q.has("t") ? +q.get("t") : null;
  const mk = $("#mk"), fc = mk.querySelector(".facet");

  // the crystal's facet answers the pointer, as if the light moved with it
  addEventListener("pointermove", (e) => {
    const r = mk.getBoundingClientRect(), k = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (innerWidth * .5)));
    fc.style.fillOpacity = (.28 + k * .14).toFixed(3);
  }, { passive: true });

  if (q.has("still") || (freeze === null && (reduce || seen))) return;

  /* ---------- the timeline, in milliseconds ---------- */
  const TEXT = [["ANTIMONY //:", 1], [" FIRST LIGHT", 0]];
  const T = { type: 650, step: 72 };
  const N = TEXT.reduce((n, [s]) => n + s.length, 0);
  T.typed = T.type + N * T.step;             // the line is complete
  T.fade = T.typed + 1000;                   // held a full second, then fades
  T.dark = T.fade + 800;                     // a beat of pure black
  T.dawn = T.dark + 650;                     // dawn rises out of the dark
  T.lit = T.dawn + 1500;                     // the hairlines catch the light
  T.hold = T.dawn + 2400;                    // dawn, held
  T.drain = T.hold + 600;                   // the sky drains to paper
  T.page = T.drain + 1000;                   // the column arrives
  T.end = T.page + 800;

  const W = innerWidth, H = innerHeight;
  const de = document.documentElement, meta = $('meta[name="theme-color"]');
  de.classList.add("op"); meta.content = "#000000";

  /* ---------- the typed line: even steps, no cursor ---------- */
  const line = $("#line"), glyphs = [];
  for (const [s, lab] of TEXT) {
    const host = lab ? document.createElement("b") : line;
    for (const ch of s) { const i = document.createElement("i"); i.textContent = ch; host.appendChild(i); glyphs.push(i); }
    if (lab) line.appendChild(host);
  }
  line.style.display = "block";
  let shown = 0;
  const typeTo = (t) => {
    const n = Math.max(0, Math.min(N, Math.floor((t - T.type) / T.step) + 1));
    while (shown < n) glyphs[shown++].classList.add("on");
  };

  /* ---------- the sky, painted once ---------- */
  const mr = mk.getBoundingClientRect();
  const S = mr.width, hy = Math.round(mr.bottom + scrollY), mx = mr.left;
  const cv = $("#dawn"), pale = $("#pale");
  let seed = 9;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const ramp = (stops, t) => {
    let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const [a, ca] = stops[i], [b, cb] = stops[i + 1], k = Math.min(1, Math.max(0, (t - a) / (b - a))), s = k * k * (3 - 2 * k);
    const A = hex(ca), B = hex(cb); return A.map((v, j) => v + (B[j] - v) * s);
  };
  const SKY = [[0, "#05080f"], [.34, "#0a142a"], [.6, "#132649"], [.8, "#1f3b69"], [.92, "#36578a"], [.972, "#6f8bb0"], [.993, "#b9c3cc"], [1, "#dedbd2"]];
  const SEA = [[0, "#2a3e60"], [.015, "#16284a"], [.2, "#0f1d38"], [.6, "#08111f"], [1, "#03050b"]];
  const tile = new Path2D("M22 0H78A22 22 0 0 1 100 22V78A22 22 0 0 1 78 100H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z");
  const seamP = new Path2D("M67.46 -12L68.96 -12L62.35 21.5L45.15 81.5L33.4 112L31.9 112L37.65 81.5L54.85 21.5Z");
  const cavP = new Path2D("M60.75 14.02L78.19 42.8L73.21 60.2L39.25 88.97L21.81 60.2L26.79 42.8Z");
  const gemP = new Path2D("M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z");
  const facP = new Path2D("M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5Z");

  function paint() {
    // painted at up to two device pixels per CSS pixel, so the stipple stays crisp on a phone
    const k = Math.min(2, Math.max(1, devicePixelRatio || 1)), wc = W, hc = Math.max(H, hy + 2);
    const w = Math.round(wc * k), h = Math.round(hc * k), hp = Math.round(hy * k);
    for (const c of [cv, pale]) { c.width = w; c.height = h; c.style.width = wc + "px"; c.style.height = hc + "px"; }
    const x = cv.getContext("2d");
    // the ground: row by row, with a slow banding of our own
    const img = x.createImageData(w, h), d = img.data;
    const band = []; let b = 0; for (let y = 0; y < h; y++) { if (y % k === 0) { b += (rnd() - .5) * .9; b *= .985; } band.push(b); }
    for (let y = 0; y < h; y++) {
      const c = y < hp ? ramp(SKY, y / hp) : ramp(SEA, (y - hp) / (h - hp));
      const f = y < hp ? 1 + band[y] * .018 * (1 - y / hp) : 1;
      for (let i = 0, o = y * w * 4; i < w; i++, o += 4) { d[o] = c[0] * f; d[o + 1] = c[1] * f; d[o + 2] = c[2] * f; d[o + 3] = 255; }
    }
    x.putImageData(img, 0, 0);
    x.setTransform(k, 0, 0, k, 0, 0);
    // first light: a long low bloom on the horizon, wide and quiet
    x.save(); x.beginPath(); x.rect(0, 0, wc, hy); x.clip();
    x.translate(wc / 2, hy); x.scale(1, .28);
    let g = x.createRadialGradient(0, 0, 0, 0, 0, wc * .62);
    g.addColorStop(0, "rgba(232,234,230,.26)"); g.addColorStop(.35, "rgba(190,206,224,.09)"); g.addColorStop(1, "rgba(160,190,220,0)");
    x.fillStyle = g; x.fillRect(-wc, -hy * 4, wc * 2, hy * 4); x.restore();
    // two long strata of cloud, barely there, lit from beneath
    const strata = [[.26, .34, .5, .02, .05], [.74, .6, .44, .014, .045]];
    for (const [cx, cy, ww, hh, a] of strata) {
      for (let n = 0; n < 9; n++) {
        const px = (cx + (rnd() - .5) * ww * .8) * wc, py = cy * hy + (rnd() - .5) * hh * hy * 2, rx = ww * wc * (.18 + rnd() * .2), ry = hh * hy * (.6 + rnd() * .6);
        x.save(); x.translate(px, py); x.scale(1, ry / rx);
        const gg = x.createRadialGradient(0, 0, 0, 0, 0, rx);
        gg.addColorStop(0, `rgba(150,176,210,${a})`); gg.addColorStop(1, "rgba(150,176,210,0)");
        x.fillStyle = gg; x.beginPath(); x.arc(0, 0, rx, 0, 7); x.fill(); x.restore();
      }
    }
    // the water takes the light: a few thin glints, most of them near the line
    for (let n = 0; n < 46; n++) {
      const dpt = Math.pow(rnd(), 2.2), yy = Math.round(hy + 3 + dpt * (hc - hy) * .55), len = (1 - dpt) * wc * (.02 + rnd() * .09);
      const cx = wc / 2 + (rnd() - .5) * wc * (.18 + dpt * .5);
      x.fillStyle = `rgba(226,232,236,${(.05 + rnd() * .16) * (1 - dpt)})`;
      x.fillRect(Math.round(cx - len / 2), yy, Math.round(len), 1);
    }
    // the monolith, reflected in slices
    const off = document.createElement("canvas"), r = Math.ceil(S * k);
    off.width = r; off.height = r;
    const o = off.getContext("2d"); o.scale(r / 100, r / 100);
    o.fillStyle = "#03050b"; o.fill(tile);
    o.globalCompositeOperation = "destination-out"; o.fill(seamP); o.fill(cavP);
    o.globalCompositeOperation = "source-over";
    o.fillStyle = "rgba(122,196,228,.5)"; o.fill(gemP); o.fillStyle = "rgba(255,255,255,.14)"; o.fill(facP);
    const RH = S * .86;
    x.save(); if ("filter" in x) x.filter = "blur(" + (.8 * k) + "px)";
    for (let y = 0, n = 0; y < RH; n++) {
      const dd = y / RH, hh = Math.max(2, Math.round((3 + dd * 12) * (.5 + rnd()) * S / 260)), gap = dd < .4 ? (rnd() < .65 ? 0 : 1) : Math.max(1, Math.round((.5 + dd * 4) * (.3 + rnd()) * S / 260));
      const sh = (Math.sin(y * .23 / (S / 260) + 1.3) * (1.5 + dd * 11) + Math.sin(y * .057 / (S / 260)) * dd * 6 + (rnd() - .5) * (1 + dd * 5)) * S / 260;
      if (dd > .2 && rnd() < .12) { y += hh + gap; continue; }
      x.globalAlpha = .9 * Math.pow(1 - dd, 1.25);
      // mirrored: depth y below the line shows the row y above the base
      x.save(); x.translate(0, hy + 1 + y + hh); x.scale(1, -1);
      x.drawImage(off, 0, (1 - (y + hh) / S) * r, r, hh / S * r, mx + sh, 0, S, hh);
      x.restore();
      y += hh + gap;
    }
    x.restore();
    x.setTransform(1, 0, 0, 1, 0, 0);
    // grain, a little posterising, and a stipple of light that gathers towards the horizon, as if drawn in dots
    const im = x.getImageData(0, 0, w, h), e = im.data, qq = 5;
    for (let p = 0; p < e.length; p += 4) {
      const nz = (rnd() + rnd() - 1) * 13;
      for (let j = 0; j < 3; j++) { const v = e[p + j]; e[p + j] = v * .6 + Math.round(v / qq) * qq * .4 + nz; }
    }
    const dots = Math.round(w * hp * .006);
    for (let n = 0; n < dots; n++) {
      const yy = Math.floor(Math.pow(rnd(), .55) * hp), xx = Math.floor(rnd() * w), o = (yy * w + xx) * 4, t = yy / hp;
      const lift = (14 + rnd() * 34) * (.35 + t * .9);
      e[o] += lift * .86; e[o + 1] += lift * .93; e[o + 2] += lift;
    }
    x.putImageData(im, 0, 0);
    // the same scene, washed with full daylight: the drain passes through this, never through grey
    const pc = pale.getContext("2d"), pi = pc.createImageData(w, h), pd = pi.data;
    for (let y = 0; y < h; y++) {
      const tc = y < hp ? [204, 220, 238] : [190, 207, 228];
      for (let i = 0, o = y * w * 4; i < w; i++, o += 4) { for (let j = 0; j < 3; j++) pd[o + j] = e[o + j] * .22 + tc[j] * .78; pd[o + 3] = 255; }
    }
    pc.putImageData(pi, 0, 0);
    cv.style.display = pale.style.display = "block";
  }
  paint();

  /* ---------- the motion ---------- */
  const veil = $("#veil"), hz = $("#hz"), page = $("#page"), lit = mk.querySelector(".lit");
  veil.style.display = "block";
  const OUT = "cubic-bezier(.22,.61,.36,1)", SOFT = "cubic-bezier(.45,0,.25,1)";
  const anims = [];
  const A = (el, kf, at, dur, easing) => { const a = el.animate(kf, { delay: at, duration: dur, easing: easing || OUT, fill: "both" }); anims.push(a); return a; };
  A(line, [{ opacity: 1 }, { opacity: 0 }], T.fade, 800, "cubic-bezier(.4,0,.6,1)");
  // the veil lifts from the horizon upwards: light rises out of the dark
  A(veil, [{ transform: "translateY(0)", opacity: 1 }, { transform: `translateY(${-H * 1.55}px)`, opacity: .0 }], T.dawn, 2500, "cubic-bezier(.33,.1,.25,1)");
  // a silhouette against the dawn; it settles to its own stone as the sky drains
  A(mk.querySelector(".stone"), [{ fill: "#04060b" }, { fill: "#141311" }], T.drain, 1000, SOFT);
  A(lit, [{ opacity: 0 }, { opacity: 1 }], T.lit, 900, OUT);
  A(cv, [{ opacity: 1 }, { opacity: 0 }], T.drain, 750, SOFT);
  A(pale, [{ opacity: 1 }, { opacity: 0 }], T.drain + 450, 800, SOFT);
