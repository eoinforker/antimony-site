:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--night); color: var(--paper); }
html.opening, html.opening body { background: #000; overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow: hidden; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the city: one canvas, drawn small and scaled up */
#city { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; }
html.nogl #city { display: none; }
html.nogl body { background: radial-gradient(60% 50% at 50% 38%, #142038 0%, #070b16 60%, #05080F 100%); }

/* the typed line */
.type { position: fixed; z-index: 5; top: 30px; left: 16px; right: 16px; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: var(--paper); }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }

/* the name, set low over the water like a title in a film; the one line beneath it */
.title { position: fixed; z-index: 2; left: var(--gut); right: 16px; bottom: calc(max(clamp(26px, 5.4vh, 56px), env(safe-area-inset-bottom)) + 30px); display: flex; justify-content: flex-start; pointer-events: none; }
.wm { width: clamp(196px, 17vw, 260px); color: var(--paper); line-height: 0; }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.wm .cA { fill: var(--sky); stroke: var(--sky); }
.foot { position: fixed; z-index: 2; left: var(--gut); right: 16px; bottom: 0; padding-bottom: max(clamp(26px, 5.4vh, 56px), env(safe-area-inset-bottom)); display: flex; justify-content: flex-start; pointer-events: none; }
.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
html.opening .title, html.opening .foot { opacity: 0; }

/* the parts of the city you can touch: the mark on the tower, and the three signs it lights */
.hit { position: fixed; z-index: 3; left: 0; top: 0; display: block; background: none; border: 0; border-radius: 22%; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
html.opening .hit, html.nogl .hit { visibility: hidden; }
.hit:focus-visible { box-shadow: 0 0 0 1px rgba(238, 234, 224, .7); }
.sign { position: fixed; z-index: 3; left: 0; top: 0; display: block; color: var(--paper); text-decoration: none; outline: none; visibility: hidden; -webkit-tap-highlight-color: transparent; }
.sign.on { visibility: visible; }
.sign .nm { position: absolute; left: 50%; top: 100%; margin-top: 9px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; line-height: 14px; letter-spacing: .08em; color: var(--paper); opacity: 0; transition: opacity .7s cubic-bezier(.25,.6,.3,1); text-shadow: 0 0 12px rgba(5, 8, 15, .9); }
.sign.lit .nm { opacity: .86; }
.sign:hover .nm, .sign:focus-visible .nm { opacity: 1; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

@media (max-width: 600px) {
  .type { top: 22px; font-size: 11px; letter-spacing: 2.5px; }
  .wm { width: min(54vw, 210px); }
  .foot p { font-size: 9px; letter-spacing: .22em; }
}
@media (max-width: 350px) { .foot p { letter-spacing: .12em; } }
