#city { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; }

.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
html.opening .title, html.opening .foot { opacity: 0; }

/* the parts of the city you can touch: the mark on the tower, and the three signs it lights */
.hit { position: fixed; z-index: 3; left: 0; top: 0; display: block; background: none; border: 0; border-radius: 22%; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }

.hit:focus-visible { box-shadow: 0 0 0 1px rgba(238, 234, 224, .7); }

.sign.lit .nm { opacity: .86; }
.sign:hover .nm, .sign:focus-visible .nm { opacity: 1; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

vec3 spill(vec3 P,vec3 N,vec3 Vd,float kd,float ks){vec3 acc=vec3(0.);
 for(int i=0;i<12;i++){vec4 lp=uLp[i];vec3 L=lp.xyz-P;float d2=dot(L,L);if(d2*lp.w>300.)continue;vec3 l=L*inversesqrt(d2);

  c+=FLC*fl*(.06+.5*smoothstep(.2,.85,n)*fade+.12*(1.-smoothstep(0.,.25,h)));}

 if(uFl.z>0.&&h>.02){float Xc=v.x*zc/F+camX;float Zc=zc+camZ;float sd=uFl2.y;float bx=uFl.w;float zb=uFl2.x;
  float dx=Xc-bx;float env=1.-smoothstep(200.,900.,abs(dx));
  if(env>0.){float pw=zc*pxW*1.4;
   float zl=zb+(lnoise(Xc*.004,sd)-.5)*420.+(lnoise(Xc*.02,sd+2.)-.5)*90.+(lnoise(Xc*.09,sd+5.)-.5)*20.;float d1=abs(Zc-zl)/pw;

 vec2 wc=vec2(X/2.4,Y/3.5);vec2 wi=floor(wc);vec2 wf=fract(wc);
 float hl=h21(wi+sd*17.);float lit=step(.955-.12*smoothstep(.4,.8,vnoise(wi*.13+sd*5.)),hl);
 float sh=step(.2,wf.x)*step(wf.x,.8)*step(.25,wf.y)*step(wf.y,.75);
 float det=1.-smoothstep(.5,1.3,px);
 vec3 e=COOL*.16*lit*mix(.36,sh,det)*(.6+.4*h21(wi+1.));if(hl>.992)e=COB*.3*mix(.36,sh,det);
 if(mn){float rs=h21(vec2(id,sd+9.));
  if(rs>1.-strip){float sx=rs>1.-strip*.45?.5:(rs>1.-strip*.75?.1:.92);float dx=abs(fx-sx)*bw;float cov=(1.-smoothstep(.12,.12+px*1.3,dx))*min(1.,(.24+px*.3)/max(px,.01));
   vec3 sc=rs>1.-strip*.12?COB*1.5:(h21(vec2(id,sd+11.))>.45?SKY:COOL);
   e+=sc*cov*1.1*(.75+.25*sin(uT*.5+id*2.3))*smoothstep(HH*.08,HH*.35,Y)*(1.-smoothstep(HH-2.,HH,Y)*.5);}

float sdTile(vec2 u){vec2 p=abs(u-50.)-28.;return length(max(p,0.))+min(max(p.x,p.y),0.)-22.;}
float sdGem(vec2 u){float m=-1e5;for(int j=0;j<6;j++){m=max(m,dot(uGemE[j].xy,u)-uGemE[j].z);}return m;}

/* the tower, and the Break on it; its crown stays in the cloud unless lightning shows it */
void tower(){
 float z=uTw.x-camZ;if(z>=dep)return;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<FL||Y>1330.)return;
 float hw=uTw.y;float w=hw*(1.-.14*smoothstep(0.,640.,Y));if(Y<64.)w=hw*1.16;
 if(Y>880.)w*=.8;if(Y>1060.)w*=.6;if(Y>1200.)w=3.;

 c+=vec3(.02,.03,.06)*(1.-smoothstep(0.,px*2.+.8,w-abs(X)))*(.5+.5*smoothstep(500.,0.,Y));

  float gem=clamp(.5-dg/pu,0.,1.);
  float k2=clamp((u.y-21.5)/60.,0.,1.);
  vec3 gc=mix(vec3(.9,.975,1.),SKY,smoothstep(0.,.36,k2));gc=mix(gc,vec3(.16,.32,.9),smoothstep(.5,1.,k2)*.62);
  float side=(u.x-58.6)+(u.y-21.5)*.286745;gc=mix(gc,vec3(1.),.28*step(0.,side));

void bridge(){
 float z=ZB-camZ;if(z>=dep||z<1.)return;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<FL)return;
 float px=z*pxW;float un=13.5,tp=17.2;bool hit=false;vec3 c=vec3(.018,.024,.042);vec3 e=vec3(0.);

  float wy=step(tp+1.75,Y)*step(Y,tp+2.45);float wx=fract(tx/1.6);float wn=step(.05,wx)*step(wx,.95)*(1.-step(car,.06));
  float det=1.-smoothstep(.5,1.4,px);float lw=.82+.18*h21(vec2(floor(tx/21.),3.));
  float wd=h21(vec2(floor(tx/1.6),7.));e=COOL*.42*lw*wy*mix(.8,wn*(.55+.45*step(.18,wd)),det);

/* the two buildings at the mouth of the canal, either side of us */
void nearWall(float s){

 float a=z+camZ;if(a>ZN)return;float Y=ch+v.y*z/F;float g=a<ZQ?Yq:0.;if(Y<max(g,FL))return;

 c*=.72+.42*vnoise(vec2(a*1.1,Y*.08)+sd*9.)*(.7+.3*vnoise(vec2(a*7.,Y*.5)));

sndBtn.addEventListener("click", function (e) { e.stopPropagation(); SND.toggle(); });

/* ================= the loop ================= */

}
document.addEventListener("visibilitychange", function () { SND.visible(!document.hidden); if (!document.hidden) wake(); });

/* reduced motion, or a frozen moment for a screenshot */
function stillFrame() {
  if (!ended) return;
  var r = FREEZE >= 0 ? 14 + Math.max(0, FREEZE - TL.end) : 14;
  var nowS = 1e4, PT = /[?&]pt=(\d+)/.exec(location.search);

/* ---------- the opening ---------- */
var shown = 0;

/* ---------- input ---------- */
