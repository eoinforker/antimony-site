* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font: 400 12px/1.4 "Commit Mono", ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the set: a dark, faintly lit housing around the glass */
#rig { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #0c0d0f 0%, #070809 62%, #040405 100%); }
#rig::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background-image: var(--noise); background-size: 160px 160px; mix-blend-mode: screen; }

/* the glass sits in a recess: a thin lip, darker below, catching a little light above */
#lip { position: absolute; left: calc(var(--gx) - 3px); right: calc(var(--gx) - 3px); top: calc(var(--gt) - 3px); bottom: calc(var(--gb) - 3px);
  border-radius: calc(var(--rad) + 3px); background: linear-gradient(180deg, #020202 0%, #0a0b0c 55%, #15171a 100%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .045), 0 -1px 0 rgba(0, 0, 0, .7); }
#tube { position: absolute; left: var(--gx); right: var(--gx); top: var(--gt); bottom: var(--gb); border-radius: var(--rad); overflow: hidden; background: #020304; cursor: text; }
#tube.link { cursor: pointer; }
#tube canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#in { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; resize: none; outline: none; }
#off { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: rgba(238, 234, 224, .26); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; padding: 0 24px; }
#off.on { opacity: 1; }

/* the bar below the glass: a badge, the keys, the power light */
#bar { position: absolute; left: var(--gx); right: var(--gx); bottom: 0; height: var(--gb); display: flex; align-items: center; gap: 18px; padding: 4px 4px 0; }
#badge { display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: 0; color: rgba(238, 234, 224, .30); font-size: 9.5px; letter-spacing: .38em; text-transform: uppercase; white-space: nowrap; }
#badge svg { width: 15px; height: 15px; flex: none; }
#keys { display: flex; gap: 8px; flex: none; }
.key { font: inherit; font-size: 11px; letter-spacing: .08em; color: rgba(238, 234, 224, .62); background: linear-gradient(180deg, #17191c 0%, #0f1012 100%);
  border: 1px solid rgba(255, 255, 255, .06); border-bottom-color: rgba(0, 0, 0, .8); border-radius: 4px; padding: 7px 12px 8px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 1px 2px rgba(0, 0, 0, .6); transition: color .2s ease, background .2s ease; }
.key:hover { color: var(--paper); }
.key:active { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6); }
.key:focus-visible { outline: 1px solid var(--sky); outline-offset: 2px; }
#pw { flex: 1 1 0; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
#led { width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 50%; }
#led i { display: block; width: 6px; height: 6px; border-radius: 50%; background: #10151a; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .8); transition: background .5s ease, box-shadow .5s ease; }
html.on #led i { background: var(--sky); box-shadow: 0 0 6px rgba(148, 230, 255, .75), 0 0 16px rgba(148, 230, 255, .25); }
#led:focus-visible { outline: 1px solid var(--sky); }

@media (max-width: 700px) {
  :root { --gx: 8px; --gt: max(8px, env(safe-area-inset-top)); --gb: calc(60px + env(safe-area-inset-bottom)); --rad: 18px; }
  #bar { gap: 6px; padding: 0 0 env(safe-area-inset-bottom); }
  #badge { display: none; }
  #keys { flex: 1 1 auto; gap: 6px; }
  .key { flex: 1 1 0; padding: 9px 0 10px; font-size: 11.5px; letter-spacing: .04em; }
  #pw { flex: none; }

/* the keyboard is up: give the glass the room */

html.kb #bar { display: none; }
@media (prefers-reduced-motion: reduce) { #off, #led i, .key { transition: none; } }
