<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antimony, Dither</title>
<meta name="description" content="Antimony builds software for the people who make the work. London.">
<meta name="theme-color" content="#EEEAE0">
<link rel="preload" href="assets/fonts/TimelessSerifVF.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* Decide before first paint whether the opening plays: not on a second visit, not under reduced motion. */
  (function () {
    var seen = false;
    try { seen = sessionStorage.getItem('antimony-dither') === '1'; } catch (e) {}
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !still) document.documentElement.className = 'op';
  })();
</script>
<style>
@font-face { font-family: "Timeless"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
@font-face { font-family: "Timeless"; src: url("assets/fonts/TimelessSerifItalicVF.woff2") format("woff2"); font-weight: 200 700; font-style: italic; font-display: swap; }

:root {
  --ink: #0B0C0C;
  --stone: #141311;
  --paper: #EEEAE0;
  --sky: #94E6FF;
  --prussian: #1F3F7A;
  --cobalt: #2448FF;
  --soft: rgba(11, 12, 12, .56);
  --hair: rgba(11, 12, 12, .22);
  --mark: 160px;
}
* { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
html.op { background: var(--ink); }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  background: var(--paper); color: var(--ink);
  font-family: "Timeless", "Iowan Old Style", Georgia, serif;
  font-size: 16px; line-height: 1.55; font-weight: 400;
  font-kerning: normal; font-feature-settings: "kern", "liga";
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
/* Paper grain: baked once as an SVG turbulence tile, multiplied over the page. */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .07  0 0 0 0 .07  0 0 0 0 .06  0 0 0 .55 -.2'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  opacity: .42; will-change: transform;
}
a { color: inherit; }
::selection { background: var(--sky); color: var(--ink); }

.page {
  position: relative; min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center;
  padding: 34px 24px 96px;
}


.tag {
  margin: 0; font-size: 10.5px; line-height: 1.7; letter-spacing: .42em; text-transform: uppercase;
  color: var(--soft); text-align: center; font-weight: 420; padding-left: .42em;
}

.jp {
  position: fixed; right: 23px; top: 50%; transform: translateY(-50%); z-index: 4;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  color: var(--soft); pointer-events: none;
}
.jp b {
  writing-mode: vertical-rl; font-weight: 400; font-size: 11px; letter-spacing: .5em;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}

/* The mark at rest. */
.stage { position: relative; margin-top: 84px; }
#mark { display: block; width: var(--mark); height: var(--mark); }
#trail { position: absolute; left: -64px; top: -64px; pointer-events: none; image-rendering: pixelated; }

.word { display: block; width: 112px; margin: 36px auto 0; color: var(--ink); --lit: var(--prussian); }

.copy { width: 100%; max-width: 452px; margin-top: 48px; }
.copy p { margin: 0 0 1em; font-size: 16px; line-height: 1.6; letter-spacing: .002em; hanging-punctuation: first; }
.copy p em { font-style: italic; }
.copy p a { text-decoration: none; background-image: linear-gradient(var(--prussian), var(--prussian)); background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 92%; color: var(--prussian); }
.copy p a:hover { background-color: rgba(148, 230, 255, .55); }
.copy .rest { color: transparent; }
.copy .rest a, .copy .rest em { color: transparent; background-image: none; }
.copy mark { background: var(--sky); color: var(--ink); padding: 0; }
.copy mark a { color: var(--ink); }
.copy .cur { display: inline-block; width: .5em; height: 1.08em; vertical-align: -.2em; background: var(--sky); margin-left: 1px; }

.rule { width: 32px; height: 1px; background: var(--hair); margin: 10px 0 18px; border: 0; }
.made { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 14px; }
.made a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.made .px { position: relative; width: 24px; height: 24px; flex: none; }
.made .px canvas, .made .px img { position: absolute; inset: 0; width: 24px; height: 24px; image-rendering: pixelated; }
.made .px img { display: none; border-radius: 5px; }
.made span.n { border-bottom: 1px solid transparent; }
.made a:hover span.n, .made a:focus-visible span.n { border-bottom-color: var(--hair); }
.made a:focus-visible { outline: 1px dotted var(--ink); outline-offset: 4px; }


/* The opening layers. */
#veil { position: fixed; inset: 0; background: var(--ink); z-index: 20; display: none; }
html.op #veil { display: block; }
#ink { position: fixed; left: 0; top: 0; z-index: 21; pointer-events: none; display: none; image-rendering: pixelated; }
#inv { position: fixed; z-index: 21; pointer-events: none; display: none; }
#bits { position: fixed; z-index: 22; image-rendering: pixelated; pointer-events: none; display: none; }
#spill { position: fixed; inset: 0; z-index: 23; pointer-events: none; }
html.op .made { visibility: hidden; }
html.op body { overflow: hidden; }
html.op .copy p:not(.on) { color: transparent; }
html.op .copy p:not(.on) a, html.op .copy p:not(.on) em { color: transparent; background-image: none; }

@media (max-width: 640px) {
  .page { padding: 30px 20px 120px; }
  .tag { font-size: 9px; letter-spacing: .3em; padding: 0 22px; max-width: 320px; }
  .stage { margin-top: 56px; }
  .copy { margin-top: 36px; }
  .copy p { font-size: 15.5px; }
  .jp { display: none; }
  .page { align-items: center; }
  .copy { width: 100%; max-width: 452px; }
  .made { gap: 12px 22px; }
}
@media (max-height: 760px) and (min-width: 641px) { .stage { margin-top: 30px; } .copy { margin-top: 34px; } }
</style>
</head>

  /* Ordered dithering: the 8 by 8 Bayer matrix, normalised to (0, 1). */

      if (now - c.spawn < c.t0) { live = true; return; }
      if (t < 1) live = true;
      var e = easeOut(t), ox = r.left + c.u * r.width + c.dx * e, oy = r.top + c.v * r.height + c.dy * e;
      var gx = Math.round(ox / g) * g, gy = Math.round(oy / g) * g;
      var flipped = flipField && flipField(gx, gy);
      var col = c.col === 'sky' ? C.sky : (flipped ? C.prussian : C.paper);
      sx.fillStyle = rgb(col);
      c.last = { x: gx, y: gy, g: g, c: rgb(col) };
      c.shape.forEach(function (s) {
        var X = Math.round((gx + s[0] * g) * DPR), Y = Math.round((gy + s[1] * g) * DPR), S = Math.round(g * DPR);
        sx.fillRect(X, Y, S, S);
      });
    });
    return live;
  }

  /* Trail: each mark of the pointer is a 2 by 2 cluster that thins out in Bayer order within a second. */
  var B2 = [0, .5, .75, .25];
  function drawTrail(now) {
    tx.setTransform(1, 0, 0, 1, 0, 0); tx.clearRect(0, 0, trail.width, trail.height);
    var S = cell * DPR;
    tx.fillStyle = '#94E6FF';
    rest.forEach(function (q) { tx.fillStyle = q.c; tx.fillRect(Math.round(q.x * DPR), Math.round(q.y * DPR), Math.round(q.s * DPR), Math.round(q.s * DPR)); });
    bits = bits.filter(function (b) { return now - b.t < 900; });
    bits.forEach(function (b) {
      var age = (now - b.t) / 900;
      tx.fillStyle = b.c;
      for (var k = 0; k < 4; k++) {
        if (age > 1 - B2[k] * .9 - .08) continue;
        tx.fillRect((b.x + (k & 1) * cell) * DPR, (b.y + (k >> 1) * cell) * DPR, S, S);
      }
    });
    return bits.length > 0;
  }
  var last = null;
  stage.addEventListener('pointermove', function (e) {
    if (root.className === 'op') return;
    var r = trail.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (last && Math.hypot(x - last[0], y - last[1]) < 7) return;
    last = [x, y];
    var n = 1 + (Math.random() < .45 ? 1 : 0);
    for (var i = 0; i < n; i++) {
      var jx = (Math.random() - .5) * 22, jy = (Math.random() - .5) * 22;
      bits.push({ x: Math.round((x + jx) / cell) * cell, y: Math.round((y + jy) / cell) * cell, t: performance.now() + i * 40, c: Math.random() < .7 ? '#94E6FF' : (Math.random() < .86 ? '#1F3F7A' : '#2448FF') });
    }
    loop();
  });
  stage.addEventListener('pointerleave', function () { last = null; });

  var tasks = [];
  function loop() {
    if (raf) return;
    raf = requestAnimationFrame(function step(now) {
      var a = drawTrail(now), b = drawSpill(now), more = a || b;
      for (var i = tasks.length - 1; i >= 0; i--) if (tasks[i](now) === false) tasks.splice(i, 1); else more = true;
      raf = more ? requestAnimationFrame(step) : 0;
    });
  }

  /* The mentions: each mark as a 12 by 12 one bit bitmap; on hover it resolves through 24 and 48 to full colour. */
  var px = [].slice.call(document.querySelectorAll('.made .px'));
  function rasterMark(src, N, done) {
    fetch(src).then(function (r) { return r.text(); }).then(function (t) {
      t = t.replace(/<style[\s\S]*?<\/style>/g, '');
      var img = new Image();
      img.onload = function () {
        var out = {};
        [12, 24, 48].forEach(function (n) {
          var c = document.createElement('canvas'); c.width = c.height = n;
          var x = c.getContext('2d'); x.drawImage(img, 0, 0, n, n);
          if (n === 12) {
            var im = x.getImageData(0, 0, n, n), d = im.data;
            for (var i = 0; i < n * n; i++) {
              var a = d[i * 4 + 3] / 255, L = (.2126 * d[i * 4] + .7152 * d[i * 4 + 1] + .0722 * d[i * 4 + 2]) / 255;
              var q = Math.round((1 - L) * 4) / 4;
              d[i * 4] = 11; d[i * 4 + 1] = 12; d[i * 4 + 2] = 12; d[i * 4 + 3] = a > .5 ? Math.round((.14 + q * .8) * 255) : 0;
            }
            x.putImageData(im, 0, 0);
          }
          out[n] = c;
        });
        done(out);
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t);
    }).catch(function () {});
  }
  px.forEach(function (el) {
    var cv = document.createElement('canvas'); cv.width = cv.height = 12; el.appendChild(cv);
    var img = document.createElement('img'); img.alt = ''; img.src = el.dataset.src; el.appendChild(img);
    var steps = null, timers = [];
    rasterMark(el.dataset.src, 12, function (o) { steps = o; show(12); });
    function show(n) {
      img.style.display = n === 'v' ? 'block' : 'none';
      cv.style.display = n === 'v' ? 'none' : 'block';
      if (n !== 'v') { cv.width = cv.height = n; cv.getContext('2d').drawImage(steps[n], 0, 0); }
    }
    var a = el.closest('a');
    function go(seq) { timers.forEach(clearTimeout); timers = []; if (!steps) return; seq.forEach(function (n, i) { timers.push(setTimeout(function () { show(n); }, i * 55)); }); }
    a.addEventListener('pointerenter', function () { go([24, 48, 'v']); });
    a.addEventListener('focus', function () { go([24, 48, 'v']); });
    a.addEventListener('pointerleave', function () { go([48, 24, 12]); });
    a.addEventListener('blur', function () { go([48, 24, 12]); });
  });

  /* Typing: two or three characters a step, a sky block running just ahead, links and italics intact. */
  function segs(p) {
    var out = [];
    p.childNodes.forEach(function (n) {
      if (n.nodeType === 3) out.push({ t: n.textContent });
      else out.push({ t: n.textContent, tag: n.tagName.toLowerCase(), href: n.getAttribute && n.getAttribute('href') });
    });
    return out;
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function wrap(s, seg) {
    if (!s) return '';
    if (seg.tag === 'a') return '<a href="' + seg.href + '">' + esc(s) + '</a>';
    if (seg.tag === 'em') return '<em>' + esc(s) + '</em>';
    return esc(s);
  }
  function render(sg, k, hl, cursor) {
    var html = '', pos = 0, a = k - hl, parts = [[], [], []];
    sg.forEach(function (seg) {
      var s = seg.t, e = pos + s.length;
      var c0 = Math.max(0, Math.min(s.length, a - pos)), c1 = Math.max(0, Math.min(s.length, k - pos));
      parts[0].push(wrap(s.slice(0, c0), seg)); parts[1].push(wrap(s.slice(c0, c1), seg)); parts[2].push(wrap(s.slice(c1), seg));
      pos = e;
    });
    html = parts[0].join('') + (hl > 0 ? '<mark>' + parts[1].join('') + '</mark>' : parts[1].join('')) + (cursor ? '<span class="cur"></span>' : '') + '<span class="rest">' + parts[2].join('') + '</span>';
    return html;
  }
  function type(p, startAt, cursorAtEnd, onDone) {
    var sg = segs(p), full = p.innerHTML, len = sg.reduce(function (n, s) { return n + s.t.length; }, 0);
    var k = 0, hl = 0, next = startAt, phase = 0, blinks = 0, text = p.textContent;
    p.setAttribute('aria-label', p.textContent);
    p.innerHTML = render(sg, 0, 0, false);
    p.classList.add('on');
    tasks.push(function (now) {
      if (now < next) return true;
      if (phase === 0) {
        /* Keep to the schedule rather than to the frame, so the rhythm holds at any refresh rate. */
        while (now >= next && k < len) {
          var n = Math.random() < .2 ? 2 : 3;
          k = Math.min(len, k + n); hl = Math.min(k, Math.min(9, hl + n));
          next += 18 + Math.random() * 12 + (/[.,]/.test(text.charAt(k - 1)) ? 12 : 0);
        }
        if (k >= len) { phase = 1; next = now + 40; }
        p.innerHTML = render(sg, k, hl, false);
        return true;
      }
      if (phase === 1) {
        hl = Math.max(0, hl - 3); next = now + 26;
        p.innerHTML = render(sg, k, hl, false);
        if (hl === 0) { phase = cursorAtEnd ? 2 : 3; if (onDone) onDone(); }
        return true;
      }
      if (phase === 2) {
        blinks++; next = now + 260;
        p.innerHTML = render(sg, k, 0, blinks % 2 === 1);
        if (blinks >= 6) phase = 3;
        return true;
      }
      p.innerHTML = full; p.removeAttribute('aria-label');
      return false;
    });
    loop();
  }

  function finish() {
    var tr = trail.getBoundingClientRect();
    clusters.forEach(function (c) {
      if (!c.last) return;
      c.shape.forEach(function (s) { rest.push({ x: c.last.x + s[0] * c.last.g - tr.left, y: c.last.y + s[1] * c.last.g - tr.top, s: c.last.g, c: c.last.c }); });
    });
    clusters = []; sx.clearRect(0, 0, spill.width, spill.height); spill.style.display = 'none';
    drawTrail(performance.now());
    root.className = '';
    try { sessionStorage.setItem('antimony-dither', '1'); } catch (e) {}
  }

  if (!playing) return;

  /* The opening. */
  var ink = document.getElementById('ink'), inv = document.getElementById('inv'), vx = inv.getContext('2d');
  var bitsEl = document.getElementById('bits'), veil = document.getElementById('veil');
  var W = innerWidth, H = innerHeight, R = markRect();

  /* The ground is a grid of cells, each a touch different, so the ink is a material and not a void; drawn at
     the cell size and scaled up crisp, so the whole dissolve costs one small image a frame. */
  var cellPx = W < 641 ? 3 : 4, cols = Math.ceil(W / cellPx), rows = Math.ceil(H / cellPx);
  ink.width = cols; ink.height = rows;
  ink.style.width = cols * cellPx + 'px'; ink.style.height = rows * cellPx + 'px'; ink.style.display = 'block';
  var ik = ink.getContext('2d'), gim = ik.createImageData(cols, rows), gd = gim.data;
  for (var i = 0; i < cols * rows; i++) {
    var v = Math.random(), n = v < .06 ? 3 : v < .18 ? 1.5 : v > .97 ? -1 : 0;
    gd[i * 4] = 11 + n; gd[i * 4 + 1] = 12 + n; gd[i * 4 + 2] = 12 + n; gd[i * 4 + 3] = 255;
  }
  ik.putImageData(gim, 0, 0);
  veil.style.display = 'none';

  /* The mark on ink, as vector: stone drawn in paper, crystal in sky. */
  inv.width = Math.round(R.width * DPR); inv.height = Math.round(R.height * DPR);
  inv.style.left = R.left + 'px'; inv.style.top = R.top + 'px'; inv.style.width = R.width + 'px'; inv.style.height = R.height + 'px';
  var invImg = document.createElement('canvas'); invImg.width = inv.width; invImg.height = inv.height;
  (function () {
    var x = invImg.getContext('2d'), s = inv.width / 100;
    x.setTransform(s, 0, 0, s, 0, 0);
    x.fillStyle = '#0B0C0C'; x.fillRect(0, 0, 100, 100);
    var gr = x.createLinearGradient(0, 0, 100, 100); gr.addColorStop(0, '#EEEAE0'); gr.addColorStop(1, '#E2DED4');
    x.fillStyle = gr; x.fill(new Path2D(TILE));
    x.fillStyle = '#0B0C0C'; x.fill(new Path2D(G.seam)); x.fill(new Path2D(G.cav));
    x.fillStyle = '#94E6FF'; x.fill(new Path2D(G.gem));
    x.fillStyle = 'rgba(255,255,255,.28)'; x.fill(new Path2D(G.facet));
  })();

  bitsEl.style.left = R.left + 'px'; bitsEl.style.top = R.top + 'px';
  bitsEl.style.width = R.width + 'px'; bitsEl.style.height = R.height + 'px';
  var maps = {};
  [16, 32, 80, 160].forEach(function (n) { maps[n] = bitmap(n); });
  var seed = document.createElement('canvas'); seed.width = seed.height = 16;
  (function () { var x = seed.getContext('2d'); x.fillStyle = '#94E6FF'; x.fillRect(8, 8, 1, 1); })();
  function showBits(c) { bitsEl.width = c.width; bitsEl.height = c.height; bitsEl.getContext('2d').drawImage(c, 0, 0); bitsEl.style.display = 'block'; }

  /* Dissolve field: each cell of the ground flips at its Bayer value, sooner the nearer it is to the crystal. */
  var field = new Float32Array(cols * rows), cxm = R.left + R.width * .5, cym = R.top + R.height * .515, far = 0;
  for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) far = Math.max(far, Math.hypot(x * cellPx - cxm, y * cellPx - cym));
  for (y = 0; y < rows; y++) for (x = 0; x < cols; x++) field[y * cols + x] = .58 * Math.hypot(x * cellPx - cxm, y * cellPx - cym) / far + .42 * bayer(x, y);
  flipField = function (gx, gy) {
    if (flipT < 0) return false;
    var X = Math.min(cols - 1, Math.max(0, (gx / cellPx) | 0)), Y = Math.min(rows - 1, Math.max(0, (gy / cellPx) | 0));
    return field[Y * cols + X] < flipT;
  };

  var T0 = performance.now();
  var cuts = [[0, seed], [150, 16], [450, 32], [720, 80], [960, 160], [1250, 'v']];
  var ci = 0, typed = false;
  var DISS0 = 1420, DISS1 = 2120;
  tasks.push(function (now) {
    var t = now - T0;
    while (ci < cuts.length && t >= cuts[ci][0]) {
      var c = cuts[ci][1];
      if (c === 'v') {
        vx.drawImage(invImg, 0, 0); inv.style.display = 'block'; bitsEl.style.display = 'none';
        makeClusters(); clusters.forEach(function (k) { k.spawn = now; });
      }
      else showBits(typeof c === 'number' ? maps[c] : c);
      ci++;
    }
    if (t >= DISS0) {
      var p = Math.min(1, (t - DISS0) / (DISS1 - DISS0));
      flipT = p * 1.02;
      for (var i = 0, n = field.length; i < n; i++) gd[i * 4 + 3] = field[i] < flipT ? 0 : 255;
      ik.putImageData(gim, 0, 0);
      /* The mark flips with the ground under it: the same cells, read from the same grid. */
      vx.globalCompositeOperation = 'copy'; vx.drawImage(invImg, 0, 0);
      vx.globalCompositeOperation = 'destination-in'; vx.imageSmoothingEnabled = false;
      vx.drawImage(ink, 0, 0, cols, rows, -R.left * DPR, -R.top * DPR, cols * cellPx * DPR, rows * cellPx * DPR);
      vx.globalCompositeOperation = 'source-over';
      if (!typed && p > .22) {
        typed = true;
        type(document.getElementById('p1'), now + 60, false, function () {
          type(document.getElementById('p2'), performance.now() + 70, true, function () {
            document.querySelector('.made').style.visibility = 'visible';
            finish();
          });
        });
      }
      if (p >= 1) { ink.style.display = 'none'; inv.style.display = 'none'; return false; }
    }
    return true;
  });
  loop();

  addEventListener('resize', function () {
    if (ink.style.display !== 'none') { ink.style.display = 'none'; inv.style.display = 'none'; bitsEl.style.display = 'none'; clusters = []; }
  });
})();
</script>
</body>
</html>
