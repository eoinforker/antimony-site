<style>
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifItalicVF.woff2") format("woff2"); font-weight: 200 700; font-style: italic; font-display: swap; }
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
:root {
  --ink: #0B0C0C; --paper: #EEEAE0; --sky: #94E6FF;
  --text: rgba(238, 234, 224, .84); --dim: rgba(238, 234, 224, .46);
  --s: clamp(180px, 32vmin, 400px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); color-scheme: dark; }
body { background: var(--ink); color: var(--text); font: 400 17px/1.62 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .22em; text-decoration-color: rgba(238, 234, 224, .32); transition: text-decoration-color .15s ease, color .15s ease; }
a:hover { text-decoration-color: var(--paper); color: var(--paper); }
:focus-visible { outline: 1px solid var(--sky); outline-offset: 4px; }
::selection { background: var(--sky); color: var(--ink); }

/* grain on the ink, baked once */
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: .6; background-size: 160px 160px; }

/* construction hairlines, drawn on black beneath the stone */
.build { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.build path { stroke-dasharray: 1 1; stroke-dashoffset: 1; shape-rendering: geometricPrecision; }
/* the film: the typed line, the strike, the flash */
.film { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.line { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font: 400 11px/1 "Commit Mono", ui-monospace, monospace; letter-spacing: .26em; text-indent: .26em; color: rgba(238, 234, 224, .82); white-space: nowrap; opacity: 0; }
.line b { font-weight: 400; color: var(--sky); }
.line span { visibility: hidden; }
.strike { position: absolute; left: 0; top: 0; width: 1.5px; background: var(--sky); transform-origin: 50% 0; opacity: 0; will-change: transform, opacity; }
.flash { position: absolute; inset: 0; background: var(--sky); opacity: 0; }

/* the page */
.page { position: relative; z-index: 1; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 44px; text-align: center; }
.mk { position: relative; width: var(--s); height: var(--s); flex: none; isolation: isolate; }
.mk svg, .mk canvas, .caus { will-change: transform; }
.mk svg, .mk canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
/* light moving in the crystal, very slowly */
.caus { position: absolute; inset: 0; clip-path: polygon(58.6% 21.5%, 70.58% 46.7%, 67.82% 56.3%, 41.4% 81.5%, 29.42% 56.3%, 32.18% 46.7%); opacity: 0; mix-blend-mode: screen; overflow: hidden; }
.caus i { position: absolute; left: 0; top: 0; width: calc(100% + 128px); height: calc(100% + 128px); background-size: 128px 128px; will-change: transform; }
.caus i:first-child { animation: drift-a 26s linear infinite; }
.caus i + i { opacity: .7; animation: drift-b 37s linear infinite; }
@keyframes drift-a { from { transform: translate(0, -128px); } to { transform: translate(-128px, 0); } }
@keyframes drift-b { from { transform: translate(-128px, 0) scaleX(-1); } to { transform: translate(0, -128px) scaleX(-1); } }
.wm { display: block; width: calc(var(--s) * .62); height: auto; margin: calc(var(--s) * .13) auto 0; color: var(--paper); --lit: var(--sky); overflow: visible; }
.col { width: min(30em, 100%); margin-top: 34px; }
.col p { text-wrap: balance; }
.col p + p { margin-top: .9em; }
.col em { font-style: italic; color: var(--paper); }
.made { list-style: none; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px 24px; margin-top: 30px; font-size: 14.5px; color: var(--dim); }
.made a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--dim); }
.made a:hover, .made a:focus-visible { color: var(--paper); }
.made img { width: 16px; height: 16px; border-radius: 4px; filter: grayscale(1) brightness(.9) contrast(.9); opacity: .55; transition: filter .15s ease, opacity .15s ease; }
.made a:hover img, .made a:focus-visible img { filter: none; opacity: 1; }
.made li { display: flex; align-items: center; line-height: 1.4; }
.made .here { margin-left: 14px; }
.rest { width: 100%; display: flex; flex-direction: column; align-items: center; }
.js .rest { opacity: 0; }
.js .mk { opacity: 0; }
.mk, .rest, .flash, .build, .line { will-change: opacity; }
@media (max-width: 600px) {
  :root { --s: min(56vw, 240px); }
  body { font-size: 16px; }
  .page { padding: 40px 22px 36px; }
  .col { margin-top: 28px; }
  .wm { width: calc(var(--s) * .56); }
  .line { font-size: 10px; letter-spacing: .22em; text-indent: .22em; top: 24px; }
  .made { gap: 8px 18px; font-size: 14px; margin-top: 26px; }
  .made .here { margin-left: 6px; }
}
@media (max-width: 370px) { .made { gap: 8px 14px; } .made img { display: none; } .made .here { margin-left: 4px; } }

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const root = document.documentElement;
const lineEl = $(".line"), strikeEl = $(".strike"), flashEl = $(".flash"), film = $(".film");
const mk = $(".mk"), rest = $(".rest"), hl = $(".hl"), hr = $(".hr"), glow = $(".glow"), cutp = $(".cutp"), caus = $(".caus");
const build = $(".build"), gc = $(".gem"), g = gc.getContext("2d");

// timeline, in seconds
const LABEL = "ANTIMONY //:", TEXT = " LONDON", CH = .075;
const T = {};
T.ty0 = .35; T.ty1 = T.ty0 + (LABEL + TEXT).length * CH;
T.out0 = T.ty1 + 1.0; T.out1 = T.out0 + .8;          // hold a second, fade
T.b0 = T.out1 + .55;                                 // a beat of black, then the construction, drawn slowly
T.rise0 = T.b0 + 2.05; T.rise1 = T.rise0 + 1.2;      // the stone rises inside it
T.str0 = T.rise1 + .45; T.imp = T.str0 + .6;          // a held breath, the strike
T.m0 = T.imp + .42; T.m1 = T.m0 + .9;                // light assembles in the crystal
T.p0 = T.m1 + .3; T.p1 = T.p0 + 1.0;                 // the page arrives
T.c0 = T.p0 + .5; T.c1 = T.c0 + .8;
T.end = T.c1 + .05;

const cl = v => v < 0 ? 0 : v > 1 ? 1 : v, seg = (t, a, b) => cl((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
function bez(x1, y1, x2, y2) {   // cubic-bezier easing, solved by Newton steps
  const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = a => 3 * a;
  const f = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t, d = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const s = d(t, x1, x2); if (!s) break; t -= (f(t, x1, x2) - x) / s; } return f(t, y1, y2); };
}
const outCubic = bez(.33, 1, .68, 1), outExpo = bez(.16, 1, .3, 1), inOut = bez(.65, 0, .35, 1), cut = bez(.7, 0, .2, 1), soft = bez(.4, 0, .2, 1);
const TAN = Math.tan(16 * Math.PI / 180), S16 = Math.sin(16 * Math.PI / 180), C16 = Math.cos(16 * Math.PI / 180);
let seed = 16; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// grain: tiles of noise, baked once (one for the ink, one finer for the stone)
function noise(n, f) { const c = document.createElement("canvas"); c.width = c.height = n; const x = c.getContext("2d"), d = x.createImageData(n, n), p = d.data; for (let i = 0; i < p.length; i += 4) f(p, i); x.putImageData(d, 0, 0); return c.toDataURL(); }
$(".grain").style.backgroundImage = `url(${noise(160, (p, i) => { const r = Math.random(); if (r < .45) { const v = r < .3 ? 238 : 0; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = v ? 2 + Math.random() * 6 : 6 + Math.random() * 16; } })})`;
$(".grimg").setAttribute("href", noise(256, (p, i) => { const r = Math.random(), v = r < .5 ? 255 : 0; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = (v ? 4 : 10) + Math.random() * 12; }));

// caustics: thin tileable ridges of light, baked once
(() => {
  const n = 128, c = document.createElement("canvas"); c.width = c.height = n; const x = c.getContext("2d"), d = x.createImageData(n, n), p = d.data, TAU = Math.PI * 2;
  for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) {
    const u = i / n, v = y / n;
    const a = Math.cos(TAU * (u * 2 + v) + 1.4 * Math.sin(TAU * (v * 2 - u)));
    const b = Math.cos(TAU * (u - v * 2) + 1.4 * Math.sin(TAU * (u * 2 + v * 1) + 2));
    const r = Math.exp(-Math.abs(a + b) * 4.2), k = (y * n + i) * 4;
    p[k] = p[k + 1] = p[k + 2] = 255; p[k + 3] = r * 150;
  }
  x.putImageData(d, 0, 0); const url = `url(${c.toDataURL()})`;
  $$(".caus i").forEach(e => e.style.backgroundImage = url);
})();

// the typed line: every character laid out from the start, so nothing reflows
const chars = [];
for (const [str, lit] of [[LABEL, true], [TEXT, false]]) {
  const host = lit ? lineEl.appendChild(document.createElement("b")) : lineEl;
  for (const c of str) { const s = document.createElement("span"); s.textContent = c; host.appendChild(s); chars.push(s); }
}

// the crystal's light, drawn once per size; the mosaic samples it
const GEM = new Path2D("M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z"), FACET = new Path2D("M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5Z");
const light = document.createElement("canvas"), lc = light.getContext("2d");
const BX = [28, 20, 44, 64];   // the crystal's box, in units
let levels = [], K = 1;
function inGem(x, y, b) {   // does a tile touch the crystal? test its corners and centre
  for (const [dx, dy] of [[0, 0], [b, 0], [0, b], [b, b], [b / 2, b / 2]]) if (lc.isPointInPath(GEM, x + dx, y + dy)) return true;
  return false;
}
function paintLight() {
  const W = gc.width; K = W / 100;
  light.width = light.height = W; lc.setTransform(1, 0, 0, 1, 0, 0); lc.clearRect(0, 0, W, W);
  lc.setTransform(K, 0, 0, K, 0, 0); lc.save(); lc.clip(GEM);
  // along the crystal's axis: pale at the point, sky through the body, deeper at the foot
  let gr = lc.createLinearGradient(58.6, 21.5, 41.4, 81.5);
  gr.addColorStop(0, "#D2F5FF"); gr.addColorStop(.42, "#94E6FF"); gr.addColorStop(1, "#5FBDEB");
  lc.fillStyle = gr; lc.fillRect(0, 0, 100, 100);
  // light held inside: a soft core above the centre
  gr = lc.createRadialGradient(53, 43, 0, 53, 43, 24);
  gr.addColorStop(0, "rgba(255,255,255,.42)"); gr.addColorStop(.55, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  lc.fillStyle = gr; lc.fillRect(0, 0, 100, 100);
  // depth at the lower left, where the light turns away
  gr = lc.createLinearGradient(31, 52, 45, 60);
  gr.addColorStop(0, "rgba(20,70,140,.26)"); gr.addColorStop(1, "rgba(20,70,140,0)");
  lc.fillStyle = gr; lc.fillRect(0, 0, 100, 100);
  // the lit facet
  lc.fillStyle = "rgba(255,255,255,.28)"; lc.fill(FACET);
  lc.restore();
  lc.setTransform(1, 0, 0, 1, 0, 0);
  // mosaic levels: coarse to fine; the coarse ones carry the average light of their square
  seed = 16; levels = [];
  for (const [b, a0, a1, sharp, keep] of [[8, 0, .42, false, .42], [4, .16, .7, false, .6], [2, .38, .97, true, 1]]) {
    const tiles = [], n = Math.ceil(100 / b), sm = document.createElement("canvas"); sm.width = sm.height = n;
    const sx = sm.getContext("2d"); sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = "high"; sx.drawImage(light, 0, 0, n, n);
    const px = sx.getImageData(0, 0, n, n).data;
    for (let y = Math.floor(BX[1] / b) * b; y < BX[1] + BX[3]; y += b) for (let x = Math.floor(BX[0] / b) * b; x < BX[0] + BX[2]; x += b) {
      if (!inGem(x, y, b) || rnd() > keep) continue;
      const k = ((y / b) * n + x / b) * 4, j = sharp ? 0 : (rnd() - .5) * .1;
      const f = 1 + j;
      tiles.push({ x, y, t: mix(a0, a1, rnd()), c: [px[k] * f, px[k + 1] * f, px[k + 2] * f] });
    }
    levels.push({ b, tiles, sharp });
  }
}
let lastGem = "";
function gem(t) {
  const p = seg(t, T.m0, T.m1), key = t < T.m0 ? "0" : p >= 1 ? "1" : (p * 1000 | 0) + "";
  if (key === lastGem) return; lastGem = key;
  const W = gc.width; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, W);
  if (t < T.m0) return;
  if (p >= 1) { g.drawImage(light, 0, 0); return; }
  g.save(); g.setTransform(K, 0, 0, K, 0, 0); g.clip(GEM); g.setTransform(1, 0, 0, 1, 0, 0);
  for (const L of levels) {
    const s = L.b * K;
    for (const q of L.tiles) {
      if (q.t > p) continue;
      const x = Math.round(q.x * K), y = Math.round(q.y * K), w = Math.round((q.x + L.b) * K) - x, h = Math.round((q.y + L.b) * K) - y;
      if (L.sharp) g.drawImage(light, x, y, w, h, x, y, w, h);
      else { const c = q.c; g.fillStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; g.fillRect(x, y, w, h); }
      // a tile arrives a little brighter, and settles within a tenth of a second
      const e = (p - q.t) * .9; if (e < .1) { g.fillStyle = `rgba(240,252,255,${(.35 * (1 - e / .1)).toFixed(3)})`; g.fillRect(x, y, w, h); }
    }
  }
  g.restore();
}

const setA = (el, k, v) => { v = String(v); if (el.getAttribute(k) !== v) el.setAttribute(k, v); };
let mkS = 200, strikeO = 0, still = matchMedia("(prefers-reduced-motion: reduce)").matches, seen = false, over = false, rest0 = 0;
try { seen = sessionStorage.getItem("antimony-strike") === "1"; sessionStorage.setItem("antimony-strike", "1"); } catch (e) {}

function layout() {
  // the mark's place at rest, measured without any transform
  const tr = mk.style.transform; mk.style.transform = "none";
  const r = mk.getBoundingClientRect(); mk.style.transform = tr;
  const s = r.width, top = r.top + scrollY; mkS = s;
  rest0 = innerHeight / 2 - (top + s / 2);   // how far the mark sits from the centre of the screen
  const dpr = Math.min(2, devicePixelRatio || 1), W = Math.round(s * dpr);
  if (gc.width !== W) { gc.width = gc.height = W; paintLight(); lastGem = ""; }
  $("#gr").setAttribute("width", (256 * 100 / s / dpr * 1).toFixed(3)); $("#gr").setAttribute("height", (256 * 100 / s / dpr).toFixed(3));
  $(".grimg").setAttribute("width", (256 * 100 / s / dpr).toFixed(3)); $(".grimg").setAttribute("height", (256 * 100 / s / dpr).toFixed(3));
  // the strike: one line the full height of the screen, through the seam of the centred mark
  const H = innerHeight, cx = root.clientWidth / 2, cy = H / 2 + .015 * s, len = (H + 80) / C16;
  strikeO = (cy + 40) / C16;
  // the construction: a vertical through the crystal, the seam carried across the screen, the circle on the tile's corners
  const sy = cy, R = s * Math.SQRT1_2, my = H / 2, a0 = -Math.PI / 2 + 16 * Math.PI / 180;
  $(".b-up").setAttribute("d", `M${cx} ${sy}V-2`); $(".b-dn").setAttribute("d", `M${cx} ${sy}V${H + 2}`);
  $(".b-seam").setAttribute("d", `M${(cx + (cy + 40) * TAN).toFixed(2)} -40L${(cx - (H + 40 - cy) * TAN).toFixed(2)} ${H + 40}`);
  const p = a => `${(cx + R * Math.cos(a)).toFixed(2)} ${(my + R * Math.sin(a)).toFixed(2)}`;
  $(".b-arc").setAttribute("d", `M${p(a0)}A${R.toFixed(2)} ${R.toFixed(2)} 0 0 1 ${p(a0 + Math.PI)}A${R.toFixed(2)} ${R.toFixed(2)} 0 0 1 ${p(a0 + Math.PI * 1.5)}`);
  Object.assign(strikeEl.style, { height: len.toFixed(1) + "px", left: (cx + (cy + 40) * TAN - .75).toFixed(2) + "px", top: "-40px" });
}

function frame(t) {
  // the line, typed at an even pace, held, let go
  const n = t < T.ty0 ? 0 : Math.min(chars.length, Math.floor((t - T.ty0) / CH) + 1);
  chars.forEach((c, i) => c.style.visibility = i < n ? "visible" : "hidden");
  lineEl.style.opacity = t < T.ty0 ? 0 : (1 - inOut(seg(t, T.out0, T.out1))).toFixed(3);
  // the construction, then cleared once the strike has landed
  const bk = [[".b-up", 0, 1.5], [".b-dn", 0, 1.5], [".b-seam", .45, 2.0], [".b-arc", .8, 2.35]];
  for (const [q, a, b] of bk) $(q).style.strokeDashoffset = (1 - inOut(seg(t, T.b0 + a, T.b0 + b))).toFixed(4);
  build.style.opacity = (1 - outCubic(seg(t, T.imp + .15, T.imp + 1.1))).toFixed(3);
  // the stone rises out of the dark
  const ri = outCubic(seg(t, T.rise0, T.rise1));
  // the page: the mark glides from the centre of the screen to its place
  const pk = soft(seg(t, T.p0, T.p1));
  mk.style.opacity = (ri * ri).toFixed(3);
  mk.style.transform = `translate3d(0, ${(rest0 * (1 - pk) + 14 * (1 - ri)).toFixed(2)}px, 0)`;
  rest.style.opacity = outCubic(seg(t, T.c0, T.c1)).toFixed(3);
  // the strike: drawn top to bottom, crisp; then let go
  if (t < T.str0) strikeEl.style.opacity = 0;
  else {
    // drawn from the top; then drawn back into the crystal, at full brightness, never dimmed
    const back = inOut(seg(t, T.imp + .1, T.imp + .75));
    strikeEl.style.opacity = back < 1 ? 1 : 0;
    strikeEl.style.transform = `rotate(16deg) translateY(${(strikeO * back).toFixed(2)}px) scaleY(${(cut(seg(t, T.str0, T.imp)) * (1 - back)).toFixed(4)})`;
  }
  const after = t - T.imp;
  flashEl.style.opacity = after < 0 ? 0 : (.075 * (1 - outExpo(seg(after, 0, .7)))).toFixed(4);
  setA(cutp, "opacity", after < 0 ? 0 : 1);
  setA(glow, "opacity", after < 0 || after > .1 ? 0 : 1);   // one bright frame in the crack, a hard cut
  // the halves part by a hair, and settle
  const u = after < 0 ? 0 : .65 * (outExpo(seg(after, 0, .5)) - inOut(seg(after, .45, 1.25)));
  const px = u * mkS / 100;
  hl.style.transform = `translate3d(${(-C16 * px).toFixed(3)}px, ${(-S16 * px).toFixed(3)}px, 0)`;
  hr.style.transform = `translate3d(${(C16 * px).toFixed(3)}px, ${(S16 * px).toFixed(3)}px, 0)`;
  gem(t);
  caus.style.opacity = (.36 * soft(seg(t, T.m1 + .2, T.m1 + 1.6))).toFixed(3);
}

function settle(fade) {
  over = true; frame(1e3); film.style.display = "none"; build.style.display = "none";
  mk.style.transform = "none";
  if (fade) for (const el of [mk, rest]) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: fade, easing: "ease-out" });
}

function run() {
  layout();
  const params = new URLSearchParams(location.search), freeze = parseFloat(params.get("t"));
  if (!isNaN(freeze)) { frame(freeze); if (freeze >= T.end) settle(0); return; }
  if (still) { settle(0); return; }
  if (seen && !params.has("again")) { settle(600); return; }
  let t0 = null;
  const tick = now => {
    if (over) return;
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    if (t >= T.end) { settle(0); return; }
    frame(t); requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  // a click, a key or a scroll goes straight to the page
  const skip = () => { if (!over) settle(700); };
  for (const ev of ["pointerdown", "keydown", "wheel", "touchmove"]) addEventListener(ev, skip, { once: true, passive: true });
}

addEventListener("resize", () => { layout(); if (over) { lastGem = ""; frame(1e3); mk.style.transform = "none"; } });
// wait for the faces (never longer than a second), then begin
frame(0);
Promise.race([Promise.all([document.fonts.load('400 11px "Commit Mono"'), document.fonts.load('400 17px "Timeless Serif"')]), new Promise(r => setTimeout(r, 1000))]).then(run);
})();
</script>
