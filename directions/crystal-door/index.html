<head>

<meta name="description" content="Antimony. Software, made on purpose.">
<title>Antimony</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23141311%27/%3E%3Cpath fill=%27%2394E6FF%27 d=%27M58.6 21.5L70.58 46.7L67.82 56.3L41.4 81.5L29.42 56.3L32.18 46.7Z%27/%3E%3C/svg%3E">

<script>
/* Before first paint: whether the opening plays (once per session; never under reduced motion). */
(function () {
  var h = document.documentElement, q = location.search, seen = false;
  try { seen = sessionStorage.getItem("antimony.door") === "1"; } catch (e) {}
  if (/[?&](t=\d|again)/.test(q)) seen = false;
  if (/[?&]rest\b/.test(q)) seen = true;
  h.classList.add(!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "opening" : "wait");
})();
</script>
<style>
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
:root {
  --sky: #94E6FF; --ground: #EEEAE0; --type: #0B0C0C; --dimt: rgba(11, 12, 12, .56); --cut: #1F3F7A;
  --s: clamp(140px, 21vmin, 220px);
  --g: clamp(16px, 2.4vw, 34px);
  --fb: clamp(26px, 6vh, 64px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ground); color: var(--type); overflow: hidden; overscroll-behavior: none; }
html.opening:not(.cover), html.opening:not(.cover) body { background: #000; }
html.opening, html.opening body { overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow-x: clip; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: #0B0C0C; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1px solid var(--type); outline-offset: 5px; }

/* the opening's layers: the ground of black (webgl), the characters above it, the typed line above all */
#gl { display: block; pointer-events: none; }
#wall { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none; display: block; }
html:not(.opening) #wall { display: none; }
.type { position: fixed; z-index: 5; top: 30px; left: 0; right: 0; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: #EEEAE0; }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }
html.opening:not(.cover) .wm, html.opening:not(.cover) .foot, html.opening:not(.cover) .ui, html.opening:not(.cover) .paper,
html.wait .foot, html.wait .ui, html.opening:not(.cover) .stage { visibility: hidden; }

/* the room: paper, and the daylight that falls across it through a window and the leaves outside */
.paper { position: fixed; inset: 0; z-index: 1; background: var(--ground); overflow: hidden; }
.sun { position: absolute; inset: 0; opacity: 0; transition: opacity 2.6s cubic-bezier(.3, .1, .3, 1); pointer-events: none; }
html.sunup .sun { opacity: 1; }
.sun div { position: absolute; inset: 0; }
.sun > div { inset: -6%; }
.sun canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.sun .cl { animation: cloud 31s ease-in-out infinite; }
.sun .dr { animation: drift 52s ease-in-out infinite alternate; }
.sun .la { animation: swayA 7.4s ease-in-out infinite alternate; transform-origin: 0 0; }
.sun .lb { animation: swayB 5.1s ease-in-out -2s infinite alternate; transform-origin: 8% 0; }
@keyframes cloud { 0%, 34%, 100% { opacity: 1; } 47% { opacity: .58; } 58% { opacity: .9; } 66% { opacity: .78; } 78% { opacity: 1; } }
@keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-1.6vw, .6vh, 0); } }
@keyframes swayA { from { transform: translate3d(0, 0, 0) rotate(0deg); } to { transform: translate3d(.5vw, .35vh, 0) rotate(.55deg); } }
@keyframes swayB { from { transform: translate3d(0, 0, 0) rotate(0deg); } to { transform: translate3d(-.35vw, .3vh, 0) rotate(-.8deg); } }
html.parked .sun * { animation-play-state: paused; }

/* the one view */
.stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 40px 16px 9vh; }
.lock { display: flex; flex-direction: column; align-items: center; }
.mw { position: relative; width: var(--s); height: var(--s); flex: none; }
.mark { position: absolute; inset: 0; outline: none; border-radius: 22%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mark:focus-visible { outline: 1px solid var(--type); outline-offset: 10px; }
/* the move: the paper and the stone are carried past the frame by the same transform as the glass */
html.moving .paper, html.moving .stage { transform-origin: 0 0; will-change: transform; }
html.moving .mark:focus-visible { outline-color: transparent; }

/* the garden: the world the crystal looks onto, arrived at full screen */
.garden { position: fixed; inset: 0; z-index: 8; overflow: hidden; background: #07080a; color: var(--ground); opacity: 0; pointer-events: none; outline: none; }
html.ingarden .garden { opacity: 1; pointer-events: auto; }
html.fade .garden { transition: opacity .6s ease; }
.gworld { position: absolute; inset: 0; transform-origin: 50% 50%; }
.gframe { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #07080a; }
.gframe picture, .gframe img, .gframe video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.topfade { position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none; background: linear-gradient(180deg, #08090b 0, #08090b calc(100% - 70px), rgba(8, 9, 11, 0) 100%); }
.sign { position: absolute; left: max(28px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom)); width: 112px; line-height: 0; opacity: .8; }
.sign svg { display: block; width: 100%; height: auto; overflow: visible; }
.sign .cA { fill: var(--sky); stroke: var(--sky); }
.back { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); min-height: 44px; padding: 10px 14px; background: none; border: 0; cursor: pointer;
  font: 400 13px/18px "Timeless Serif", Georgia, serif; letter-spacing: .02em; color: var(--ground); opacity: .7; transition: opacity .3s ease; }
.back:hover, .back:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.back:focus-visible { outline: 1px solid rgba(238, 234, 224, .6); outline-offset: -2px; }
html.ingarden .ui { z-index: 9; }
html.ingarden .snd { color: var(--ground); }
html.ingarden .snd:focus-visible { outline-color: var(--ground); }
html.reading .ui, html.reading .back, html.reading .sign { visibility: hidden; }
/* the note in the hall: a quiet button over the folded letter on the fallen block */
.note { position: absolute; left: 0; top: 0; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; }
.note:focus { outline: none; }
.note:focus-visible { box-shadow: 0 0 0 1px rgba(238, 234, 224, .75); }
/* after a quiet while, a soft light passes once over the paper, as on the Garden page */
.note .glint { position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 246, 228, .6), rgba(255, 240, 214, .16) 55%, rgba(255, 240, 214, 0)); mix-blend-mode: screen; }
.note.hint .glint { animation: glint 2.6s cubic-bezier(.3, .1, .3, 1) 1; }
@keyframes glint { 0% { opacity: 0; transform: translate(-16%, -10%) scale(.7); } 45% { opacity: .9; } 100% { opacity: 0; transform: translate(14%, 12%) scale(1); } }
@media (prefers-reduced-motion: reduce) { .note.hint .glint { animation-name: glint-still; } @keyframes glint-still { 0%, 100% { opacity: 0; } 50% { opacity: .6; } } }
/* the letter, lit as the hall is: warm sun from high on the left, the hall's cool shade on the right */
.letter { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: var(--lt-pad, 24px); }
.letter[hidden] { display: none; }
.lt-scrim { position: absolute; inset: 0; background: radial-gradient(120% 90% at 40% 30%, rgba(30, 22, 12, .45), rgba(6, 8, 12, .8)); opacity: 0; }
.sheet { position: relative; height: min(calc(100vh - 2 * var(--lt-pad, 24px)), 860px); height: min(calc(100dvh - 2 * var(--lt-pad, 24px)), 860px);
  aspect-ratio: .707; max-width: calc(100vw - 2 * var(--lt-pad, 24px)); color: #1d1b17; outline: none; transform-origin: 50% 50%;
  background-color: #e9e1d0; background-image:
    linear-gradient(0deg, rgba(60, 40, 20, 0) 49.6%, rgba(60, 40, 20, .07) 50%, rgba(255, 255, 255, .18) 50.4%, rgba(255, 255, 255, 0) 51.4%),
    radial-gradient(140% 110% at 12% 0%, rgba(255, 226, 170, .38), rgba(255, 226, 170, 0) 60%),
    radial-gradient(120% 120% at 100% 100%, rgba(60, 80, 110, .22), rgba(60, 80, 110, 0) 60%),
    url("assets/paper-grain.webp");
  background-size: 100% 100%, 100% 100%, 100% 100%, 640px 640px; background-blend-mode: normal, normal, multiply, multiply;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .2), 0 12px 26px -8px rgba(0, 0, 0, .4), 0 44px 90px -30px rgba(0, 0, 0, .6); }
.sheet-in { position: absolute; inset: 0; padding: 13% 12% 11%; display: flex; flex-direction: column;
  text-shadow: 0 .6px 0 rgba(255, 255, 255, .45), 0 -.35px 0 rgba(0, 0, 0, .14); }
.lt-name { font-weight: 400; font-size: 12px; letter-spacing: .38em; margin-right: -.38em; line-height: 1; }
.lt-line { margin-top: 14px; font-size: 15px; letter-spacing: .01em; color: rgba(29, 27, 23, .62); font-style: italic; }
.lt-body { margin-top: 18%; max-width: 21em; font-size: 18px; line-height: 1.55; letter-spacing: .003em; }
.lt-body p + p { margin-top: 1em; }
.lt-sign { margin-top: auto; font-size: 13px; letter-spacing: .02em; color: rgba(29, 27, 23, .62); }
.lt-close { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border: 0; background: none; color: rgba(29, 27, 23, .5); cursor: pointer; display: grid; place-items: center; border-radius: 50%; transition: color .3s; }
.lt-close svg { width: 16px; height: 16px; }
.lt-close:hover, .lt-close:focus-visible { color: rgba(29, 27, 23, .9); outline: none; }
.lt-close:focus-visible { box-shadow: 0 0 0 1px rgba(29, 27, 23, .4); }
.letter .sheet-in, .letter .lt-close { opacity: 0; }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
html.gl .mark .still { visibility: hidden; }
.wm { color: var(--type); line-height: 0; width: calc(var(--s) * 1.36); margin-top: calc(var(--s) * .37); }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.wm .cA { fill: var(--cut); stroke: var(--cut); }

/* the foot: one line; and the quiet controls either side of it */
.foot { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: 0; padding-bottom: max(var(--fb), env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; color: var(--dimt); white-space: nowrap; }
.snd:focus-visible { outline-offset: -2px; }
.ui { position: fixed; z-index: 2; left: calc(var(--g) - 10px); right: calc(var(--g) - 10px); bottom: calc(max(var(--fb), env(safe-area-inset-bottom)) - 16px); height: 44px; display: flex; align-items: center; justify-content: flex-end; pointer-events: none; }
.ui > * { pointer-events: auto; }
.snd { width: 44px; height: 44px; background: none; border: 0; color: var(--type); cursor: pointer; display: grid; place-items: center; opacity: .74; transition: opacity .3s ease; }
.snd:hover { opacity: 1; }
.snd svg { width: 26px; height: 12px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; }
.snd .w { opacity: 0; transition: opacity .4s ease; }
.snd .f { transition: opacity .4s ease; }
.snd[aria-pressed="true"] .w { opacity: 1; }
.snd[aria-pressed="true"] .f { opacity: 0; }



/* paper grain, fine and even */
.grain { position: fixed; inset: 0; z-index: 6; pointer-events: none; background-size: 128px 128px; }
html.opening .grain { opacity: 0; }

@media (min-width: 601px) and (max-width: 1100px) and (min-aspect-ratio: 1/2) and (max-aspect-ratio: 1/1) { :root { --s: clamp(150px, 25vw, 200px); } }
@media (max-width: 600px) {
  :root { --s: min(42vw, 164px); }
  .type { top: 22px; font-size: 11px; letter-spacing: 2.5px; }
  .stage { padding-bottom: 14vh; }
  .wm { width: calc(var(--s) * 1.46); }
  .foot { padding-bottom: calc(max(var(--fb), env(safe-area-inset-bottom)) + 34px); }
  .foot p { font-size: 9px; letter-spacing: .24em; margin-right: -.24em; }
}
@media (max-width: 350px) { .foot p { letter-spacing: .14em; margin-right: -.14em; } }
@media (prefers-reduced-motion: reduce) {
  .sun *, .sun { animation: none !important; transition: none !important; }
}
</style>

/* ================= the stone, at rest ================= */
