<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEAE0">
<meta name="description" content="Antimony: software for the people who make the work.">
<title>Antimony, Blend</title>
<link rel="preload" href="assets/fonts/TimelessSerifVF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/CommitMono-Latin-VF.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Decided before first paint: a first visit opens on black; a second visit, or reduced motion, opens at rest. */
(function () {
  var h = document.documentElement, q = location.search, seen = false;
  try { seen = sessionStorage.getItem("antimony.blend") === "1"; } catch (e) {}
  if (/[?&](t=\d|again)/.test(q)) seen = false;
  if (/[?&]rest/.test(q)) seen = true;
  var wm = /[?&]wm=(serif|heavy|caps|title)/.exec(q);
  h.setAttribute("data-wm", wm ? wm[1] : "serif");
  if (!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches) h.classList.add("opening");
})();
</script>
<style>
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
:root {
  --ground: #EEEAE0; --paper: #EEEAE0; --ink: #0B0C0C; --sky: #94E6FF; --prussian: #1F3F7A;
  --dim: rgba(11, 12, 12, .5);
  --s: clamp(176px, 28vmin, 296px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ground); color-scheme: light; overflow-x: clip; }
body { min-height: 100vh; min-height: 100svh; background: var(--ground); color: var(--ink); font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: clip; }
html.opening, html.opening body { background: #000; overflow: hidden; }
html.opening.lit, html.opening.lit body { background: var(--ground); }
::selection { background: var(--sky); color: #0B0C0C; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* fine grain with a trace of halftone, baked once */
.grain { position: fixed; inset: 0; z-index: 5; pointer-events: none; background-size: 192px 192px; opacity: 1; }

/* the one view */
.stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 48px 16px 9vh; }
.lock { display: flex; flex-direction: column; align-items: center; }
.mark { position: relative; width: var(--s); height: var(--s); flex: none; }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
html.gl .mark .still { visibility: hidden; }
#gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 3; display: block; pointer-events: none; }
.mark #gl { position: absolute; z-index: 0; }

.wm { display: none; height: auto; color: var(--ink); overflow: visible; margin-top: calc(var(--s) * .24); }
.wm .lit { fill: var(--prussian); }
.wm .facet { fill: var(--sky); }
html[data-wm="serif"] .wm-serif, html[data-wm="heavy"] .wm-heavy { display: block; width: calc(var(--s) * .9); }
html[data-wm="caps"] .wm-caps { display: block; width: calc(var(--s) * 1.06); margin-top: calc(var(--s) * .28); }
html[data-wm="title"] .wm-title { display: block; width: calc(var(--s) * .92); }

.foot { position: fixed; left: 16px; right: 16px; bottom: 0; z-index: 3; padding-bottom: max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 13px; pointer-events: none; }
.line { font-size: 10px; line-height: 1.4; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
/* the old alchemists' sign for antimony: an orb with a bar, a cross above */
.sb { display: block; width: 8px; height: 13px; overflow: visible; opacity: .42; }
.sb * { fill: none; stroke: var(--ink); stroke-width: .5; vector-effect: non-scaling-stroke; }

/* the opening's own furniture */
.type { position: fixed; top: 30px; left: 16px; right: 16px; z-index: 6; text-align: center; white-space: pre; font: 400 11.5px/1.6 "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: .2em; color: var(--paper); display: none; }
.type .label { color: var(--sky); }
html.opening .type { display: block; }
#cons { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: none; overflow: visible; }
html.opening #cons { display: block; }
#cons .h { fill: none; stroke: var(--paper); stroke-width: 1; }
html.opening .wm, html.opening .foot { opacity: 0; }

@media (max-width: 600px) {
  :root { --s: min(56vw, 236px); }
  .stage { padding: 40px 16px 12vh; }
  .line { font-size: 8.5px; letter-spacing: .2em; text-indent: .2em; }
  .type { top: 24px; font-size: 11px; letter-spacing: .16em; }
}
@media (max-width: 340px) { .line { letter-spacing: .12em; text-indent: .12em; } }
@media (min-resolution: 2dppx) { #cons .h { stroke-width: .7; } }
</style>

  /* 4: the word wall gathers; 5: it resolves, split; 6: the join */
  var g = io3(seg(t, T.g0, T.g1));
  var j = vault(seg(t, T.j0, T.j1));
  var lockT = t - T.j1;
  var fl = (lockT < 0 ? 0 : lockT < .07 ? lockT / .07 : .5 + .5 * Math.exp(-(lockT - .07) / .09)) * Math.pow(1 - be, 1.4);
  /* 6b: the paper opens out from the seam, slowly, until it holds the whole screen; the stone darkens as it passes */
  var band = t <= T.x0 ? -2 : HW0 * io2(be);
  /* the water feels the vault close: one small rock that dies away */
  var tau = Math.max(0, t - T.j1), env = Math.exp(-ZE * OM * tau), A = t > T.j1 ? .07 : 0;
  W.th = A * env * Math.sin(OM * tau); W.tv = A * env * OM * (Math.cos(OM * tau) - ZE * Math.sin(OM * tau)); W.gx = -W.th * 22; W.z = 0; W.rip = A * 3 * env;
  /* once the paper holds the screen, the canvas shrinks to the mark: same field, same pixels */
  var lit = t >= T.x1;
  html.classList.toggle("lit", lit);
  if (lit && full) { measure(); frameMark(); } else if (!lit && !full) { measure(); frameFull(); }
  if (lit) { draw({ clock: t }); }
  else draw({
    clock: t, field: t < T.c1 + .05 ? 1 : 0,
    fin: io2(seg(t, T.f0, T.f1)), g: g, s: 1 + 2.4 * (1 - g), flick: Math.floor(t * 9) * (t < T.g1 ? 1 : 0) + (t >= T.g1 ? 999 : 0),
    bar: o3(seg(t, T.b0, T.b1)), crisp: o3(seg(t, T.c0, T.c1)) * 1.001,
    light: o3(seg(t, T.l0, T.l1)), split: 1 - j, flare: fl, band: band, pg: 1
  });

  /* 7: the wordmark, in one clean move; then the line at the foot */
  var w = o3(seg(t, T.w0, T.w1));
  wm.style.opacity = w.toFixed(3); wm.style.transform = "translateY(" + (8 * (1 - w)).toFixed(2) + "px)";
  foot.style.opacity = o3(seg(t, T.n0, T.n1)).toFixed(3);
}

(document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load('400 10px "Commit Mono"'), document.fonts.load('400 10px "Timeless Serif"')]), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve()).then(begin, begin);

function begin() {
  if (!opening) {
    try { sessionStorage.setItem("antimony.blend", "1"); } catch (e) {}
    startRest(30);
    if (!reduced) [mark, wm, foot].forEach(function (el) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: "cubic-bezier(.25,.6,.3,1)" }); });
    return;
  }
  measure(); frameFull(); buildAtlas(); build();
  var start = performance.now(), done = false;
  function tick(now) {
    if (done) return;
    var t = FREEZE >= 0 ? FREEZE : (now - start) / 1000;
    if (t >= T.end) { finish(t); return; }
    at(t);
    if (FREEZE < 0) requestAnimationFrame(tick);
  }
  function finish(t) {
    if (done) return; done = true;
    var skipped = t < T.end;
    html.classList.remove("opening", "lit");
    wm.style.opacity = wm.style.transform = foot.style.opacity = "";
    try { sessionStorage.setItem("antimony.blend", "1"); } catch (e) {}
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { removeEventListener(ev, skip, true); });
    W.th = W.tv = W.z = W.rip = W.gx = 0;
    if (skipped) [mark, wm, foot].forEach(function (el) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: "cubic-bezier(.25,.6,.3,1)" }); });
    else { var tau = t - T.j1, env = Math.exp(-ZE * OM * tau); W.th = .07 * env * Math.sin(OM * tau); W.tv = .07 * env * OM * (Math.cos(OM * tau) - ZE * Math.sin(OM * tau)); W.gx = -W.th * 22; }
    startRest(t);
  }
  function skip() { if (!done && FREEZE < 0) finish((performance.now() - start) / 1000); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, skip, { passive: true, capture: true }); });
  addEventListener("resize", function () { if (!done) { measure(); frameFull(); buildAtlas(); build(); } });
  if (/[?&]debug/.test(location.search)) window.__seek = function (t) { at(t); return new Promise(function (r) { requestAnimationFrame(function () { r(); }); }); };
  if (FREEZE >= T.end) { finish(FREEZE); return; }
  requestAnimationFrame(function (now) { start = now; tick(now); });
}
})();
