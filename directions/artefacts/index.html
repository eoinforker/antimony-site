 h-=.003*pr(abs(dT)-.45,W);

vec3 KC;vec3 KB;vec3 RIM;vec3 FIL;
vec3 env(vec3 r,float soft){

 float sh=smoothstep(-.05,.42,d);float ct=smoothstep(0.,.035,sdRR(p.xz,B.xz,RC));

void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y*2.;

 vec3 ro=uCo,rd=normalize(uCf+(uv.x*uCr+uv.y*uCu)*uTan);
 WF=max(uPxu*.9,.0011);W=WF/(MS*.01);
 vec3 bmin=-B-.003,bmax=B+.003;vec3 iv=1./rd;vec3 t0=(bmin-ro)*iv,t1=(bmax-ro)*iv;vec3 tn3=min(t0,t1),tf3=max(t0,t1);
 float tn=max(max(tn3.x,tn3.y),tn3.z),tf=min(min(tf3.x,tf3.y),tf3.z);
 float t=-1.;
 if(tn<tf&&tf>0.){float s=max(tn,0.);for(int i=0;i<72;i++){float d=sdBox(ro+rd*s);if(d<.00025){t=s;break;}s+=d;if(s>tf)break;}}

  vec3 p=ro+rd*t;vec3 n=nB(p);vec3 V=-rd;

  vec3 R=reflect(rd,n);float nv=max(dot(n,V),0.);

/* ===== 2. the sign: halo lit letters off a wet concrete wall, at night, in the rain ===== */
var FS_SIGN = `
uniform sampler2D uS1,uS2,uWl; uniform vec3 uCo,uCf,uCr,uCu; uniform float uTan;
uniform vec2 uMC; uniform float uMS;
const vec2 SC=vec2(0.,.22); const float SH=.62; const float ZL=.05; const float FL=-.84;
vec2 stx(vec2 w){return vec2((w.x-SC.x)/(2.*SH)+.5,.5-(w.y-SC.y)/(2.*SH));}
vec4 m1(vec2 w){vec2 t=stx(w);if(t.x<0.||t.x>1.||t.y<0.||t.y>1.)return vec4(0.);return texture2D(uS1,t);}
vec4 m2(vec2 w){vec2 t=stx(w);vec2 e=max(abs(t-.5)-.5,0.);return texture2D(uS2,clamp(t,0.,1.))*exp(-dot(e,e)*60.);}
vec3 E(vec4 hb){return vec3(.9,.95,1.)*(hb.r*1.7+hb.g*1.)+lin(SKY)*hb.b*3.6;}
float rv(vec2 w,float t){float cx=w.x*34.;float id=floor(cx);float f=fract(cx);float has=step(.7,h12(vec2(id,3.)));
 float x0=.3+.4*h12(vec2(id,7.))+sin(w.y*7.+id)*.05;float line=smoothstep(.07,.0,abs(f-x0));
 float dr=pow(fract(w.y*1.4+t*(.22+.18*h12(vec2(id,1.)))+h12(vec2(id,2.))),22.);
 return has*line*(.25+dr*3.)*smoothstep(-1.,.4,w.y);}
vec3 wall(vec2 w,vec3 rd,float t,out float wet){
 vec2 pc=w/vec2(1.2,.6);vec2 pid=floor(pc);vec2 pf=fract(pc);
 float tone=.86+.28*h12(pid);
 vec4 bk=texture2D(uWl,vec2((w.x+3.)/6.,(w.y+.9)/3.));
 float lo=bk.r;
 float a=.2*tone*(.8+.4*lo);
 vec2 c=w*92.;vec2 ci=floor(c);vec2 cf=fract(c)-.5;vec2 o=(vec2(h12(ci),h12(ci+5.))-.5)*.5;
 float pore=step(.8,h12(ci+9.))*smoothstep(.2,.09,length(cf-o));
 a*=1.-.65*pore;
 vec2 sd=min(pf,1.-pf)*vec2(1.2,.6);float seam=min(sd.x,sd.y);
 a*=1.-.55*smoothstep(.0045,.0012,seam);a*=1.+.12*smoothstep(.012,.005,seam)*step(.0045,seam);
 vec2 th=vec2(fract(pc.x*2.)-.5,pf.y-.5)*vec2(.6,.6);float tr=length(th);
 float hole=smoothstep(.0105,.008,tr);float rim=smoothstep(.016,.0095,tr)-hole;
 a*=1.-.75*hole;a*=1.+.35*rim;
 float st=bk.g*1.6;
 float below=smoothstep(.016,.0,abs(th.x))*step(th.y,-.01)*exp(th.y*5.);
 float r=rv(w,t);
 wet=clamp(smoothstep(.55,.95,st)*.45+below*.6+.35+r,0.,1.);
 a*=mix(1.,.62,wet);
 float bump=bk.b*2.-1.;
 a*=1.+bump*.22;
 vec4 hb=m2(w);
 vec2 lp=w-vec2(-1.5,1.25);float lamp=exp(-dot(lp,lp)*.55);
 vec3 amb=vec3(.07,.085,.12)*lamp*(1.+bump*1.2)+vec3(.004,.006,.014)+.0008;
 vec3 col=vec3(a)*vec3(.94,.97,1.04)*(E(hb)+amb);

vec3 floorC(vec3 pg,vec3 rd,float t){
 vec2 gp=pg.xz;
 vec2 nn=vec2(0.);
 for(int i=0;i<2;i++){vec2 q=gp*(5.+float(i)*3.5)+float(i)*13.;vec2 id=floor(q);vec2 f=fract(q)-.5;float h=h12(id);float ph=fract(t*.55+h);
  vec2 o=(vec2(h12(id+3.),h12(id+7.))-.5)*.5;vec2 d=f-o;float r=length(d);float rr=ph*.42;
  float ring=sin((r-rr)*70.)*smoothstep(.05,0.,abs(r-rr))*(1.-ph);nn+=d/max(r,1e-3)*ring*.11;}
 nn+=(vec2(vn(gp*9.),vn(gp*9.+4.))-.5)*.05;
 vec3 n=normalize(vec3(nn.x,1.,nn.y));
 vec3 r=reflect(rd,n);
 float pm=smoothstep(.42,.62,fbm(gp*1.6+2.));
 vec3 refl=vec3(0.);
 if(r.z<0.){float tr=-pg.z/r.z;vec3 pr=pg+r*tr;
  /* wet ground smears a light into a long streak toward the eye */
  for(int k=0;k<6;k++){float fk=float(k);vec4 hb=m2(vec2(pr.x+nn.x*.6,pr.y+fk*.26));refl+=(E(hb)*.05+lin(SKY)*hb.b*.25)*exp(-fk*.35);}}

float rain(vec2 sp,float t){float acc=0.;

  vec3 pL=ro+rd*((ZL-ro.z)/rd.z),pM=ro+rd*((ZL*.5-ro.z)/rd.z);

  col=mix(col,aC,a1.b);
 }
 /* the rain in front, lit where it passes the sign */
 vec4 hr=m2(pW.y<FL?vec2(pW.x,FL+.2):pW.xy);

 vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y*2.;
