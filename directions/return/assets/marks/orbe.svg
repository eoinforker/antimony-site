@keyframes in-b { from { transform: translate(8px,8px); opacity: 0; } 40% { opacity: 1; } to { transform: none; } }
@keyframes breathe-t { 0%, 60%, 100% { transform: none; } 30% { transform: translate(-2px,-2px); } }
@keyframes breathe-b { 0%, 60%, 100% { transform: none; } 30% { transform: translate(2px,2px); } }
@media (prefers-reduced-motion: reduce) { .t, .b { animation: none; } }
