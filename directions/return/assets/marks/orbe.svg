<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Orbe: the Portal mark, its two pieces closing together"><title>Orbe</title><style>
.t { animation: in-t 1.4s cubic-bezier(.2,.7,.1,1) both, breathe-t 5s 2.4s ease-in-out infinite; }
.b { animation: in-b 1.4s cubic-bezier(.2,.7,.1,1) both, breathe-b 5s 2.4s ease-in-out infinite; }
