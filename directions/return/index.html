em { font-style: italic; }

/* Orbe, in the sentence: its mark rises beside the word for a moment */
.orbe { position: relative; }

.orbe.on .peek { opacity: 1; transform: none; }

.foot a { text-decoration: none; }
.foot a:hover, .foot a:focus-visible { color: var(--text); }
#mark { all: unset; position: relative; display: block; width: 80px; height: 80px; cursor: pointer; border-radius: 22%; -webkit-tap-highlight-color: transparent; }
#mark:focus-visible { outline: 1px solid var(--prussian); outline-offset: 5px; }
#mark canvas { position: absolute; left: -16px; top: -16px; width: calc(100% + 32px); height: calc(100% + 32px); display: block; }
#mark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the opening */
#veil, #fly, #lock { position: fixed; left: 0; top: 0; pointer-events: none; display: none; }
#veil { z-index: 20; image-rendering: pixelated; image-rendering: crisp-edges; }
#fly { z-index: 21; width: 100vw; height: 100vh; }
#lock { z-index: 22; overflow: visible; opacity: 0; color: var(--paper); left: 0; top: 0; height: auto; }
#black { position: fixed; inset: 0; z-index: 19; background: var(--black); display: none; }
html.open #black { display: block; }
html.open #veil, html.open #fly, html.open #lock { display: block; }
html.open .lab, html.open main p, html.open .foot nav { visibility: hidden; }
html.open.typing main p { visibility: visible; }
html.open .lab.go, html.open.again .lab { visibility: visible; }
html.open.shown .foot nav { visibility: visible; }
.foot-in { animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) both; }

@keyframes rise { from { opacity: 0; } to { opacity: 1; } }

/* typing: the layout is set in full from the start; characters are revealed in place */
.c.u { color: transparent; }
.typing .orbe { text-decoration: none; }
.typing .orbe .c { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: rgba(38, 41, 42, .35); }

.done .c { transition: background-color .45s ease; }

<script>

    q.d = tgt > q.d ? q.d + (tgt - q.d) * .5 : q.d * .86; if (q.d < .004) q.d = 0; else any = true;

}
addEventListener("pointermove", e => {
  if (root.classList.contains("open") || still) return;
  const r = btn.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, pad = 12;
  const inside = x > -pad && y > -pad && x < r.width + pad && y < r.height + pad;
  pointer = inside ? { x, y } : null; if (inside && !need) { need = true; requestAnimationFrame(breakLoop); }
}, { passive: true });

/* ---------- Orbe, in the sentence ---------- */
const orbe = document.querySelector("#p1 .orbe"); let peekT = 0;
const peek = () => { if (root.classList.contains("open")) return; clearTimeout(peekT); orbe.classList.add("on"); peekT = setTimeout(() => orbe.classList.remove("on"), 1500); };
orbe.addEventListener("pointerenter", peek); orbe.addEventListener("focus", peek);

/* ---------- the lockup: our capitals, with the crystal cut A, set beneath the pixel mark ---------- */
const lock = document.getElementById("lock");
function placeLock(cx, top, w) { lock.style.width = w + "px"; lock.style.left = Math.round(cx - w / 2) + "px"; lock.style.top = top + "px"; }

/* ---------- the opening ---------- */
const black = document.getElementById("black"), veil = document.getElementById("veil"), vx = veil.getContext("2d"), fly = document.getElementById("fly"), fx = fly.getContext("2d");
const lab = document.querySelector(".lab"), ps = [document.getElementById("p1"), document.getElementById("p2")], footEls = [".foot nav"].map(s => document.querySelector(s));
const ORIG = ps.map(p => p.innerHTML);
const BAYER = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21].map(v => (v + .5) / 64);
const N = 48, LEVELS = [6, 12, 24, 48];
let T = null, timers = [], raf = 0, L = null, fine = null, tiles = [], vimg = null, v32 = null, typedOnce = false, playing = false;

// the Break sampled to a 48 by 48 grid: 0 ground, 1 stone, 2 crystal, 3 lit facet
function sampleFine() {
  const S = 480, o = document.createElement("canvas"); o.width = o.height = S; const g = o.getContext("2d"); g.scale(S / 100, S / 100);
  g.fillStyle = "#f00"; g.fill(tile()); g.globalCompositeOperation = "destination-out"; g.fill(new Path2D(G.seam)); g.fill(new Path2D(G.cav));
  g.globalCompositeOperation = "source-over"; g.fillStyle = "#0f0"; g.fill(new Path2D(G.gem)); g.fillStyle = "#00f"; g.fill(new Path2D(G.facet));

}
function buildTiles() {
  tiles = LEVELS.map(n => {
    const b = N / n, list = [];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const cnt = [0, 0, 0, 0]; for (let y = 0; y < b; y++) for (let x = 0; x < b; x++) cnt[fine[(j * b + y) * N + i * b + x]]++;
      let k = 0; for (let m = 1; m < 4; m++) if (cnt[m] > cnt[k]) k = m; if (k === 3 && cnt[2] > cnt[3]) k = 2;
      list.push({ i, j, k, t: Math.random() });
    }
    return list;
  });
}
// timeline, in seconds from the first frame of black
const TL = { beat: 1.2, asm: [[1.2, 1.8], [1.65, 2.3], [2.1, 2.75], [2.55, 3.15]], close: [3.15, 3.65], lockIn: [3.5, 4.3], glint: [3.9, 4.7], lockOut: [4.9, 5.3], dis: [5.4, 6.9], fly: [6.1, 7.3] };
function layout() {
  const W = innerWidth, H = innerHeight, phone = W < 600;
  const cell = Math.max(4, Math.floor(Math.min(W * (phone ? .72 : .5), H * (phone ? .4 : .48)) / N));
  const s = cell * N, ox = Math.round((W - s) / 2 / cell) * cell, oy = Math.round((H * .44 - s / 2) / cell) * cell;
  const D = cell / 2 >= 3 ? cell / 2 : cell;   // the dither grid shares the mark's grid
  const vw = Math.ceil(W / D), vh = Math.ceil(H / D);
  veil.width = vw; veil.height = vh; veil.style.width = vw * D + "px"; veil.style.height = vh * D + "px";
  vimg = vx.createImageData(vw, vh); v32 = new Uint32Array(vimg.data.buffer);
  const dpr = DPR(); fly.width = Math.round(W * dpr); fly.height = Math.round(H * dpr); fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = btn.getBoundingClientRect();
  const cx = ox + .5 * s, cy = oy + .515 * s;
  const rmax = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy));
  L = { W, H, cell, s, ox, oy, D, vw, vh, home: { x: r.left, y: r.top, s: r.width }, cx, cy, rmax };
  placeLock(ox + s / 2, Math.round(oy + s + Math.max(28, s * .11)), Math.round(s * .74));
}
const BAND = .3;
let vA = 0;
const isPaper = (x, y) => { const r = Math.hypot(x - L.cx, y - L.cy) / L.rmax, xi = Math.floor(x / L.D), yi = Math.floor(y / L.D); return (vA - r) / BAND > BAYER[(xi & 7) + (yi & 7) * 8]; };
function drawVeil() {
  const { vw, vh, D, cx, cy, rmax } = L, BLK = 0xFF000000 | (BLACK[2] << 16) | (BLACK[1] << 8) | BLACK[0];
  for (let y = 0; y < vh; y++) { const py = (y + .5) * D - cy, row = y * vw, by = (y & 7) * 8;
    for (let x = 0; x < vw; x++) { const r = Math.hypot((x + .5) * D - cx, py) / rmax; v32[row + x] = (vA - r) / BAND > BAYER[(x & 7) + by] ? 0 : BLK; } }
  vx.putImageData(vimg, 0, 0);
}
function colourOf(k, glint) {
  if (k === 1) return PAPER;
  const base = k === 3 ? LIT : SKY; return glint > 0 ? mixc(base, [236, 251, 255], glint * .75) : base;
}
function frame() {
  if (!playing) return;
  const t = (performance.now() - T) / 1000, { s, ox, oy, home } = L;
  fx.clearRect(0, 0, L.W, L.H);
  lock.style.opacity = (out3(cl((t - TL.lockIn[0]) / (TL.lockIn[1] - TL.lockIn[0]))) * (1 - sstep(TL.lockOut[0], TL.lockOut[1], t))).toFixed(3);
  if (t < TL.dis[0]) {
    // 1. assembly: tiles arrive at random places, coarse to fine; then it holds, and light crosses the crystal once
    const gp = (t - TL.glint[0]) / (TL.glint[1] - TL.glint[0]);
    if (t < TL.asm[3][1]) {
      for (let li = 0; li < LEVELS.length; li++) {
        const [a, b] = TL.asm[li], cs = s / LEVELS[li], gap = L.cell >= 6 ? 1 : .75;
        for (const q of tiles[li]) {
          const at = a + q.t * (b - a); if (t < at) continue;
          const X = ox + q.i * cs, Y = oy + q.j * cs;
          fx.clearRect(X, Y, cs, cs); if (!q.k) continue;
          const fresh = t - at < .07 && li < 3;

          fx.fillRect(X, Y, cs - gap, cs - gap);
        }
      }
    } else {
      const cs = L.cell, gap = (cs >= 6 ? 1 : .75) * (1 - sstep(TL.close[0], TL.close[1], t));   // the grid closes: a crisp pixel object

      }
    }

    // 2. the black dissolves to paper from the crystal outward, in an ordered dither, while the mark flies home to the foot
    vA = inout(cl((t - TL.dis[0]) / (TL.dis[1] - TL.dis[0]))) * (1 + BAND);
    if (black.style.display !== "none") black.style.display = "none";
    drawVeil();
    const f = cl((t - TL.fly[0]) / (TL.fly[1] - TL.fly[0])), e = inout(f);
    const S = s + (home.s - s) * e, X0 = ox + (home.x - ox) * e, Y0 = oy + (home.y - oy) * e, cs = S / N;
    fx.globalAlpha = 1 - sstep(.84, 1, f);

      // stone is the inverse of whatever ground lies under it: paper on black, ink on paper
      const c = k === 1 ? (isPaper(X + w / 2, Y + h / 2) ? STONE : PAPER) : colourOf(k, 0);
      fx.fillStyle = css(c); fx.fillRect(X, Y, w, h);
    }
    fx.globalAlpha = 1;

}
function clearAll() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }

/* typing: steady for the label; two or three characters at a time for the copy, the sky block running at the front */
function split(p) {
  const out = [];
  const walk = n => { for (const ch of [...n.childNodes]) {
    if (ch.nodeType === 3) { const f = document.createDocumentFragment(); for (const c of ch.textContent) { const s = document.createElement("span"); s.className = "c u"; s.textContent = c; f.appendChild(s); out.push(s); } ch.replaceWith(f); }
    else if (ch.nodeType === 1 && ch.tagName !== "IMG") walk(ch); } };
  walk(p); return out;
}
function typeLabel(done) {
  const full = lab.dataset.text; lab.textContent = ""; lab.classList.add("go"); let i = 0;
  const step = () => { i++; lab.textContent = full.slice(0, i); if (i < full.length) timers.push(setTimeout(step, 40)); else timers.push(setTimeout(done, 260)); };
  timers.push(setTimeout(step, 40));
}
function typePara(k, cs, done) {
  const p = ps[k]; let i = 0; const HL = 4;
  const step = () => {
    const n = Math.min(cs.length, i + 2 + (Math.random() < .45 ? 1 : 0));
    for (let m = Math.max(0, i - HL); m < n; m++) { cs[m].classList.remove("u"); cs[m].classList.toggle("h", m >= n - HL); }
    i = n;
    if (i < cs.length) timers.push(setTimeout(step, 18 + Math.random() * 26));
    else { p.classList.add("done"); timers.push(setTimeout(() => { cs.forEach(c => c.classList.remove("h")); }, 140)); timers.push(setTimeout(() => { p.innerHTML = ORIG[k]; p.classList.remove("done"); done(); }, 700)); }
  };
  step();
}
function showFoot() {
  root.classList.add("shown");
  footEls.forEach(el => { el.classList.remove("foot-in"); void el.offsetWidth; el.classList.add("foot-in"); });
}
function startText() {
  if (typedOnce) { root.classList.remove("open", "typing", "again", "shown"); return; }
  const sets = ps.map(split); root.classList.add("typing");
  typeLabel(() => typePara(0, sets[0], () => timers.push(setTimeout(() => typePara(1, sets[1], () => { typedOnce = true; showFoot(); root.classList.remove("open", "typing", "again", "shown"); }), 240))));
}
function end(fromFrame) {
  playing = false; cancelAnimationFrame(raf);
  fx.clearRect(0, 0, L ? L.W : 0, L ? L.H : 0); vx.clearRect(0, 0, veil.width, veil.height);
  veil.style.display = fly.style.display = black.style.display = lock.style.display = "none"; mk.style.opacity = 1;
  if (fromFrame) startText(); else finishText();
}
function finishText() {
  clearAll(); ps.forEach((p, k) => { p.innerHTML = ORIG[k]; p.classList.remove("done"); });
  lab.textContent = lab.dataset.text; lab.classList.add("go"); typedOnce = true;
  root.classList.remove("open", "typing", "again", "shown");
}
let skippedAt = 0;
function skip() { if (!root.classList.contains("open")) return; skippedAt = performance.now(); clearAll(); end(false); }
function play(beat) {
  clearAll(); scrollTo(0, 0); root.classList.add("open"); root.classList.remove("shown"); black.style.display = ""; veil.style.display = fly.style.display = lock.style.display = "";
  footEls.forEach(el => el.classList.remove("foot-in"));
  if (typedOnce) root.classList.add("typing", "again");
  layout(); vx.clearRect(0, 0, veil.width, veil.height); mk.style.opacity = 0; lock.style.opacity = 0;
  if (!fine) fine = sampleFine();
  buildTiles(); playing = true;

}
["pointerdown", "keydown", "wheel", "touchmove"].forEach(ev => addEventListener(ev, e => {
  if (!root.classList.contains("open")) return; if (ev === "keydown" && (e.metaKey || e.ctrlKey || e.altKey)) return; skip();
}, { passive: true }));
addEventListener("resize", () => { if (root.classList.contains("open")) skip(); buildMark(); });
btn.addEventListener("click", () => { if (still || root.classList.contains("open") || performance.now() - skippedAt < 600) return; pointer = null; play(.7); });

const ready = document.fonts ? Promise.race([Promise.all([document.fonts.load('400 19px "Timeless Serif"'), document.fonts.load('italic 400 19px "Timeless Serif"'), document.fonts.load('400 12px "Commit Mono"')]), new Promise(r => setTimeout(r, 1200))]) : Promise.resolve();
buildMark();
if (root.classList.contains("open")) {
  try { sessionStorage.setItem("antimony.return.seen", "1"); } catch (e) {}
  const t0 = performance.now();
  ready.catch(() => {}).then(() => { if (!root.classList.contains("open")) return; const spent = (performance.now() - t0) / 1000; play(Math.max(.4, TL.beat - spent)); });
} else typedOnce = true;
})();
