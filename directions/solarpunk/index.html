* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--day); color: var(--prussian); }
html.opening, html.opening body { background: #000; overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow: hidden; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the world: one canvas, drawn small and scaled up */
#world { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; }
html.nogl #world { display: none; }
html.nogl body { background: linear-gradient(#5f97e0 0%, #a9cbef 46%, #e9efef 58%, #7fb26a 60%, #4f8f4a 100%); }

/* the typed line */
.type { position: fixed; z-index: 5; top: 30px; left: 16px; right: 16px; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: var(--paper); }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }

/* the name, set high in the sky like a title in a film; the one line beneath it */
.title { position: fixed; z-index: 2; left: var(--gut); right: 16px; top: max(clamp(30px, 6.4vh, 64px), env(safe-area-inset-top)); pointer-events: none; }
.wm { width: clamp(186px, 15.5vw, 244px); color: var(--prussian); line-height: 0; }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.wm .cA { fill: var(--cobalt); stroke: var(--cobalt); }
.foot { margin-top: 16px; font-size: 10px; line-height: 12px; letter-spacing: .32em; text-transform: uppercase; color: rgba(31, 63, 122, .74); white-space: nowrap; }
html.opening .title { opacity: 0; }

/* sound: one small control, top right */
.snd { position: fixed; z-index: 6; top: max(clamp(22px, 5.6vh, 56px), env(safe-area-inset-top)); right: var(--gut); width: 40px; height: 40px; margin: -8px -10px 0 0; display: grid; place-items: center;
  background: none; border: 0; border-radius: 50%; color: var(--prussian); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity .9s cubic-bezier(.25,.6,.3,1); }
.snd svg { width: 22px; height: 22px; overflow: visible; }
.snd .w { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
.snd .w path { transition: transform .9s cubic-bezier(.25,.6,.3,1), opacity .6s; transform-origin: 11px 11px; }
.snd[aria-pressed="false"] .w path { transform: scaleY(.08); opacity: .7; }
.snd[aria-pressed="false"] .w path:nth-child(2) { transition-delay: .05s; }
.snd[aria-pressed="false"] .w path:nth-child(3) { transition-delay: .1s; }
.snd:focus-visible { outline: 1px solid rgba(31, 63, 122, .7); outline-offset: 0; }
html.opening .snd { opacity: 0; pointer-events: none; }

/* the parts of the world you can touch: the mark on the tower, the poster on the wall, and the three kites */
.hit { position: fixed; z-index: 3; left: 0; top: 0; display: block; background: none; border: 0; border-radius: 22%; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
html.opening .hit, html.nogl .hit { visibility: hidden; }
.hit:focus-visible { box-shadow: 0 0 0 1px rgba(31, 63, 122, .7); }
.kite { position: fixed; z-index: 3; left: 0; top: 0; display: block; color: var(--prussian); text-decoration: none; outline: none; visibility: hidden; -webkit-tap-highlight-color: transparent; }
.kite.on { visibility: visible; }
.kite .nm { position: absolute; left: 50%; bottom: 100%; margin-bottom: 7px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; line-height: 14px; letter-spacing: .06em; color: var(--prussian); opacity: 0; transition: opacity .9s cubic-bezier(.25,.6,.3,1); }
.kite.lit .nm { opacity: .9; }
.kite:hover .nm, .kite:focus-visible .nm { opacity: 1; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

@media (max-width: 600px) {

"uniform vec4 uTr[8];uniform sampler2D uAtlas;uniform sampler2D uPoster;uniform vec3 uGemE[6];uniform vec3 uCavE[6];uniform vec3 uSeamE[12];uniform vec3 uChipE[12];",
"float camX,ch,camZ,F,pxW;vec2 v;vec3 col;float wet,occT;",
"float fogT(float z,float Y){return exp(-z*(.00034+.0012*exp(-max(Y,0.)/90.)));}",
"void lay(float z,vec3 c,float Y,float a){if(a<=0.)return;float T=fogT(z,Y);col=mix(col,mix(uHaze,c,T),a);wet*=1.-a;occT*=1.-a;}",
"float sunAt(float Y){return smoothstep(uSunY-6.,uSunY+6.,Y);}",
"vec3 lightF(vec3 a,float ndl,float Y){return a*(uSunC*ndl*sunAt(Y)+uFill);}",
"float cv(float d,float px){return clamp(.5-d/px,0.,1.);}",
"vec3 leaf(vec2 p,float sc,float px,float sd){",
" float n=fbm3(p*sc+sd);float n2=fbm3(p*sc+sd+vec2(-.16,.13));",
" float lt=clamp(.5+(n-n2)*2.4,0.,1.);lt=mix(lt,smoothstep(.2,.8,n),.25);",
" float f=vnoise(p*sc*4.3+sd*1.7);float det=1.-smoothstep(.25,1.,px*sc*4.3);",
" lt=mix(lt,lt*(.86+.28*f),det);",
" return GREEN(.14+.72*lt)*(.58+.5*lt);}",
/* the sky: deep blue overhead, paper at the horizon, fair weather cloud, a bank of cumulus along the edge of the world */
"vec3 skyC(){",
" float h=v.y;",
" vec3 c=mix(uSkyH,uSkyZ,smoothstep(-.02,.64,h));",
" c=mix(c,uSkyH*vec3(1.03,1.01,.97),exp(-max(h,0.)/.03)*.55);",
" c+=uSunC*.06*smoothstep(.8,-.9,v.x)*smoothstep(-.05,.5,h);",
" float d=0.;if(h>.02){",
" float zc=(1800.-ch)*F/max(h,.004);",
" vec2 cp=vec2((v.x*zc/F+camX)*.00052+uT*.0009,(zc+camZ)*.00034+uT*.0003);",
" float n=fbm(cp);float cov=mix(.53,.32,uCloud);",
"  d=smoothstep(cov,cov+.2,n)*smoothstep(.03,.22,h);",
" float n2=fbm(cp+vec2(-.03,.025));float sh=clamp(.6+(n2-n)*6.,0.,1.);sh=mix(sh,1.,smoothstep(cov+.2,cov+.05,n)*.6);",
" vec3 cb=mix(uSkyZ,uSkyH,.72)*.9+uFill*.1;vec3 ct=uSunC*.6+uFill*.62;",
" c=mix(c,mix(cb,ct,sh),d*.9);",
" }",
" float bx=v.x+uT*.0006;",
" float top=(.045+.09*fbm3(vec2(bx*1.6,2.3))+.035*vnoise(vec2(bx*6.5,5.)))*(1.+.8*uCloud);",
" float pf=fbm3(vec2(bx*7.,h*13.)+vec2(0.,uT*.002));",
" float e=top+(pf-.5)*.03-h;",
" float m=smoothstep(-.003,.003,e)*smoothstep(-.04,.03,h);",
" float body=smoothstep(0.,.06,e);",
" vec3 cc=mix(uSunC*.68+uFill*.55,mix(uSkyH,uSkyZ,.3)*.9+uFill*.12,body*.7*(1.-.5*pf));",
" cc=mix(cc,uHaze,smoothstep(.035,-.01,h)*.75);",
" c=mix(c,cc,m*.94);",
" if(uBow>0.){vec2 A=vec2(.42,-.31);float r=length(v-A);float x=(r-.99)/.045;",
"  float hu=clamp((1.-x)*.5,0.,1.)*.76;vec3 sp=clamp(abs(mod(hu*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);sp=mix(vec3(1.),sp,.6);",
"  float w=exp(-x*x*.9)*smoothstep(.0,.12,h)*(1.-.7*d)*(1.-.8*m);",
"  c=mix(c,c*.78+sp*.36,uBow*.42*w);c+=uBow*.025*smoothstep(1.,.6,r)*smoothstep(0.,.1,h)*(1.-m);}",
" return c;}",
/* the ground: the pool, its coping, a gravel walk and a rill on the right, and lawn */
"void ground(){",
" if(v.y>=0.)return;float z=ch*F/(-v.y);float X=v.x*z/F+camX;float Zw=z+camZ;float px=z*pxW;float pz=px*z/max(ch,.1);",
" float ax=abs(X);float pw=uPool.x;float end=uPool.y;",
" float wm=cv(ax-pw,px)*cv(Zw-end,pz);",
" float rl=X-(pw+2.75);float wr=cv(abs(rl)-.24,px)*cv(Zw-end,pz)*cv(14.-Zw,pz)*step(0.,X);",
" vec3 c;",
" float cop=max(cv(ax-pw-.42,px)*cv(Zw-end-.42,pz),cv(abs(rl)-.38,px)*cv(Zw-end,pz)*cv(14.-Zw,pz)*step(0.,X));",
" float mn=fbm3(vec2(X*.07,Zw*.035));float wv=vnoise(vec2(X*.09+uWind.z*.35,Zw*.05+uWind.z*.12));",
" float sn=vnoise(vec2(X*2.6,Zw*.35))*.6+vnoise(vec2(X*7.,Zw*.9))*.4;",
" vec3 lawn=GREEN(.26+.3*mn+.16*wv+.12*(sn-.5)*(1.-smoothstep(.02,.12,px)))*(.88+.14*wv);",
" lawn=mix(lawn,vec3(dot(lawn,vec3(.34,.5,.16)))*vec3(.95,1.02,.96),.22);",
" float fl=step(.992,h21(floor(vec2(X,Zw)*vec2(7.,6.))))*(1.-smoothstep(.015,.05,px));",
" lawn=mix(lawn,h21(floor(vec2(X,Zw)*vec2(7.,6.))+3.)>.55?PAP:mix(SKY,COB,.3),fl*.8);",
" float pth=cv(ax-pw-1.9,px);",
" vec3 grv=vec3(.74,.72,.67)*(.93+.1*h21(floor(vec2(X,Zw)*14.)));",
" float dr=smoothstep(.55,.7,fbm3(vec2(X*.25,Zw*.08)+4.))*smoothstep(pw+1.9,pw+2.4,ax)*(1.-smoothstep(pw+5.,pw+7.,ax));",
" vec3 mdw=GREEN(.22+.3*vnoise(vec2(X*3.,Zw*.8)))*.92;float mf=step(.93,h21(floor(vec2(X,Zw)*vec2(9.,6.))))*(1.-smoothstep(.02,.07,px));",
" mdw=mix(mdw,h21(floor(vec2(X,Zw)*vec2(9.,6.))+1.)>.5?PAP:mix(SKY,COB,.35),mf);lawn=mix(lawn,mdw,dr);",
" float es=smoothstep(pw+1.9,pw+2.3,ax)*(1.-smoothstep(pw+2.3,pw+2.9,ax));lawn*=1.-.12*es;",
" c=mix(lawn,grv,pth*step(Zw,end+8.));",
" c=mix(c,vec3(.84,.82,.78),cop);",
" float ao=1.-.25*cv(abs(Zw-uWall.z)-.3,pz)*step(X,uWall.x)*step(uWall.y,X);",
" for(int i=0;i<8;i++){vec4 t=uTr[i];if(t.w<=0.)continue;vec2 sc=vec2(t.x+t.w*.55,t.y+t.w*1.1);vec2 e=(vec2(X,Zw)-sc)/vec2(t.w*1.15,t.w*1.7);float sh=smoothstep(1.,.35,length(e)+(vnoise(vec2(X,Zw)*.9+float(i))-.5)*.35);ao*=1.-.42*sh;}",
" c=lightF(c,.8*ao,0.);",
" float a=1.-max(wm,wr);",
" col=mix(col,mix(uHaze,c,fogT(z,0.)),a);wet=1.-a;}",
/* far white turbines on the edge of the city */
"void turbines(float z0){",
" float z=z0-camZ;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<0.||Y>300.)return;float px=z*pxW;",
" float cell=floor(X/150.);if(h21(vec2(cell,9.))<.3)return;",
" float x0=(cell+.3+.4*h21(vec2(cell,10.)))*150.;if(abs(x0-uTw.x)<260.)return;",
" float hh=165.+40.*h21(vec2(cell,11.));float R=58.;vec2 p=vec2(X-x0,Y-hh);",
" if(abs(p.x)>R+4.)return;",
" float dm=max(abs(p.x)-mix(2.6,1.3,clamp(Y/hh,0.,1.)),Y-hh);",
" float ang=uT*(.5+.12*h21(vec2(cell,12.)))+cell*2.1;float b=1e5;",
" for(int i=0;i<3;i++){float a=ang+float(i)*2.0944;vec2 dr=vec2(cos(a),sin(a));float t=clamp(dot(p,dr),0.,R);b=min(b,length(p-dr*t)-mix(2.3,.5,t/R));}",
" b=min(b,length(p)-2.8);",
" float a=cv(min(dm,b),px);float T=mix(fogT(z,Y),1.,.45);col=mix(col,mix(uHaze,lightF(vec3(.9,.91,.92),.55,Y),T),a);}",
/* a row of the green city at one depth: stepped towers, planting on every ledge and every roof */
"void skyline(float z0,float sd,float bw,float hb,float hv,float gap){",
" float z=z0-camZ;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<0.)return;float px=z*pxW;",
" float a=X/bw+sd*7.31;float id=floor(a);float fx=fract(a);",
" float r=h21(vec2(id,sd));float H=hb+hv*r*r;",
" float bc=(id+.5-sd*7.31)*bw;",
" H*=mix(.2,1.,smoothstep(gap,gap*2.,abs(bc-uTw.x)));",
" if(Y>H+14.)return;",
" float ns=2.+floor(h21(vec2(id,sd+1.))*3.);float sh=H/ns;",
" float k=clamp(floor(Y/sh),0.,ns-1.);",
" float wd=.45-.075*k;float dx=(abs(fx-.5)-wd)*bw;",
" float gh=(1.6+2.6*vnoise(vec2(X*.35,sd*3.)))*(1.+z0*.0007);",
" float aB=cv(max(dx,Y-H),px);",
" float wl=.45-.075*max(k-1.,0.);float yl=k*sh;",
" float aL=k>0.?cv(max((abs(fx-.5)-wl)*bw,Y-yl-gh),px):0.;",
" float aR=cv(max(dx+.6,Y-H-gh*1.25),px)*step(H-1.,Y);",
" float gn=vnoise(vec2(X*.5,Y*.5)+sd);",
" vec3 gC=lightF(GREEN(.3+.55*gn),.72,Y);",
" lay(z,gC,Y,max(aL,aR));",
" if(aB<=0.)return;",
" vec3 alb=mix(vec3(.90,.88,.84),vec3(.95,.95,.93),h21(vec2(id,sd+2.)));",
" if(h21(vec2(id,sd+3.))>.82)alb=vec3(.80,.85,.90);",
" float fy=fract(Y/3.6);float det=1.-smoothstep(.45,1.2,px/3.6);",
" float gl=smoothstep(.34,.4,fy)*(1.-smoothstep(.82,.88,fy));",
" vec3 glass=mix(uSkyH,uSkyZ,.45+.4*fy)*.78+uSunC*.04;",
" float solar=step(.6,h21(vec2(id,sd+4.)))*step(k,0.)*step(.8,fract(Y/sh));",
" float hang=smoothstep(.0,.6,fract(Y/sh)-.86+.08*vnoise(vec2(X*.9,Y)))*step(.5,h21(vec2(id,sd+6.)));",
" vec3 c=lightF(alb,.6,Y);",
" c=mix(c,glass,mix(.42,gl,det)*.85);",
" c=mix(c,mix(COB*.32,uSkyZ*.55,.35)+uSunC*.03,solar*.9);",
" c=mix(c,gC*.9,hang*.85);",
" float side=smoothstep(wd*bw-3.,wd*bw-2.4,(fx-.5)*bw);c=mix(c,alb*(uFill*.95+uSunC*.06),side*.85);",
" c*=1.-.18*(1.-smoothstep(0.,6.,Y));",
" lay(z,c,Y,aB);}",
"float sdTile(vec2 u){vec2 p=abs(u-50.)-28.;return length(max(p,0.))+min(max(p.x,p.y),0.)-22.;}",
"float sdGem(vec2 u){float m=-1e5;for(int j=0;j<6;j++){m=max(m,dot(uGemE[j].xy,u)-uGemE[j].z);}return m;}",
"float sdCav(vec2 u){float m=-1e5;for(int j=0;j<6;j++){m=max(m,dot(uCavE[j].xy,u)-uCavE[j].z);}return m;}",
"float sdSeam(vec2 u){float d=1e5;for(int k=0;k<3;k++){float m=-1e5;for(int j=0;j<4;j++){vec3 e=uSeamE[k*4+j];m=max(m,dot(e.xy,u)-e.z);}d=min(d,m);}return d;}",
"float sdChips(vec2 u){float d=1e5;for(int k=0;k<3;k++){float on=k==0?uHole.x:(k==1?uHole.y:uHole.z);if(on>.5){float m=-1e5;for(int j=0;j<4;j++){vec3 e=uChipE[k*4+j];m=max(m,dot(e.xy,u)-e.z);}d=min(d,m);}}return d;}",
/* the tower: pale stone, fluted, its roof a garden; the Break set into its crown, the crystal holding the sky */
"void tower(){",
" float z=uTw.y-camZ;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<0.)return;float px=z*pxW;",
" float lx=X-uTw.x;float H=uTwS.x;float hw=uTwS.y*(1.-.045*Y/H);",
" if(abs(lx)>hw+6.||Y>H+30.)return;",
" float gh=(5.+10.*fbm3(vec2(X*.07,1.)))*smoothstep(hw,hw*.55,abs(lx));",
" float aR=cv(max(abs(lx)-hw+1.,Y-H-gh),px)*step(H-1.,Y);",
" if(aR>0.){float n=vnoise(vec2(X*.25,Y*.3));lay(z,lightF(GREEN(.3+.5*n)*(.8+.3*smoothstep(H,H+gh,Y)),.8,Y),Y,aR);}",
" float aB=cv(max(abs(lx)-hw,Y-H),px);if(aB<=0.)return;",
" vec3 st=vec3(.92,.905,.865);",
" float rib=abs(fract(lx/7.2)-.5)*7.2;st*=.9+.1*smoothstep(.35,1.2,rib);float rb2=abs(fract(lx/2.4)-.5)*2.4;st*=.975+.025*smoothstep(.1,.5,rb2);",
" float jn=abs(fract(Y/18.)-.5)*18.;st*=1.-.05*(1.-smoothstep(.0,max(px,.3),jn-8.6));",
" st*=1.-.06*smoothstep(H-5.,H-4.,Y);",
" float side=smoothstep(hw-9.,hw-8.4,lx);",
" vec3 c=lightF(st,mix(.62,.0,side),Y);float sg=step(.5,fract((lx-hw)/3.))*side*step(Y,H-6.);c=mix(c,mix(uSkyZ,uSkyH,.4)*.55+COB*.06,sg*.55);",
" c*=.94+.06*smoothstep(0.,H,Y);",
" vec3 e=vec3(0.);float gemA=0.;float tileA=0.;vec3 tileC=vec3(0.);",
" vec2 u=vec2(lx/uTw.w*100.+50.,(uTw.z-Y)/uTw.w*100.+50.);",
" if(u.x>-4.&&u.x<104.&&u.y>-4.&&u.y<104.){",
"  float pu=px/uTw.w*100.;",
"  float dT=sdTile(u);float dc=min(sdSeam(u),sdCav(u));float dg=sdGem(u);float dh=sdChips(u);",
"  float inT=cv(dT,pu);float stone=cv(max(dT,max(-dc,-dh)),pu);",
"  float g=clamp((u.x*.5+u.y*.8)/130.,0.,1.);",
"  vec3 tc=lightF(mix(vec3(.13,.135,.15),vec3(.07,.072,.08),g),.62,Y);",
"  float ep=max(-dT,0.)/pu;tc+=uSunC*.05*exp(-ep*ep/.8)*(1.-g);",
"  c=mix(c,c*vec3(.8,.82,.86),inT*(1.-stone));",
"  tileA=stone;tileC=tc;",
"  gemA=cv(dg,pu);",
"  float k2=clamp((u.y-21.5)/60.,0.,1.);",
"  vec3 gc=mix(vec3(.93,.985,1.),SKY,smoothstep(0.,.36,k2));gc=mix(gc,vec3(.25,.48,.95),smoothstep(.5,1.,k2)*.55);",
"  float sd2=(u.x-58.6)+(u.y-21.5)*.286745;gc=mix(gc,vec3(1.),.28*step(0.,sd2));",
"  gc*=.93+.07*vnoise(u*.12+vec2(uT*.1,-uT*.08));",
"  e=gc*(1.+.12*uHov)*(.82+.3*sunAt(Y));",
" }",
" lay(z,c,Y,aB);",
" float Tm=mix(fogT(z,Y),1.,.5);if(tileA>0.)col=mix(col,mix(uHaze,tileC,Tm),tileA*aB);if(gemA>0.){float T=mix(fogT(z,Y),1.,.55);col=mix(col,mix(uHaze,e,T),gemA*aB);}",
" occT=1.;}",
/* the viaduct, white and slender, and the light rail along it */
"void viaduct(){",
" float z=300.-camZ;float X=v.x*z/F+camX;float Y=ch+v.y*z/F;if(Y<0.||Y>32.)return;float px=z*pxW;",
" float d0=23.6,d1=25.6;",
" float aD=cv(abs(Y-(d0+d1)*.5)-(d1-d0)*.5,px);",
" float pp=(fract(X/52.+.3)-.5)*52.;float aP=cv(max(abs(pp)-.85,Y-d0),px);",
" float aK=cv(abs(Y-(d1+1.05))-.5,px)*.35;",
" vec3 cc=vec3(.92,.92,.91);",
" if(aP>0.)lay(z,lightF(cc,mix(.7,.15,smoothstep(-.6,.6,pp)),Y),Y,aP);",
" if(uTrain>-1e3){float tx=uTrain-X;",
"  if(tx>-2.&&tx<100.&&Y>d1&&Y<d1+4.4){",
"   float ny=(Y-d1-2.2)/2.2;float nose=tx<4.5?sqrt(max(0.,1.-pow(1.-tx/4.5,2.)))*1.:1.;float tail=smoothstep(100.,98.,tx);",
"   float aT=cv(max(abs(ny)-nose*tail*.98,-tx),px/2.2);",
"   vec3 b=vec3(.95,.955,.96);",
"   float wy=step(d1+1.9,Y)*step(Y,d1+3.2);float wx=fract(tx/2.3);float car=fract(tx/24.);",
"   vec3 gw=mix(PRU,uSkyZ,.45)*.75+uSkyH*.08*step(d1+2.9,Y);",
"   vec3 tc=mix(b,gw,wy*mix(.85,1.,step(.1,wx))*step(5.,tx));",
"   tc=mix(tc,COB*.75,step(d1+.75,Y)*step(Y,d1+.98)*step(2.5,tx));",
"   tc*=1.-.25*(1.-smoothstep(0.,.05,abs(car-.5)-.49))*step(6.,tx);",
"   lay(z,lightF(tc,.6,Y)*(1.-.18*smoothstep(.3,1.,-ny)),Y,aT);}}",
" if(aD>0.){vec3 dc=lightF(cc,step(d0+.55,Y)*.62+.08,Y);lay(z,dc,Y,aD);}",
" if(aK>0.)lay(z,mix(uSkyH,PAP,.5),Y,aK);}",
/* a stepped tower: a ziggurat of pale stone and glass, planted on every ledge, its roof a small wood */
"void zig(float z0,float xc,float wb,float ns,float sh,float ins,float sd){",
" float z=z0-camZ;if(z<2.)return;float X=v.x*z/F+camX;float lx=X-xc;if(abs(lx)>wb*.5+8.)return;float Y=ch+v.y*z/F;if(Y<0.||Y>ns*sh+14.)return;float px=z*pxW;",
" float k=clamp(floor(Y/sh),0.,ns-1.);float hw=wb*.5-k*ins;",
" float aB=cv(max(abs(lx)-hw,Y-ns*sh),px);",
" float yl=k*sh;float big=step(.58,vnoise(vec2(lx*.13,k*3.1+sd)));",
" float gh=.9+1.1*vnoise(vec2(lx*.7,k*3.+sd))+big*(1.8+2.4*fbm3(vec2(lx*.3,k+sd)));",
" float aL=k>0.?cv(max(max(abs(lx)-hw-ins+.3,-(abs(lx)-hw+.6)),Y-yl-gh),px):0.;",
" float tw=wb*.5-(ns-1.)*ins;float aR=cv(max(abs(lx)-tw+.4,Y-ns*sh-gh*1.4),px)*step(ns*sh-.5,Y);",
" float ln=vnoise(vec2(X,Y)*.45+sd)-.5;float ln2=vnoise(vec2(X,Y)*1.6+sd)-.5;",
" float kk=smoothstep(-.3,.9,(Y-yl)/max(gh,1.)*.8+ln*.9+ln2*.3-.1*sign(lx));",
" vec3 gC=mix(vec3(.15,.3,.2),vec3(.52,.71,.35),kk)*(uSunC*.6*sunAt(Y)+uFill*1.05)*1.08;",
" lay(z,gC,Y,max(aL,aR));",
" if(aB<=0.)return;",
" float fy=fract(Y/sh);float f2=fract(Y/(sh*.5));",
" vec3 alb=mix(vec3(.9,.885,.85),vec3(.93,.93,.92),h21(vec2(sd,2.)));",
" float gl=smoothstep(.12,.16,f2)*(1.-smoothstep(.78,.82,f2))*step(fy,.84);",
" float mu=abs(fract(lx/3.)-.5)*3.;gl*=mix(1.,smoothstep(.0,px+.01,mu-.05),.5);",
" vec3 glass=mix(uSkyH,uSkyZ,.2+.6*f2)*.54+uFill*.06;",
" vec3 c=lightF(alb,.6,Y);c=mix(c,glass,gl*.82);",
" float par=smoothstep(.86,.87,fy)*(1.-smoothstep(.95,.96,fy));c=mix(c,mix(COB*.34,uSkyZ*.55,.45),par*.8);",
" float hang=(1.-smoothstep(0.,.4,(.86-fy)*sh-(1.4+2.8*vnoise(vec2(lx*.4,k*2.+sd)))*vnoise(vec2(lx*1.1,k*5.+sd))))*step(fy,.86)*step(.32,vnoise(vec2(lx*.16,k+sd)));",
" float pf=step(.78,h21(vec2(k,sd+8.)))*step(.3,vnoise(vec2(lx*.1,k)));hang=max(hang,pf*smoothstep(.4,.5,vnoise(vec2(lx*.9,Y*.9)+sd)));",
" c=mix(c,gC*.92,hang*.92);",
" float side=smoothstep(hw-3.2,hw-2.8,lx);c=mix(c,c*vec3(.74,.78,.86),side);",
" lay(z,c,Y,aB);}",
/* trees, painted as masses: a few lobes of leaf, each lit from the upper left like a brushed shape, swaying a little */
"void tree(float X0,float Z0,float H,float R,float sd){",
" float z=Z0-camZ;if(z<1.)return;float X=v.x*z/F+camX;if(abs(X-X0)>R*1.9)return;float Y=ch+v.y*z/F;if(Y<0.||Y>H+R*1.5)return;float px=z*pxW;",
" float sw=(uWind.x*(.55+.45*sin(uWind.z*.9+sd*3.))+uWind.y)*.22;",
" vec2 p=vec2(X-X0-sw*R*.12*clamp((Y-H*.5)/R,0.,2.),Y-H);",
" float d=1e5;vec3 nn=vec3(0.);float ao=0.;float ws=0.;",
