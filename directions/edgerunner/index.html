#stone:focus-visible { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--hot); }
#stone svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.bit { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; overflow: visible; }

.slap.cob .peel { background: var(--cobalt); color: var(--paper); }

.slap.on { visibility: visible; }
.slap.in { animation: slap .26s cubic-bezier(.2,1.6,.4,1) both; }
.slap.off { visibility: visible; animation: tear .42s cubic-bezier(.6,0,.9,.4) both; pointer-events: none; }
.slap:hover .peel, .slap:focus-visible .peel { box-shadow: 0 2px 0 rgba(0,0,0,.55), 3px 6px 0 rgba(0,0,0,.35), 0 0 0 3px var(--hot); }
.slap.staple::before, .slap.staple::after { content: ""; position: absolute; top: 3%; width: 14%; height: 3px; background: linear-gradient(#cfd3d8, #7d838b); box-shadow: 0 1px 0 rgba(0,0,0,.6); border-radius: 1px; z-index: 2; }
.slap.staple::before { left: 12%; transform: rotate(-4deg); }
.slap.staple::after { right: 12%; transform: rotate(3deg); }
@keyframes slap { 0% { opacity: 0; transform: var(--at) scale(1.7) rotate(9deg); } 45% { opacity: 1; transform: var(--at) scale(.93) rotate(-1deg); } 100% { opacity: 1; transform: var(--at) scale(1); } }

.still .slap.in, .still .slap.off { animation: none; }
