  snd.want = on; try { sessionStorage.setItem(SKEY, on ? "1" : "0"); } catch (e) {}
  sndUI();
  if (on) { if (!snd.ctx) sndBuild(); else { snd.ctx.resume(); snd.g.master.gain.setTargetAtTime(.9, snd.ctx.currentTime, .4); } poke(); }
  else if (snd.ctx) { snd.g.master.gain.setTargetAtTime(0, snd.ctx.currentTime, .12); }
}
sbtn.addEventListener("click", function (e) { e.stopPropagation(); soundSet(!snd.want); });
/* a choice made earlier this session is kept; the first touch is the gesture that lets it play */
function firstGesture() { removeEventListener("pointerdown", firstGesture, true); removeEventListener("keydown", firstGesture, true); if (snd.want && !snd.ctx) sndBuild(); }
if (snd.want) { addEventListener("pointerdown", firstGesture, true); addEventListener("keydown", firstGesture, true); }
sndUI();

/* ================= the opening: a dark shelter in the rain, then the poster's tubes catch ================= */
var booted = false, openStart = 0;
function finishOpening() {
  if (openT < 0) return;
  openT = -1; html.classList.remove("opening"); remember();
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { removeEventListener(ev, skip, true); });
}
function skip(e) { if (e && e.type === "keydown" && /^(Shift|Control|Alt|Meta|Tab)$/.test(e.key)) return; if (openT >= 0 && FREEZE < 0) { finishOpening(); poke(); } }
function begin() {
  if (booted) return; booted = true;
  sizeAll();
  html.classList.add("ready");
  if (opening) {
    openT = 0; openStart = performance.now();
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, skip, { passive: true, capture: true }); });
    if (FREEZE >= T.end) finishOpening();
  } else {
    remember();
    if (!reduced && FREEZE < 0) { html.classList.add("wait"); requestAnimationFrame(function () { requestAnimationFrame(function () { html.classList.remove("wait"); }); }); }
  }
  t0 = performance.now();
  poke();
}
var fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load("400 13px 'Timeless Serif'"), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve();
fontsReady.then(function () { begin(); drawText(); }, begin);
})();
