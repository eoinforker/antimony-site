<style>
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
:root {
  --sky: #94E6FF;
  --ground: #EEEAE0; --type: #0B0C0C; --dimt: rgba(11, 12, 12, .55); --cut: #1F3F7A;
  --s: clamp(140px, 21vmin, 220px);
}
html[data-theme="prussian"] { --type: #1F3F7A; --dimt: rgba(31, 63, 122, .62); --cut: #94E6FF; }
html[data-theme="night"]    { --ground: #0B0C0C; --type: #EEEAE0; --dimt: rgba(238, 234, 224, .46); --cut: #94E6FF; }
html[data-theme="cobalt"]   { --type: #2448FF; --dimt: rgba(36, 72, 255, .62); --cut: #94E6FF; }
html[data-theme="washi"]    { --ground: #F3ECDD; --type: #1F3F7A; --dimt: rgba(31, 63, 122, .6); --cut: #94E6FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ground); color: var(--type); }
html.opening:not(.cover), html.opening:not(.cover) body { background: #000; }
html.opening, html.opening body { overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow-x: clip; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: #0B0C0C; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the opening's layers: the ground of black (webgl), the characters above it, the typed line above all */
#gl { display: block; pointer-events: none; }
#wall { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none; display: block; }
html:not(.opening) #wall { display: none; }
/* the meadow: daylight and the field behind the stone; the nearest blades in front of anything that lands in them */
#field, #near { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
#field { z-index: 1; }
#near { z-index: 3; }
html.opening:not(.cover) #field, html.opening:not(.sprung) #near { visibility: hidden; }
.type { position: fixed; z-index: 5; top: 30px; left: 0; right: 0; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: #EEEAE0; }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }
html.opening:not(.cover) .wm, html.opening:not(.cover) .foot { visibility: hidden; }

/* the one view */
.stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 40px 16px 9vh; }
.lock { display: flex; flex-direction: column; align-items: center; }
.mw { position: relative; width: var(--s); height: var(--s); flex: none; }
.layer { position: absolute; inset: 0; z-index: 2; perspective: 900px; pointer-events: none; }
.mark { position: absolute; inset: 0; outline: none; border-radius: 22%; -webkit-tap-highlight-color: transparent; }
.mark:focus-visible { box-shadow: 0 0 0 8px var(--ground), 0 0 0 9px var(--type); }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
html.gl .mark .still { visibility: hidden; }

.wm { display: none; position: relative; z-index: 3; color: var(--type); line-height: 0; }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.wm .tittle, .wm .cA { fill: var(--cut); }
.wm .cA { stroke: var(--cut); }
html[data-wm="caps"]  .wm-caps  { display: block; width: calc(var(--s) * 1.36); margin-top: calc(var(--s) * .37); }
html[data-wm="title"] .wm-title { display: block; width: calc(var(--s) * 1.12); margin-top: calc(var(--s) * .3); }
html[data-wm="serif"] .wm-serif { display: block; width: calc(var(--s) * 1.06); margin-top: calc(var(--s) * .29); }
html[data-wm="heavy"] .wm-heavy { display: block; width: calc(var(--s) * 1.06); margin-top: calc(var(--s) * .29); }

/* the foot: one line */
.foot { position: fixed; z-index: 4; left: 16px; right: 16px; bottom: 0; padding-bottom: max(clamp(28px, 6.5vh, 76px), env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 13px; pointer-events: none; }
.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; color: rgba(11, 12, 12, .78); white-space: nowrap; }

/* the shards: chipped from the stone, each turns to show one thing made here */
.shard { position: absolute; z-index: 2; pointer-events: none; text-decoration: none; color: var(--type); outline: none; }
.shard .spin { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: auto; will-change: transform; }
.shard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.shard .face svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.shard .back { transform: rotateY(180deg); }
.shard .back img { position: absolute; display: block; border-radius: 22%; filter: grayscale(1) contrast(.92) brightness(1.04); transition: filter .5s cubic-bezier(.25,.6,.3,1); }
.shard .spin:hover img, .shard:focus-visible img { filter: none; }
.names { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.nm { position: absolute; white-space: nowrap; transform: translateX(-50%); font-size: 11px; line-height: 14px; letter-spacing: .08em; color: var(--type); opacity: 0; pointer-events: auto; }
.nm { text-decoration: none; }
.nm.focus { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.bit { position: absolute; z-index: 2; pointer-events: none; width: 8px; height: 8px; overflow: visible; }

/* paper grain, fine and even */
.grain { position: fixed; inset: 0; z-index: 6; pointer-events: none; background-size: 128px 128px; }
html.opening .grain { opacity: 0; }

@media (min-width: 601px) and (max-width: 1100px) and (min-aspect-ratio: 1/2) and (max-aspect-ratio: 1/1) { :root { --s: clamp(150px, 25vw, 200px); } }
@media (max-width: 600px) {
  :root { --s: min(42vw, 164px); }
  .type { top: 22px; font-size: 11px; letter-spacing: 2.5px; }
  .stage { padding-bottom: 12vh; }
  html[data-wm="caps"] .wm-caps { width: calc(var(--s) * 1.46); }
  .foot p { font-size: 9px; letter-spacing: .24em; margin-right: -.24em; }
}
@media (max-width: 350px) { .foot p { letter-spacing: .14em; margin-right: -.14em; } }
</style>
