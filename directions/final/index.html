(function () {

  try { seen = sessionStorage.getItem("antimony.final") === "1"; } catch (e) {}
  if (/[?&](t=\d|again)/.test(q)) seen = false;
  if (/[?&]rest\b/.test(q)) seen = true;

<style>
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
:root {
  --sky: #94E6FF; --ground: #EEEAE0; --type: #0B0C0C; --dimt: rgba(11, 12, 12, .56); --cut: #1F3F7A;
  --s: clamp(140px, 21vmin, 220px);
  --g: clamp(16px, 2.4vw, 34px);
  --fb: clamp(26px, 6vh, 64px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ground); color: var(--type); }
html.opening:not(.cover), html.opening:not(.cover) body { background: #000; }
html.opening, html.opening body { overflow: hidden; }
body { min-height: 100vh; min-height: 100svh; overflow-x: clip; font: 400 16px/1.5 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--sky); color: #0B0C0C; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1px solid var(--type); outline-offset: 5px; }

/* the opening's layers: the ground of black (webgl), the characters above it, the typed line above all */
#gl { display: block; pointer-events: none; }
#wall { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none; display: block; }
html:not(.opening) #wall { display: none; }
.type { position: fixed; z-index: 5; top: 30px; left: 0; right: 0; text-align: center; white-space: pre; pointer-events: none;
  font: 400 12px/16px "Commit Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; color: #EEEAE0; }
.type span { visibility: hidden; }
.type span.on { visibility: visible; }
.type span.k { color: var(--sky); }
.type span:last-child { letter-spacing: 0; }
html:not(.opening) .type { display: none; }
html.opening:not(.cover) .wm, html.opening:not(.cover) .foot, html.opening:not(.cover) .ui, html.opening:not(.cover) .paper,
html.wait .foot, html.wait .ui, html.opening:not(.cover) .stage { visibility: hidden; }

/* the room: paper, and the daylight that falls across it through a window and the leaves outside */
.paper { position: fixed; inset: 0; z-index: 1; background: var(--ground); overflow: hidden; clip-path: inset(0 0 0 0); transition: clip-path 1.3s cubic-bezier(.65, 0, .35, 1); }
.sun { position: absolute; inset: 0; opacity: 0; transition: opacity 2.6s cubic-bezier(.3, .1, .3, 1); pointer-events: none; }
html.sunup .sun { opacity: 1; }
.sun div { position: absolute; inset: 0; }
.sun > div { inset: -6%; }
.sun canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.sun .cl { animation: cloud 31s ease-in-out infinite; }
.sun .dr { animation: drift 52s ease-in-out infinite alternate; }
.sun .la { animation: swayA 7.4s ease-in-out infinite alternate; transform-origin: 0 0; }
.sun .lb { animation: swayB 5.1s ease-in-out -2s infinite alternate; transform-origin: 8% 0; }
@keyframes cloud { 0%, 34%, 100% { opacity: 1; } 47% { opacity: .58; } 58% { opacity: .9; } 66% { opacity: .78; } 78% { opacity: 1; } }
@keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-1.6vw, .6vh, 0); } }
@keyframes swayA { from { transform: translate3d(0, 0, 0) rotate(0deg); } to { transform: translate3d(.5vw, .35vh, 0) rotate(.55deg); } }
@keyframes swayB { from { transform: translate3d(0, 0, 0) rotate(0deg); } to { transform: translate3d(-.35vw, .3vh, 0) rotate(-.8deg); } }
html.parked .sun * { animation-play-state: paused; }

/* outside: the slot for the meadow render, behind the paper; the paper rises like a blind */
.hero { position: fixed; inset: 0; z-index: 0; display: none; background: #DCE9EE; }
.hero img, .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); display: block; }
.hero video { opacity: 0; transition: opacity 1.2s ease; }
.hero video.on { opacity: 1; }
html.lit .hero { display: block; }
html.outside .paper { clip-path: inset(0 0 100% 0); transition-delay: .32s; }

/* the one view */
.stage { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 40px 16px 9vh; }
.stage, .foot p { transition: opacity .8s cubic-bezier(.25, .6, .3, 1) 1.15s, visibility 0s 0s; }
html.outside .stage, html.outside .foot p { opacity: 0; visibility: hidden; transition: opacity .38s ease 0s, visibility 0s .38s; }
.lock { display: flex; flex-direction: column; align-items: center; }
.mw { position: relative; width: var(--s); height: var(--s); flex: none; }
.mark { position: absolute; inset: 0; outline: none; border-radius: 22%; }
.mark .still { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
html.gl .mark .still { visibility: hidden; }
.wm { color: var(--type); line-height: 0; width: calc(var(--s) * 1.36); margin-top: calc(var(--s) * .37); }
.wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.wm .cA { fill: var(--cut); stroke: var(--cut); }

/* the foot: one line; and the quiet controls either side of it */
.foot { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: 0; padding-bottom: max(var(--fb), env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
.foot p { font-size: 10px; line-height: 12px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; color: var(--dimt); white-space: nowrap; }
.out { display: block; padding: 10px; font: 400 13px/18px "Timeless Serif", Georgia, serif; letter-spacing: .02em; color: var(--type); text-decoration: none; opacity: .74; transition: opacity .3s ease; }
.out:hover, .out:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.out:focus-visible, .snd:focus-visible { outline-offset: -2px; }
.ui { position: fixed; z-index: 2; left: calc(var(--g) - 10px); right: calc(var(--g) - 10px); bottom: calc(max(var(--fb), env(safe-area-inset-bottom)) - 16px); height: 44px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.ui > * { pointer-events: auto; }
.out { background: none; border: 0; cursor: pointer; min-height: 44px; }
.snd { width: 44px; height: 44px; background: none; border: 0; color: var(--type); cursor: pointer; display: grid; place-items: center; opacity: .74; transition: opacity .3s ease; }
.snd:hover { opacity: 1; }
html.outside .out { text-shadow: 0 0 10px rgba(238, 234, 224, .8), 0 0 2px rgba(238, 234, 224, .6); }
html.outside .snd svg { filter: drop-shadow(0 0 3px rgba(238, 234, 224, .8)); }
.snd svg { width: 26px; height: 12px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; }
.snd .w { opacity: 0; transition: opacity .4s ease; }
.snd .f { transition: opacity .4s ease; }
.snd[aria-pressed="true"] .w { opacity: 1; }
.snd[aria-pressed="true"] .f { opacity: 0; }



/* paper grain, fine and even */
.grain { position: fixed; inset: 0; z-index: 6; pointer-events: none; background-size: 128px 128px; }
html.opening .grain { opacity: 0; }

@media (min-width: 601px) and (max-width: 1100px) and (min-aspect-ratio: 1/2) and (max-aspect-ratio: 1/1) { :root { --s: clamp(150px, 25vw, 200px); } }
@media (max-width: 600px) {
  :root { --s: min(42vw, 164px); }
  .type { top: 22px; font-size: 11px; letter-spacing: 2.5px; }
  .stage { padding-bottom: 14vh; }
  .wm { width: calc(var(--s) * 1.46); }
  .foot { padding-bottom: calc(max(var(--fb), env(safe-area-inset-bottom)) + 34px); }
  .foot p { font-size: 9px; letter-spacing: .24em; margin-right: -.24em; }
}
@media (max-width: 350px) { .foot p { letter-spacing: .14em; margin-right: -.14em; } }
@media (prefers-reduced-motion: reduce) {
  .sun *, .sun { animation: none !important; transition: none !important; }
  .paper, .stage, .foot p { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>

<script>
/* Everything below waits for the first paint: the page (or the black of the opening) is on screen before any of it runs. */
function main() {
"use strict";
var html = document.documentElement;
var $ = function (id) { return document.getElementById(id); };
var mark = $("mark"), canvas = $("gl"), wall = $("wall"), typeEl = $("type"), foot = $("foot"), grainEl = $("grain");
var WMC = $("wm"), ui = $("ui"), say = $("say"), hero = $("hero"), outBtn = $("out"), sndBtn = $("snd"), stage = $("stage");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var FREEZE = /[?&]t=(\d+)/.exec(location.search); FREEZE = FREEZE ? +FREEZE[1] / 1000 : -1;
var DEBUG = /[?&]debug/.test(location.search);
var opening = html.classList.contains("opening");
var KEY = "antimony.final";
function store(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function remember() { store(KEY, "1"); }

/* the stone, in paper light */
var TH = { a: [.152, .145, .133], b: [.056, .053, .049], rim: 0, cr: [.933, .918, .878, .3] };
function hex(c, k) { return "#" + c.map(function (v) { return ("0" + Math.round(Math.min(1, v * (k || 1)) * 255).toString(16)).slice(-2); }).join(""); }
var seedN = 1; function rnd() { seedN = (seedN * 16807) % 2147483647; return (seedN - 1) / 2147483646; }

/* ---------- grain, baked once ---------- */
(function () {
  var n = 256, c = document.createElement("canvas"); c.width = c.height = n;
  var x = c.getContext("2d"), d = x.createImageData(n, n), p = d.data;
  for (var i = 0; i < p.length; i += 4) {
    var r = Math.random();
    if (r < .42) { p[i] = 52; p[i + 1] = 46; p[i + 2] = 38; p[i + 3] = 7 + Math.random() * 15; }
    else if (r < .5) { p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = 10 + Math.random() * 12; }
  }
  x.putImageData(d, 0, 0);
  grainEl.style.backgroundImage = "url(" + c.toDataURL() + ")";
})();

/* ---------- the capitals, wide tracked, spaced by eye: the crystal A sits closer to N, the T and I a touch tighter ---------- */
(function () {
  var svg = WMC.querySelector("svg"), ps = svg.querySelectorAll("g > path"), TR = 440;
  var adj = [-130, -30, -55, 5, -15, 0, -35], x = 0, sum = 0;
  for (var i = 0; i < ps.length; i++) { ps[i].setAttribute("transform", "translate(" + x + " 0)"); if (i < adj.length) { x += TR + adj[i]; sum += adj[i]; } }
  svg.setAttribute("viewBox", "-10 -705 " + (6338 + TR * 7 + sum) + " 715");
})();

/* ================= daylight: a window's light across the paper, leaves moving in it =================
   Painted once, small, and let the browser's scaling soften it; the motion is only compositor transforms. */
var sunL = $("sunL"), sunA = $("sunA"), sunB = $("sunB");
function leaf(x, cx, cy, len, wid, ang) {

    var s = 1 - .7 * GATHER(gp), cx = MC.x * wdpr, cy = MC.y * wdpr;
    wctx.globalAlpha = fa; wctx.setTransform(s, 0, 0, s, cx * (1 - s), cy * (1 - s)); wctx.drawImage(field, 0, 0);
    wctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  for (var n = 0; n < parts.length; n++) {
    var p = parts[n]; if (t >= p.sn) continue;
    var k = GATHER(seg(t, T.g0 + p.d, T.g0 + p.d + GD));
    wctx.globalAlpha = wa * (p.a0 + (p.a1 - p.a0) * k);
    blit(wctx, p.c, p.x0 + (p.x1 - p.x0) * k, p.y0 + (p.y1 - p.y0) * k);
  }
  wctx.globalAlpha = 1;
}

/* ================= the stone, at rest ================= */
var shards = [], kintT = [0, 0, 0], kintA = [0, 0, 0], crT = 0;
function toU(cx, cy) { return [(cx - M.x) / K, (cy - M.y) / K]; }
addEventListener("pointermove", function (e) {
  var now = performance.now();
  if (html.classList.contains("opening") || isOut) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = now; ptr.in = true; return; }
  var quiet = shards.length ? .35 : 1;
  if (ptr.in && now - ptr.t < 400) {
    var S = K * 100, cx = M.x + 50 * K, cy = M.y + 51.5 * K;
    var g = (.25 + .75 * Math.max(0, 1 - Math.hypot(e.clientX - cx, e.clientY - cy) / (S * 1.8))) * quiet;
    var dx = (e.clientX - ptr.x) / S, dy = (e.clientY - ptr.y) / S;
    W.tv = Math.max(-2, Math.min(2, W.tv + 2 * dx * g));
    W.zv = Math.max(-28, Math.min(28, W.zv + 11 * dy * g));
    W.rip = Math.min(1.1, W.rip + .32 * (Math.abs(dx) + Math.abs(dy)) * g);
  }
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = now; ptr.in = true;
  wake();
}, { passive: true });
document.addEventListener("pointerleave", function () { ptr.in = false; crT = 0; });
addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") ptr.in = false; }, { passive: true });
addEventListener("pointerdown", function (e) {
  if (html.classList.contains("opening") || isOut) return;
  if (e.target.closest && e.target.closest(".ui")) return;
  var u = toU(e.clientX, e.clientY);
  askTilt();
  if (sdHalf(UG, 0, 6, u[0], u[1]) < 0) {
    var dx = (50 - u[0]) / 100;
    W.tv += Math.max(-1.1, Math.min(1.1, dx * 1.7)) + (Math.abs(dx) < .05 ? .6 : 0); W.rip = Math.min(1.1, W.rip + .35);
  }
  wake();
}, { passive: true });
/* ---------- rest ---------- */
var t0 = performance.now(), running = false, visible = true, last = 0, clockOff = 0;
function restDraw(clock) { draw({ clock: clock, t: BIG, rest: true, off: SHUT, fl: NOFL, ds: ALLP }); }
function restFrame(now) {
  if (!running) return;
  var dt = Math.min(.1, (now - (last || now)) / 1000); last = now;
  var n = Math.max(1, Math.ceil(dt / .008)); for (var i = 0; i < n; i++) step(dt / n);
  crA += (crT - crA) * Math.min(1, dt * (crT ? 6 : 4));
  for (var k = 0; k < 3; k++) { var a = (now - kintT[k]) / (kintA[k] >= 1 ? 1700 : 380); HA[k * 3 + 1] = kintA[k] * Math.pow(Math.max(0, 1 - a), 2); }
  restDraw((now - t0) / 1000 + clockOff);
  waterSound(Math.min(1, Math.abs(W.tv) * 1.1 + W.rip * .55), dt);
  if (visible && !parked) requestAnimationFrame(restFrame); else running = false;
}
wake = function () { if (!running && visible && !parked && !reduced && FREEZE < 0 && !html.classList.contains("opening")) { running = true; last = 0; requestAnimationFrame(restFrame); } else if (!running && !html.classList.contains("opening")) { for (var k = 0; k < 3; k++) HA[k * 3 + 1] = 0; restDraw(30); } };
document.addEventListener("visibilitychange", function () { visible = !document.hidden; if (A.c && A.on) { if (document.hidden) A.c.suspend(); else A.c.resume(); } wake(); });
function startRest(clock) {
  measure(); frameMark();
  clockOff = clock - (performance.now() - t0) / 1000;
  if (reduced || FREEZE >= 0) { restDraw(clock); return; }
  wake();
}
var lastW = innerWidth;
addEventListener("resize", function () {
  if (html.classList.contains("opening")) return;
  measure(); frameMark(); if (!running) restDraw(30);
});
fontsReady().then(begin, begin);

function begin() {
  html.classList.remove("wait");
  if (!opening) {
    remember();
    paintSun();
    startRest(30);
    fadeIn([foot, ui]);
    requestAnimationFrame(sunUp);
    return;
  }
  measure(); frameFull(); buildWall(); paintSun();
  if (performance.mark) performance.mark("opening-start");
  var start = performance.now(), done = false, shown = 0;

  function at(t) {
    /* 1. the typed line */
    var n = t < T.type0 ? 0 : Math.min(ALL.length, Math.floor((t - T.type0) / STEP) + 1);
    if (n !== shown) { for (var i = 0; i < spans.length; i++) spans[i].className = (i < LABEL.length ? "k" : "") + (i < n ? " on" : ""); shown = n; }
    typeEl.style.opacity = (1 - seg(t, T.fade0, T.fade1)).toFixed(3);
    /* 2. the characters */
    drawWall(t);
    /* 3 and 4. the join, the paper */
    var j = VAULT(seg(t, T.j0, T.j1)), off = [OPEN[0] * (1 - j), OPEN[1] * (1 - j)];
    var fh = o3(seg(t, T.f0, T.f0 + .55)) * 1.1 - .05;
    var fa = o3(seg(t, T.f0, T.f0 + .08)) * (1 - io3(seg(t, T.f0 + .3, T.d0 + .35)));
    var tau = Math.max(0, t - T.j1), env = Math.exp(-ZE * OM * tau), amp = t > T.j1 ? .08 : 0;
    W.th = amp * env * Math.sin(OM * tau); W.tv = amp * env * OM * (Math.cos(OM * tau) - ZE * Math.sin(OM * tau));
    W.gx = -W.th * 22; W.z = 0; W.rip = amp * 3 * env;
    var band = Math.max(90, maxD * .16), dk = FLOOD(seg(t, T.d0, T.d1));
    var ds = t < T.d0 ? NODS : [-band + (maxD + band * 2) * dk, band, t >= T.d1 ? 1 : 0];
    draw({ clock: t, t: t, rest: false, off: off, fl: [fh, fa, .45], ds: ds });
    if (!html.classList.contains("cover")) html.classList.add("cover");
    grainEl.style.opacity = dk.toFixed(3);
    if (t > T.d0 + .35) sunUp();
  }
  function tick(now) {
    if (done) return;
    var t = FREEZE >= 0 ? FREEZE : (now - start) / 1000;
    if (t >= T.end) { finish(t); return; }
    at(t);
    if (FREEZE < 0) requestAnimationFrame(tick);
  }
  function finish(t) {
    if (done) return; done = true;
    if (performance.mark) performance.mark("opening-end");
    var skipped = t < T.end;
    html.classList.remove("opening", "cover");
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, wall.width, wall.height); field = null; parts = [];
    grainEl.style.opacity = "";
    remember();
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { removeEventListener(ev, skip, true); });
    if (skipped) { W.th = W.tv = W.z = W.rip = 0; fadeIn([mark, WMC, foot, ui]); }
    sunUp();
    startRest(Math.max(t, T.e0));
  }
  function skip() { if (!done && FREEZE < 0) finish((performance.now() - start) / 1000); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, skip, { passive: true, capture: true }); });
  addEventListener("resize", function () { if (!done && innerWidth !== lastW) skip(); });
  if (FREEZE >= 0) window.__seek = function (s) { if (s >= T.end) finish(s); else at(s); };
  if (FREEZE >= T.end) { finish(FREEZE); return; }
  at(0);
  requestAnimationFrame(function (now) { start = now; tick(now); });
}
}
requestAnimationFrame(function () { setTimeout(main, 0); });
</script>
