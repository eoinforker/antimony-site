<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0C"><meta name="description" content="Antimony builds software for the people who make the work. Our first product is Orbe.">
<title>Antimony, Night City</title>
<style>
/* Night City. A corporate ident on a deep field: one typed line; the seam drawn at 16 degrees; it opens into the cavity; the crystal is drawn and lit; the stone closes around it; the caps arrive, cut on the seam. Then it settles to the corner and the page arrives. */
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifItalicVF.woff2") format("woff2"); font-weight: 200 700; font-style: italic; font-display: block; }
@font-face { font-family: "Commit Mono"; src: url("assets/fonts/CommitMono-Latin-VF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
:root { --ink: #0B0C0C; --stone: #141311; --paper: #EEEAE0; --sky: #94E6FF; --prussian: #1F3F7A; --dim: rgba(238,234,224,.52); --faint: rgba(238,234,224,.34); --hair: rgba(238,234,224,.12); --g: 40px; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); }
body { background: var(--grain, none) var(--ink); color: var(--paper); font: 400 18px/1.56 "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100svh; overflow-x: hidden; }
body.opening { overflow: hidden; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--sky); color: var(--ink); }
:focus-visible { outline: 1px solid var(--sky); outline-offset: 4px; }
svg { display: block; overflow: visible; }

/* the ident */
#field { position: fixed; inset: 0; z-index: 30; pointer-events: none; background: var(--grain, none), radial-gradient(120% 90% at 50% 47%, #0A0C0D 0%, #050606 55%, #020202 100%); }
#line { position: fixed; left: 0; right: 0; top: 38px; z-index: 32; text-align: center; font: 400 11.5px/1.9 "Commit Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--paper); pointer-events: none; padding: 0 20px; }
#line .lab { color: var(--sky); }
#line i { font-style: normal; visibility: hidden; }
#line i.on { visibility: visible; }
#ident { position: absolute; left: 0; top: 0; z-index: 31; }
#ident a { position: absolute; display: block; border-radius: 4px; }
#emb, #caps { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* the page: one quiet column, headed by the lockup the ident settles into */
.page { opacity: 0; }
body.done .page { opacity: 1; }
main { position: relative; z-index: 1; padding: 0 var(--g); min-height: 100svh; }
.col { max-width: 560px; margin: 0 auto; padding: max(150px, 26vh) 0 120px; }
.slot { height: 28px; margin-bottom: 60px; }
.col p { text-wrap: pretty; }
.col p + p { margin-top: 1em; }
.col a.in { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; text-decoration-color: rgba(238,234,224,.35); transition: text-decoration-color .3s ease; }
.col a.in:hover { text-decoration-color: var(--sky); }
.made { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--hair); font-size: 15px; line-height: 1; color: var(--dim); }
.made li { display: flex; align-items: center; height: 20px; }
.made li.where { margin-left: auto; }
.made a { display: inline-flex; align-items: center; gap: 9px; transition: color .35s ease; }
.made img { width: 18px; height: 18px; border-radius: 4.5px; filter: grayscale(1) brightness(.92); opacity: .6; transition: filter .45s ease, opacity .45s ease; }
.made a:hover, .made a:focus-visible { color: var(--paper); }
.made a:hover img, .made a:focus-visible img { filter: none; opacity: 1; }
.made .by { color: var(--faint); margin-left: -3px; transition: color .35s ease; }
.made a:hover .by { color: var(--dim); }

@media (max-width: 720px) {
  :root { --g: 20px; }
  body { font-size: 17px; }
  .col { padding-top: 26px; }
  .slot { height: 26px; margin-bottom: 92px; }
  .made { margin-top: 34px; gap: 16px 22px; }
  .made li.where { margin-left: 0; }
  #line { font-size: 10.5px; letter-spacing: .1em; top: 30px; }
  #line .lab { display: block; }
}
@media (prefers-reduced-motion: reduce) { .made img, .made a, .col a.in { transition: none; } }

      <li><a href="https://idyll.day"><img src="assets/work/idyll.svg" alt="">Idyll</a></li>

  </div>

  cv.setAttribute("d", "M" + Q.cav.map(([x, y]) => { const ax0 = 50 + (51.5 - y) * T16, px = ax0 + (x - ax0) * o; return px.toFixed(3) + " " + y; }).join("L") + "Z");
  cv.style.opacity = t < T.cv0 ? 0 : 1;
  // the crystal, drawn then lit
  gl.style.strokeDashoffset = glLen * (1 - inOut(k(t, T.gl0, T.gl1)));
  gl.style.opacity = t < T.gl0 ? 0 : 1;
  const lt = out3(k(t, T.lt0, T.lt1));
  gf.style.opacity = lt; emb.fc.style.opacity = (.28 * lt).toFixed(3);
  // the stone closes around it in one move, along the seam's normal
  const sc = outX(k(t, T.st0, T.st1)), d = 24 * (1 - sc);
  pieces[0].setAttribute("transform", `translate(${(-d * C16).toFixed(3)} ${(-d * S16).toFixed(3)})`);
  pieces[1].setAttribute("transform", `translate(${(d * C16).toFixed(3)} ${(d * S16).toFixed(3)})`);
  const so = out3(k(t, T.st0, T.st0 + .22)); pieces.forEach(p => p.style.opacity = so);
  hair.style.opacity = 1 - inOut(k(t, T.st0 - .2, T.st0 + .25));
  hair.style.visibility = t >= T.st0 + .25 ? "hidden" : "visible";
  // the caps arrive behind a slanted edge
  const wd = inOut(k(t, T.wd0, T.wd1));
  cap.wipe.setAttribute("transform", `translate(${(-1000 + wd * (CVB[2] + 2200)).toFixed(1)} 0)`);
  // settle into the head of the column
  const e = inOut(k(t, T.set0, T.set1));
  if (e !== lastE) { place(e); lastE = e; }
  $("#field").style.opacity = 1 - inOut(k(t, T.set0 + .15, T.set1));
  $(".page").style.opacity = out3(k(t, T.page0, T.page1));
}

let t0 = 0, raf = 0, ended = false;
function finish() {
  if (ended) return; ended = true; cancelAnimationFrame(raf); lastE = -1; render(T.end + 1);
  body.classList.remove("opening"); body.classList.add("done"); $("#field").style.display = "none"; ln.style.display = "none";
  $(".page").style.opacity = ""; try { sessionStorage.setItem("nc-seen", "1"); } catch (e) {}
}
function loop(now) { const t = (now - t0) / 1000; if (t >= T.end) return finish(); render(t); raf = requestAnimationFrame(loop); }
const skip = () => { if (!ended) finish(); };
addEventListener("resize", () => { layout(); lastE = -1; render(ended ? T.end + 1 : (performance.now() - t0) / 1000); });

/* the faintest parallax between stone and crystal */
let px = innerWidth / 2, py = innerHeight / 2, pend = false;
function tilt() { pend = false; for (const s of marks) { const r = s.getBoundingClientRect(); if (!r.width || r.bottom < 0 || r.top > innerHeight) continue;
  const dx = (px - (r.left + r.width / 2)) / innerWidth, dy = (py - (r.top + r.height / 2)) / innerHeight;
  const tx = Math.max(-1.4, Math.min(1.4, -dx * 2.4)), ty = Math.max(-1.4, Math.min(1.4, -dy * 2.4));
  s.crys.setAttribute("transform", `translate(${tx.toFixed(3)} ${ty.toFixed(3)})`);
  s.fc.setAttribute("opacity", (.28 + Math.max(-.07, Math.min(.07, dx * .14))).toFixed(3)); } }
if (!still) addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; px = e.clientX; py = e.clientY; if (!pend) { pend = true; requestAnimationFrame(tilt); } }, { passive: true });

layout();
const q = new URLSearchParams(location.search), at = q.has("t") ? parseFloat(q.get("t")) : null;
window.__T = T; window.__render = render;
if (at !== null) { render(at); if (at >= T.end) finish(); }
else if (still || seen) finish();
else {
  render(0);
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, skip, { passive: true, once: true }));
  const go = () => { t0 = performance.now(); raf = requestAnimationFrame(loop); };
  (document.fonts ? Promise.all([document.fonts.load('400 12px "Commit Mono"'), document.fonts.load('400 18px "Timeless Serif"'), document.fonts.load('italic 400 18px "Timeless Serif"')]) : Promise.resolve()).catch(() => {}).finally(go);
}
})();
</script>
