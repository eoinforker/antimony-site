@font-face { font-family: "Timeless Serif"; src: url("assets/fonts/TimelessSerifVF.woff2") format("woff2"); font-weight: 200 700; font-display: block; }
:root { --ink: #050608; --paper: #EEEAE0; --sky: #94E6FF; --cobalt: #2448FF; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font-family: "Timeless Serif", Georgia, serif; -webkit-font-smoothing: antialiased; touch-action: none; }

body.ready #scene { opacity: 1; }
body.shot *, body.shot { transition: none !important; }
#type { position: fixed; top: max(28px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font: 400 12px/1 "Commit Mono", ui-monospace, monospace; letter-spacing: .32em; color: var(--paper); opacity: 0; pointer-events: none; white-space: pre; padding-left: .32em; }
#type .lab { color: var(--sky); }
#type mark { background: var(--sky); color: #06080c; }
.ui { position: fixed; left: max(28px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform 1.2s cubic-bezier(.2,.7,.1,1); pointer-events: none; }
.ui.on { opacity: 1; transform: none; }
.ui .wm { display: block; width: 112px; color: var(--paper); --lit: var(--sky); pointer-events: auto; }
.ui .wm svg { display: block; width: 100%; height: auto; overflow: visible; }
.ui p { margin: 12px 0 0; font-size: 13px; line-height: 1.35; color: rgba(238,234,224,.62); letter-spacing: .01em; }
#snd { position: fixed; top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); width: 40px; height: 40px; border: 0; background: none; padding: 0; color: var(--paper); opacity: 0; cursor: pointer; transition: opacity .9s; border-radius: 50%; }
#snd.on { opacity: .58; }
#snd.on:hover, #snd:focus-visible { opacity: 1; }
#snd:focus-visible, .ui a:focus-visible, .sr:focus-visible { outline: 1px solid var(--sky); outline-offset: 3px; }
#snd svg { width: 22px; height: 22px; display: block; margin: auto; overflow: visible; }
#snd .w { opacity: 0; transition: opacity .4s; }
#snd.live .w { opacity: 1; }
#snd .x { transition: opacity .4s; }
#snd.live .x { opacity: 0; }
.sr { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
.sr:focus-visible { clip-path: none; width: auto; height: auto; padding: 8px 12px; background: rgba(5,6,8,.85); color: var(--paper); font: 13px "Timeless Serif", Georgia, serif; border: 0; }
#work { position: fixed; right: max(28px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom)); font: 400 11px/1 "Commit Mono", ui-monospace, monospace; letter-spacing: .14em; opacity: 0; transition: opacity .9s; pointer-events: none; }
#work.on { opacity: 1; pointer-events: auto; }
#work a { color: rgba(238,234,224,.5); text-decoration: none; margin-left: 20px; transition: color .3s; }
#work a:hover, #work a:focus-visible { color: var(--sky); }
#work a:focus-visible { outline: 1px solid var(--sky); outline-offset: 4px; }
@media (max-width: 600px) {
  .ui { left: 16px; bottom: max(18px, env(safe-area-inset-bottom)); }
  .ui .wm { width: 96px; }
  #snd { right: 10px; top: max(10px, env(safe-area-inset-top)); }
  #work { right: auto; left: 16px; bottom: auto; top: max(24px, env(safe-area-inset-top)); }
  #work a { margin: 0 14px 0 0; }
}
