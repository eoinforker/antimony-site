  .mark { display: block; width: var(--mark); height: var(--mark); }

  .js .brand svg { display: none; }

  .col i { font-style: italic; }

  .col .made a { text-decoration-color: rgba(11, 12, 12, .18); }

  .col .c { visibility: hidden; transition: background-color .32s; }
  .col .c.on { visibility: visible; }
  .col .c.hl { background: var(--sky); transition: none; }

  .col .cur.done { visibility: hidden; }

  .first .col, .first .vert { opacity: 0; transition: opacity .9s cubic-bezier(.3, 0, .2, 1); }

  .first.lit .vert { opacity: 1; transition-delay: .5s; }
  .first .made { opacity: 0; transition: opacity .8s; }
  .first .made.on { opacity: 1; }

  .flat .brand svg { display: block; }

      ink[o] = Math.round(Math.max(mFacet[i], mTitLit[i]) * 255);
      ink[o + 1] = Math.round(bGem[i] * 255);
      ink[o + 2] = Math.round(Math.min(1, dist[i] / (dmax * .82)) * 255);
      ink[o + 3] = Math.round(mTit[i] * 255);
    }
    if (reliefT) { gl.deleteTexture(reliefT); gl.deleteTexture(inkT); }
    reliefT = tex(W, H, rel, false);
    inkT = tex(W, H, ink, false);
  }

  /* ---------- size ---------- */

  function size() {
    var w = document.documentElement.clientWidth, h = Math.max(mainEl.offsetHeight, window.innerHeight);
    var d = Math.min(window.devicePixelRatio || 1, 2);
    var budget = 3.6e6; // device pixels; keeps the live pass well inside a frame
    if (w * h * d * d > budget) d = Math.max(1, Math.sqrt(budget / (w * h)));
    if (w === cssW && h === cssH && d === dpr) return false;
    cssW = w; cssH = h; dpr = d;
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * d); canvas.height = Math.round(h * d);
    return true;
  }

  /* ---------- light ---------- */

  var REST_AZ = Math.atan2(-.72, -1), REST_EL = .46;
  var light = { x: Math.cos(REST_AZ), y: Math.sin(REST_AZ), e: REST_EL };
  var target = { x: light.x, y: light.y, e: light.e };
  var pool = { x: 0, y: 0, a: 0, ta: 0 };
  var opening = { t0: 0, run: false, phys: 0, fall: 0, gain: 1, ink: 1, tit: 1, q: null };

  function ease(t) { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); }
  function easeOut(t) { t = Math.min(1, Math.max(0, t)); return 1 - Math.pow(1 - t, 3); }
  function inOut(t) { t = Math.min(1, Math.max(0, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function draw() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(PM.p);
    var u = PM.u;
    gl.uniform2f(u.uSize, cssW, cssH); gl.uniform1f(u.uDpr, canvas.width / cssW);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, paperN); gl.uniform1i(u.uPN, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, reliefT); gl.uniform1i(u.uR, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, inkT); gl.uniform1i(u.uI, 2);
    gl.uniform4f(u.uRect, rect[0], rect[1], rect[2], rect[3]);
    gl.uniform2f(u.uTex, texel[0], texel[1]);
    var l = Math.hypot(light.x, light.y) || 1;
    gl.uniform2f(u.uLdir, light.x / l, light.y / l);
    gl.uniform1f(u.uElev, light.e);
    gl.uniform1f(u.uPhys, opening.phys);
    gl.uniform1f(u.uFall, opening.fall);
    gl.uniform1f(u.uGain, opening.gain);
    gl.uniform3f(u.uPool, pool.x, pool.y, pool.a);
    gl.uniform1f(u.uInk, opening.ink);
    gl.uniform1f(u.uTit, opening.tit);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!canvas.classList.contains('on')) canvas.classList.add('on');
  }

  var raf = 0, last = 0, drift = false, tilted = false, touchHold = 0;
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }

  function frame(now) {
    raf = 0;
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    var busy = false;

    if (opening.run) {
      var t = FREEZE >= 0 ? FREEZE : (now - opening.t0) / 1000, q = opening.q;
      // the lamp comes up from below the horizon on the left and swings round to rest
      var a = Math.min(1, Math.max(0, (t - q.s0) / (q.s1 - q.s0)));
      var az = q.az0 + (REST_AZ + 2 * Math.PI - q.az0) * inOut(a);
      light.x = target.x = Math.cos(az); light.y = target.y = Math.sin(az);
      // it grazes first, the eye adapts, then the lamp climbs to rest
      var e = t < q.r0 ? q.e0 + (q.e1 - q.e0) * ease((t - q.s0) / (q.r0 - q.s0)) : q.e1 + (REST_EL - q.e1) * inOut((t - q.r0) / (q.s1 - q.r0));
      light.e = target.e = e;
      var b = q.b0 + (1 - q.b0) * ease((t - q.g0) / (q.g1 - q.g0));
      opening.gain = b / Math.sin(Math.max(e, .012));
      opening.fall = 1 - ease((t - q.g0) / (q.g1 - q.g0 + .3));
      opening.phys = 1 - ease((t - q.s1 + .35) / .55);
      opening.ink = easeOut((t - q.i0) / (q.i1 - q.i0));
      opening.tit = easeOut((t - q.t0) / (q.t1 - q.t0));
      if (q.tag) tagTo(t);
      if (t > q.lit) lightUp();
      setTo(t);
      if (FREEZE < 0 && t >= q.end) { opening.run = false; opening.phys = 0; opening.fall = 0; opening.ink = 1; opening.tit = 1; plain(); }
      busy = true;
    }

    if (drift && !tilted && now > touchHold && !(opening.run && opening.phys > 0)) {
      var ts = now / 1000;
      var az = REST_AZ + Math.sin(ts * .23) * .7 + Math.sin(ts * .11 + 1.7) * .35;
      target.x = Math.cos(az); target.y = Math.sin(az); target.e = REST_EL + Math.sin(ts * .17) * .12;
      busy = true;
    }

    // the lamp follows at once; a short ease keeps it from jittering
    var k = 1 - Math.exp(-dt * 30);
    var dx = target.x - light.x, dy = target.y - light.y, de = target.e - light.e, da = pool.ta - pool.a;
    light.x += dx * k; light.y += dy * k; light.e += de * k; pool.a += da * (1 - Math.exp(-dt * 6));
    if (Math.abs(dx) + Math.abs(dy) + Math.abs(de) > 1e-4 || Math.abs(da) > 1e-4) busy = true;

    draw();
    if (busy) raf = requestAnimationFrame(frame);
  }

  function aim(px, py) {
    var vx = px - centre[0], vy = py - centre[1], d = Math.hypot(vx, vy);
    var reach = Math.max(280, Math.min(cssW, window.innerHeight) * .55);
    var f = Math.min(1, d / reach);
    if (d < 1) { vx = target.x; vy = target.y; d = 1; }
    var w = Math.min(1, d / 30);
    target.x = target.x * (1 - w) + (vx / d) * w;
    target.y = target.y * (1 - w) + (vy / d) * w;
    // over the crystal the lamp is nearly overhead and the facets catch it; further out it rakes
    target.e = 1.32 - .96 * Math.sqrt(f);
    pool.x = px; pool.y = py; pool.ta = .022;
    kick();
  }

  function start() {
    size();
    bakeRelief();
    if (still) { plain(); draw(); return; }
    opening.q = seen
      ? { az0: 2.9, e0: .12, e1: .16, s0: 0, r0: .05, s1: .8, b0: 1, g0: 0, g1: .01, i0: .2, i1: .8, t0: .5, t1: .85, lit: 0, end: 1.3 }
      : { tag: true, az0: 2.55, e0: -.03, e1: .11, s0: .4, r0: 1.55, s1: 2.25, b0: .028, g0: .95, g1: 1.6, i0: 1.7, i1: 2.55, t0: 2.3, t1: 2.7, lit: 1.15, end: 0 };
    if (!seen) {
      prepTag(.2);
      prepType(1.55);
      opening.q.end = Math.max(2.9, setter.end + 2.3);
    } else { plain(); }
    opening.t0 = performance.now(); opening.run = true;
    opening.phys = 1; opening.fall = 1; opening.gain = .03 / .012; opening.ink = 0; opening.tit = 0;
    light.e = target.e = opening.q.e0; light.x = target.x = Math.cos(opening.q.az0); light.y = target.y = Math.sin(opening.q.az0);
    draw();
    kick();

    var fine = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
      aim(e.clientX + window.scrollX, e.clientY + window.scrollY);
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      target.x = Math.cos(REST_AZ); target.y = Math.sin(REST_AZ); target.e = REST_EL; pool.ta = 0; kick();
    });
    // a finger on the sheet carries the lamp with it
    function touch(e) {
      var t = e.touches[0]; if (!t) return;
      touchHold = performance.now() + 1e9;
      aim(t.clientX + window.scrollX, t.clientY + window.scrollY);
    }
    window.addEventListener('touchstart', touch, { passive: true });
    window.addEventListener('touchmove', touch, { passive: true });
    window.addEventListener('touchend', function () { touchHold = performance.now() + 900; pool.ta = 0; kick(); }, { passive: true });
    if (!fine) {
      drift = true;
      window.addEventListener('deviceorientation', function (e) {
        if (e.gamma == null || e.beta == null || performance.now() < touchHold) return;
        tilted = true;
        var gx = Math.max(-1, Math.min(1, e.gamma / 28)), gy = Math.max(-1, Math.min(1, (e.beta - 40) / 28));
        var m = Math.hypot(gx, gy);
        if (m < .08) { gx = Math.cos(REST_AZ) * .08; gy = Math.sin(REST_AZ) * .08; m = .08; }
        target.x = -gx / m; target.y = -gy / m; target.e = .9 - .5 * Math.min(1, m);
        kick();
      }, { passive: true });
    }
  }

  var rz = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { size(); bakeRelief(); draw(); }, 140);
  });
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); flat(); });

  // start when the face has loaded, so nothing shifts under the press
  var go = function () { try { start(); } catch (err) { flat(); } };
  if (document.fonts && document.fonts.load) {
    Promise.race([Promise.all([document.fonts.load('16px "Timeless Serif"'), document.fonts.load('italic 16px "Timeless Serif"')]), new Promise(function (r) { setTimeout(r, 450); })]).then(go, go);
  } else { go(); }
})();
</script>
</body>
</html>
